/**
 * Backup and Restore Service
 * Full JSON snapshot export/import and CSV for spreadsheets.
 */





/**
 * Generate full backup object containing all stores
 */
async function createBackupData() {
  const [products, recipes, promotions, orders, stockMovements, costHistory, expenses, rawSettings] = await Promise.all([
    db.getAll('products'),
    db.getAll('recipes'),
    db.getAll('promotions'),
    db.getAll('orders'),
    db.getAll('stock_movements'),
    db.getAll('cost_history'),
    db.getAll('expenses'),
    db.getAll('settings')
  ]);

  // CRITICAL SECURITY FILTER: Strip github_token and github_gist_id
  // Never expose personal access tokens in backup JSON or cloud Gists
  const safeSettings = (rawSettings || []).filter(s => 
    s.key !== 'github_token' && 
    s.key !== 'github_gist_id'
  );

  const timestamp = new Date().toISOString();

  // Update last_backup_date setting
  await db.putItem('settings', { key: 'last_backup_date', value: timestamp });
  await store.refreshAll();

  return {
    meta: {
      appName: 'Muki Stall Manager',
      schemaVersion: 1,
      exportTimestamp: timestamp,
      summary: {
        products: products.length,
        recipes: recipes.length,
        promotions: promotions.length,
        orders: orders.length,
        stockMovements: stockMovements.length,
        costHistory: costHistory.length,
        expenses: expenses.length
      }
    },
    data: {
      products,
      recipes,
      promotions,
      orders,
      stock_movements: stockMovements,
      cost_history: costHistory,
      expenses,
      settings: safeSettings
    }
  };
}

/**
 * Trigger download of full JSON backup
 */
async function downloadJsonBackup() {
  const backup = await createBackupData();
  const dateStr = new Date().toISOString().split('T')[0];
  const filename = `muki-stall-backup-${dateStr}.json`;

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  triggerFileDownload(blob, filename);
  return backup;
}

/**
 * Validate a backup file content before restoring
 */
function validateBackupFile(parsedJson) {
  if (!parsedJson || typeof parsedJson !== 'object') {
    throw new Error('Invalid file format. Must be a valid JSON object.');
  }

  const data = parsedJson.data || parsedJson; // support flat or nested
  if (!data.products && !data.orders) {
    throw new Error('Unrecognized backup format. Missing core products or orders collections.');
  }

  return {
    valid: true,
    meta: parsedJson.meta || {},
    counts: {
      products: Array.isArray(data.products) ? data.products.length : 0,
      orders: Array.isArray(data.orders) ? data.orders.length : 0,
      promotions: Array.isArray(data.promotions) ? data.promotions.length : 0,
      expenses: Array.isArray(data.expenses) ? data.expenses.length : 0,
      recipes: Array.isArray(data.recipes) ? data.recipes.length : 0
    },
    raw: data
  };
}

/**
 * Restore data from parsed backup
 */
async function restoreFromBackup(backupData, mode = 'replace') {
  const data = backupData.data || backupData.raw || backupData;

  // Preserve the current device's local github_token and gistId
  const currentToken = (await db.getById('settings', 'github_token'))?.value || '';
  const currentGistId = (await db.getById('settings', 'github_gist_id'))?.value || '';

  const incomingSettings = (data.settings || []).filter(s => 
    s.key !== 'github_token' && 
    s.key !== 'github_gist_id'
  );

  const storesToRestore = [
    { name: 'products', items: data.products },
    { name: 'recipes', items: data.recipes },
    { name: 'promotions', items: data.promotions },
    { name: 'orders', items: data.orders },
    { name: 'stock_movements', items: data.stock_movements },
    { name: 'cost_history', items: data.cost_history },
    { name: 'expenses', items: data.expenses },
    { name: 'settings', items: incomingSettings }
  ];

  for (const { name, items } of storesToRestore) {
    if (!items || !Array.isArray(items)) continue;

    if (mode === 'replace') {
      await db.clearStore(name);
    }

    await db.bulkPut(name, items);
  }

  // Restore this device's own github token and gistId
  if (currentToken) {
    await db.putItem('settings', { key: 'github_token', value: currentToken });
  }
  if (currentGistId) {
    await db.putItem('settings', { key: 'github_gist_id', value: currentGistId });
  }

  // Record restoration timestamp
  await db.putItem('settings', { key: 'last_restored_date', value: new Date().toISOString() });
  await store.refreshAll();
  return true;
}

/**
 * Export orders to CSV
 */
function exportOrdersCsv(orders = store.orders) {
  const headers = [
    'Order Number',
    'Date',
    'Time',
    'Status',
    'Payment Method',
    'Items Sold',
    'Subtotal (RM)',
    'Discount (RM)',
    'Final Paid (RM)',
    'Total Cost (RM)',
    'Gross Profit (RM)',
    'Promotion Applied',
    'Cancellation Reason'
  ];

  const rows = orders.map(order => {
    const d = new Date(order.timestamp || order.date);
    const dateStr = d.toISOString().split('T')[0];
    const timeStr = d.toLocaleTimeString('en-US', { hour12: false });
    const itemsSummary = (order.items || [])
      .map(i => `${i.name} (x${i.quantity || i.qty})`)
      .join('; ');

    return [
      `"${order.order_number}"`,
      `"${dateStr}"`,
      `"${timeStr}"`,
      `"${order.status}"`,
      `"${order.payment_method}"`,
      `"${itemsSummary.replace(/"/g, '""')}"`,
      (order.subtotal || 0).toFixed(2),
      (order.discount || 0).toFixed(2),
      (order.final_amount || 0).toFixed(2),
      (order.total_cost || 0).toFixed(2),
      (order.gross_profit || 0).toFixed(2),
      `"${(order.promotion_snapshot?.name || '').replace(/"/g, '""')}"`,
      `"${(order.cancellation?.reason || '').replace(/"/g, '""')}"`
    ].join(',');
  });

  const csvContent = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  triggerFileDownload(blob, `muki-sales-report-${new Date().toISOString().split('T')[0]}.csv`);
}

/**
 * Export inventory to CSV
 */
function exportInventoryCsv() {
  const headers = [
    'Product Name',
    'Category',
    'Selling Price (RM)',
    'Cost (RM)',
    'Current Stock',
    'Available Assembled (Bundles)',
    'Is Bundle',
    'Status'
  ];

  const rows = store.products.map(prod => {
    const isBundle = store.isBundleProduct(prod.id);
    const available = store.getAvailableStock(prod.id);

    return [
      `"${prod.name.replace(/"/g, '""')}"`,
      `"${prod.category}"`,
      (Number(prod.selling_price) || 0).toFixed(2),
      (Number(prod.cost) || 0).toFixed(2),
      isBundle ? 'N/A (Bundle)' : (Number(prod.stock) || 0),
      isBundle ? available : 'N/A',
      isBundle ? 'Yes' : 'No',
      prod.is_active ? 'Active' : 'Disabled'
    ].join(',');
  });

  const csvContent = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  triggerFileDownload(blob, `muki-inventory-${new Date().toISOString().split('T')[0]}.csv`);
}

function triggerFileDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/**
 * GitHub Gist Cloud Sync Service
 * Allows solo stall owners to sync data between iPad and computer with 1 click.
 * Stores data safely in a private/secret GitHub Gist using the user's existing GitHub account.
 */





const GIST_FILENAME = 'muki-stall-data.json';
const GIST_DESCRIPTION = 'Muki Stall Manager — Business Data Cloud Backup (Private)';

/**
 * Retrieve saved GitHub credentials from settings
 */
async function getGitHubConfig() {
  const settings = await db.getAll('settings');
  const tokenSetting = settings.find(s => s.key === 'github_token');
  const gistIdSetting = settings.find(s => s.key === 'github_gist_id');
  const lastUploadSetting = settings.find(s => s.key === 'github_last_upload');
  const lastPullSetting = settings.find(s => s.key === 'github_last_pull');

  return {
    token: tokenSetting ? tokenSetting.value : '',
    gistId: gistIdSetting ? gistIdSetting.value : '',
    lastUpload: lastUploadSetting ? lastUploadSetting.value : null,
    lastPull: lastPullSetting ? lastPullSetting.value : null
  };
}

/**
 * Save GitHub Token
 */
async function saveGitHubToken(token) {
  const cleaned = (token || '').trim();
  await db.putItem('settings', { key: 'github_token', value: cleaned });
  // Always clear cached gistId when changing or resetting token so a fresh gist can be created/re-linked cleanly
  await db.deleteItem('settings', 'github_gist_id');
  await store.refreshAll();
  return cleaned;
}

/**
 * Test GitHub token connection
 */
async function testGitHubToken(token) {
  if (!token) throw new Error('Please enter your GitHub Token.');

  const res = await fetch('https://api.github.com/user', {
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json'
    }
  });

  if (!res.ok) {
    if (res.status === 401) throw new Error('Invalid or expired GitHub Token. Please verify you copied it completely.');
    throw new Error(`GitHub connection failed: HTTP ${res.status}`);
  }

  const user = await res.json();
  return user.login; // e.g. "yuxuan705"
}

/**
 * Upload current stall data to GitHub Secret Gist
 */
async function uploadToGitHub() {
  const config = await getGitHubConfig();
  if (!config.token) {
    throw new Error('GitHub Token is not configured. Please save a token first.');
  }

  // 1. Prepare current full database backup (sanitized, with tokens stripped)
  const backup = await createBackupData();
  let backupJsonString = JSON.stringify(backup, null, 2);

  // Extra safety net: eliminate any GitHub PAT pattern (ghp_... or github_pat_...)
  backupJsonString = backupJsonString
    .replace(/ghp_[a-zA-Z0-9_]{20,}/g, 'FILTERED_SECRET')
    .replace(/github_pat_[a-zA-Z0-9_]{20,}/g, 'FILTERED_SECRET');

  let gistId = config.gistId;
  let resultGist = null;

  // 2. If a gistId is stored, try updating it with PATCH
  if (gistId) {
    try {
      const patchRes = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${config.token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          description: GIST_DESCRIPTION,
          files: {
            [GIST_FILENAME]: {
              content: backupJsonString
            }
          }
        })
      });

      if (patchRes.ok) {
        resultGist = await patchRes.json();
      } else {
        const patchErr = await patchRes.json().catch(() => ({}));
        console.warn(`PATCH existing gist (${gistId}) failed with status ${patchRes.status}: ${patchErr.message || 'unknown'}. Clearing stale Gist ID and falling back to creating a clean Gist...`);
        await db.deleteItem('settings', 'github_gist_id');
        gistId = null;
      }
    } catch (netErr) {
      console.warn('Network error during PATCH gist, attempting clean Gist fallback:', netErr);
      await db.deleteItem('settings', 'github_gist_id');
      gistId = null;
    }
  }

  // 3. If update failed or no gistId yet, create a fresh Secret Gist
  if (!resultGist) {
    const postRes = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${config.token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        description: GIST_DESCRIPTION,
        public: false, // Secret Gist, completely private
        files: {
          [GIST_FILENAME]: {
            content: backupJsonString
          }
        }
      })
    });

    if (!postRes.ok) {
      const errorBody = await postRes.json().catch(() => ({}));
      if (postRes.status === 401) {
        throw new Error('Invalid or expired GitHub Token (Bad credentials). Please click "Change Token" to update your token.');
      }
      if (postRes.status === 404 || postRes.status === 403) {
        throw new Error('GitHub Token lacks "gist" permission. Please ensure the token has the "gist" scope checked on GitHub.');
      }
      throw new Error(errorBody.message || `Upload failed: HTTP ${postRes.status}`);
    }

    resultGist = await postRes.json();
  }

  const now = new Date().toISOString();

  // Save gist ID and last upload timestamp
  await db.putItem('settings', { key: 'github_gist_id', value: resultGist.id });
  await db.putItem('settings', { key: 'github_last_upload', value: now });
  await store.refreshAll();

  return {
    gistId: resultGist.id,
    timestamp: now,
    summary: backup.meta.summary
  };
}

/**
 * Pull latest data from GitHub Secret Gist and restore
 */
async function pullFromGitHub() {
  const config = await getGitHubConfig();
  if (!config.token) {
    throw new Error('GitHub Token is not configured. Please save a token first.');
  }

  const findLatestGistId = async () => {
    const gistsRes = await fetch('https://api.github.com/gists?per_page=50', {
      headers: {
        'Authorization': `Bearer ${config.token}`,
        'Accept': 'application/vnd.github+json'
      }
    });

    if (!gistsRes.ok) {
      if (gistsRes.status === 401) throw new Error('Invalid or expired GitHub Token (Bad credentials).');
      throw new Error(`Failed to retrieve data from GitHub: HTTP ${gistsRes.status}`);
    }

    const gists = await gistsRes.json();
    const matches = gists
      .filter(g => g.files && g.files[GIST_FILENAME])
      .sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));

    if (matches.length === 0) {
      throw new Error('No muki-stall-data.json backup found on GitHub yet. Please click "Upload to GitHub" on your stall device first.');
    }
    return matches[0].id;
  };

  let gistId = config.gistId;
  let response = null;

  if (gistId) {
    response = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: {
        'Authorization': `Bearer ${config.token}`,
        'Accept': 'application/vnd.github+json'
      }
    });
    if (!response.ok) {
      console.warn(`Cached gist ID ${gistId} not accessible (HTTP ${response.status}), looking up latest...`);
      await db.deleteItem('settings', 'github_gist_id');
      gistId = null;
    }
  }

  if (!gistId) {
    gistId = await findLatestGistId();
    await db.putItem('settings', { key: 'github_gist_id', value: gistId });
    response = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: {
        'Authorization': `Bearer ${config.token}`,
        'Accept': 'application/vnd.github+json'
      }
    });
  }

  if (!response || !response.ok) {
    throw new Error(`Failed to pull from GitHub: HTTP ${response ? response.status : 'unknown'}`);
  }

  const gistData = await response.json();
  const fileEntry = gistData.files && gistData.files[GIST_FILENAME];
  if (!fileEntry || !fileEntry.content) {
    throw new Error('GitHub backup file is empty or removed.');
  }

  // Parse and validate content
  let parsed;
  try {
    parsed = JSON.parse(fileEntry.content);
  } catch (err) {
    throw new Error('GitHub backup file is corrupted and cannot be parsed as JSON.');
  }

  const validated = validateBackupFile(parsed);

  // Restore data
  await restoreFromBackup(parsed, 'replace');

  const now = new Date().toISOString();
  await db.putItem('settings', { key: 'github_last_pull', value: now });
  await store.refreshAll();

  return {
    timestamp: now,
    meta: parsed.meta || {},
    counts: validated.counts
  };
}

/**
 * Automated Test Suite for 10 Required Test Scenarios
 * Validates inventory deductions, bundle recipes, cost snapshots, cancellations, profit, and backup/restore.
 */








async function runAllTests() {
  const results = [];
  const log = (name, passed, details = '') => {

    const stockV1After1 = (await db.getById('products', 'prod_v1_single')).stock;
    const test1Passed = stockV1After1 === stockV1Before - 1;
    log('Scenario 1: Sell 1x V1 Single', test1Passed, `V1 Stock before: ${stockV1Before}, after: ${stockV1After1}`);

    // -------------------------------------------------------------
    // Test 2: Sell one V1 Full Set and verify that exactly 6 V1 coins are deducted
    // -------------------------------------------------------------
    const stockV1Before2 = (await db.getById('products', 'prod_v1_single')).stock;
    const order2 = await createOrder({
      cartItems: [{ productId: 'prod_v1_fullset', quantity: 1, unitPrice: 90.00, unitCost: 9.00 }],
      paymentMethod: 'Cash'
    });
    const stockV1After2 = (await db.getById('products', 'prod_v1_single')).stock;
    const test2Passed = stockV1After2 === stockV1Before2 - 6;
    log('Scenario 2: Sell 1x V1 Full Set (Recipe: 6x V1)', test2Passed, `V1 Stock before: ${stockV1Before2}, after: ${stockV1After2} (Deducted 6)`);

    // -------------------------------------------------------------
    // Test 3: Sell one V2 Full Set and verify that exactly 5 V2 coins are deducted
    // -------------------------------------------------------------
    const stockV2Before3 = (await db.getById('products', 'prod_v2_single')).stock;
    const order3 = await createOrder({
      cartItems: [{ productId: 'prod_v2_fullset', quantity: 1, unitPrice: 75.00, unitCost: 7.50 }],
      paymentMethod: 'DuitNow QR'
    });
    const stockV2After3 = (await db.getById('products', 'prod_v2_single')).stock;
    const test3Passed = stockV2After3 === stockV2Before3 - 5;
    log('Scenario 3: Sell 1x V2 Full Set (Recipe: 5x V2)', test3Passed, `V2 Stock before: ${stockV2Before3}, after: ${stockV2After3} (Deducted 5)`);

    // -------------------------------------------------------------
    // Test 4: Sell one Muki Bundle and verify that V1, V2, and Acrylic stocks are each reduced by one
    // -------------------------------------------------------------
    const sV1Before4 = (await db.getById('products', 'prod_v1_single')).stock;
    const sV2Before4 = (await db.getById('products', 'prod_v2_single')).stock;
    const sKeyBefore4 = (await db.getById('products', 'prod_acrylic_keychain')).stock;

    const order4 = await createOrder({
      cartItems: [{ productId: 'prod_muki_bundle', quantity: 1, unitPrice: 40.00, unitCost: 4.00 }],
      paymentMethod: 'Cash'
    });

    const sV1After4 = (await db.getById('products', 'prod_v1_single')).stock;
    const sV2After4 = (await db.getById('products', 'prod_v2_single')).stock;
    const sKeyAfter4 = (await db.getById('products', 'prod_acrylic_keychain')).stock;

    const test4Passed = (sV1After4 === sV1Before4 - 1) && 
                        (sV2After4 === sV2Before4 - 1) && 
                        (sKeyAfter4 === sKeyBefore4 - 1);
    log('Scenario 4: Sell 1x Muki Bundle (1x V1, 1x V2, 1x Keychain)', test4Passed, 
      `V1: ${sV1Before4}->${sV1After4}, V2: ${sV2Before4}->${sV2After4}, Keychain: ${sKeyBefore4}->${sKeyAfter4}`);

    // -------------------------------------------------------------
    // Test 5: Apply a RM40 bundle promotion and verify the correct discount and profit
    // -------------------------------------------------------------
    const promo = store.promotions.find(p => p.id === 'promo_muki_bundle_deal');
    const cartItems5 = [
      { productId: 'prod_v1_single', quantity: 1, unitPrice: 16.80, unitCost: 1.50 },
      { productId: 'prod_v2_single', quantity: 1, unitPrice: 16.80, unitCost: 1.50 },
      { productId: 'prod_acrylic_keychain', quantity: 1, unitPrice: 10.00, unitCost: 1.00 }
    ];
    const subtotal5 = 16.80 + 16.80 + 10.00; // 43.60
    const discount5 = calculatePromotionDiscount(promo, cartItems5, subtotal5); // 43.60 - 40.00 = 3.60
    
    const order5 = await createOrder({
      cartItems: cartItems5,
      promotion: promo,
      customDiscount: discount5,
      paymentMethod: 'DuitNow QR'
    });

    const expectedPaid5 = 40.00;
    const expectedCogs5 = 1.50 + 1.50 + 1.00; // 4.00
    const expectedGrossProfit5 = 40.00 - 4.00; // 36.00

    const test5Passed = (round(discount5) === 3.60) && 
                        (round(order5.final_amount) === expectedPaid5) && 
                        (round(order5.gross_profit) === expectedGrossProfit5);
    log('Scenario 5: RM40 Bundle Promotion Discount & Profit', test5Passed, 
      `Subtotal: RM${subtotal5}, Discount: RM${discount5}, Paid: RM${order5.final_amount}, Profit: RM${order5.gross_profit}`);

    // -------------------------------------------------------------
    // Test 6: Change a product's cost and verify historical order profit does not change
    // -------------------------------------------------------------
    const order5BeforeUpdate = await db.getById('orders', order5.id);
    const profitBeforeCostChange = order5BeforeUpdate.gross_profit;

    // Change V1 Single cost from 1.50 to 5.00
    await updateProductCost('prod_v1_single', 5.00, 'Supplier price spike');

    const order5AfterUpdate = await db.getById('orders', order5.id);
    const profitAfterCostChange = order5AfterUpdate.gross_profit;

    const test6Passed = (profitBeforeCostChange === profitAfterCostChange) && (order5AfterUpdate.total_cost === 4.00);
    log('Scenario 6: Cost Change Keeps Historical Order Profit Intact', test6Passed, 
      `Order profit before: RM${profitBeforeCostChange}, after: RM${profitAfterCostChange} (Unchanged)`);

    // Restore V1 cost back to 1.50 for clean state
    await updateProductCost('prod_v1_single', 1.50, 'Reset test cost');

    // -------------------------------------------------------------
    // Test 7: Cancel an order and verify stock is restored exactly once
    // -------------------------------------------------------------
    const sV1BeforeCancel = (await db.getById('products', 'prod_v1_single')).stock;
    const sV2BeforeCancel = (await db.getById('products', 'prod_v2_single')).stock;
    const sKeyBeforeCancel = (await db.getById('products', 'prod_acrylic_keychain')).stock;

    await cancelOrder(order5.id, 'Test cancellation');

    const sV1AfterCancel = (await db.getById('products', 'prod_v1_single')).stock;
    const sV2AfterCancel = (await db.getById('products', 'prod_v2_single')).stock;
    const sKeyAfterCancel = (await db.getById('products', 'prod_acrylic_keychain')).stock;

    // Attempt second cancellation - should fail
    let secondCancelFailed = false;
    try {
      await cancelOrder(order5.id, 'Second attempt');
    } catch (err) {
      secondCancelFailed = true;
    }

    const test7Passed = (sV1AfterCancel === sV1BeforeCancel + 1) && 
                        (sV2AfterCancel === sV2BeforeCancel + 1) && 
                        (sKeyAfterCancel === sKeyBeforeCancel + 1) && 
                        secondCancelFailed;
    log('Scenario 7: Cancel Order & Restore Stock Exactly Once', test7Passed, 
      `Restored stock (+1 V1, +1 V2, +1 Key). Second cancellation blocked: ${secondCancelFailed}`);

    // -------------------------------------------------------------
    // Test 8: Check daily revenue, gross profit, and net profit
    // -------------------------------------------------------------
    // Add a test expense
    const testExpense = {
      id: 'exp_test_rental',
      name: 'Stall Table Rental',
      category: 'Stall rental',
      amount: 50.00,
      date: order1.date,
      notes: 'Market organizers',
      timestamp: new Date().toISOString()
    };
    await db.putItem('expenses', testExpense);
    await store.refreshAll();

    const activeOrders = store.orders.filter(o => o.date === order1.date && o.status !== 'cancelled');
    const dayRevenue = activeOrders.reduce((sum, o) => sum + o.final_amount, 0);
    const dayGrossProfit = activeOrders.reduce((sum, o) => sum + o.gross_profit, 0);
    const dayExpenses = (await db.getAll('expenses')).filter(e => e.date === order1.date).reduce((sum, e) => sum + e.amount, 0);
    const dayNetProfit = round(dayGrossProfit - dayExpenses);

    const test8Passed = dayNetProfit === round(dayGrossProfit - 50.00);
    log('Scenario 8: Daily Revenue, Gross Profit, and Net Profit', test8Passed, 
      `Revenue: RM${dayRevenue.toFixed(2)}, Gross: RM${dayGrossProfit.toFixed(2)}, Expenses: RM${dayExpenses.toFixed(2)}, Net: RM${dayNetProfit.toFixed(2)}`);

    // Clean up test expense
    await db.deleteItem('expenses', 'exp_test_rental');

    // -------------------------------------------------------------
    // Test 9: Export a backup and restore it successfully
    // -------------------------------------------------------------
    const backupObj = await createBackupData();
    const validated = validateBackupFile(backupObj);
    const test9ValidationPassed = validated.valid && validated.counts.products > 0;

    // Restore test
    await restoreFromBackup(backupObj, 'replace');
    const postRestoreProducts = await db.getAll('products');
    const test9Passed = test9ValidationPassed && (postRestoreProducts.length === backupObj.data.products.length);
    log('Scenario 9: Export Backup & Validate/Restore', test9Passed, 
      `Backup contains ${validated.counts.products} products, ${validated.counts.orders} orders. Restored cleanly.`);

    // -------------------------------------------------------------
    // Test 10: Refresh the browser / store and verify existing data remains
    // -------------------------------------------------------------
    await store.refreshAll();
    const test10Passed = store.products.length > 0 && store.orders.length > 0;
    log('Scenario 10: Data Persistence Check', test10Passed, 
      `Store refreshed from IndexedDB. Products: ${store.products.length}, Orders: ${store.orders.length}`);

    console.log('--- All 10 Scenarios Completed ---');
    return results;
  } catch (error) {
    console.error('Test suite error:', error);
    log('Test Execution Error', false, error.message);
    return results;
  }
}

                  <th>Product</th>
                  <th>Category</th>
                  <th style="text-align:right;">Stock / Sets</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${store.products.map(prod => {
                  const isBundle = store.isBundleProduct(prod.id);
                  const available = store.getAvailableStock(prod.id);
                  const isLow = available <= 10;
                  return `
                    <tr>
                      <td data-label="Product" style="font-weight:700;">
                        ${prod.name}
                        ${prod.needs_config ? `<span class="badge badge-warning" style="margin-left:6px;">Needs Config</span>` : ''}
                      </td>
                      <td data-label="Category"><span class="badge badge-outline">${prod.category}</span></td>
                      <td data-label="Stock / Sets" class="num" style="text-align:right;font-weight:700;font-size:0.95rem;">
                        ${available} ${isBundle ? '<span style="font-size:0.75rem;font-weight:normal;color:var(--text-muted);">sets</span>' : ''}
                      </td>
                      <td data-label="Status">
                        ${isLow 
                          ? `<span class="badge badge-warning">${renderIcon('alert', 12)} Low</span>` 
                          : `<span class="badge badge-active">${renderIcon('check', 12)} OK</span>`}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Recent Sales -->
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <div>
              <div class="card-title">Recent Sales</div>
              <div class="card-subtitle">Latest stall transactions</div>
            </div>
            <button type="button" class="btn btn-sm btn-secondary" data-action="switch-view" data-target="dailyRecords">
              All Records
            </button>
          </div>

          ${recentOrders.length === 0 ? `
            <div style="text-align:center;padding:40px 20px;color:var(--text-muted);">
              ${renderIcon('pos', 32, 'style="margin-bottom:8px;opacity:0.4;"')}
              <div>No sales recorded yet today.</div>
              <button type="button" class="btn btn-sm btn-primary" style="margin-top:12px;" data-action="switch-view" data-target="pos">
                Record First Sale
              </button>
            </div>
          ` : `
            <div class="table-container">
              <table class="table table--mobile-cards">
                <thead>
                  <tr>
                    <th>Order</th>
                    <th>Time</th>
                    <th>Items</th>
                    <th style="text-align:right;">Paid</th>
                    <th style="text-align:center;">Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${recentOrders.map(o => `
                    <tr>
                      <td data-label="Order" style="font-family:var(--font-mono);font-size:0.8rem;font-weight:700;">
                        ${o.order_number}
                        ${o.status === 'cancelled' ? '<span class="badge badge-cancelled" style="margin-left:4px;">Void</span>' : ''}
                      </td>
                      <td data-label="Time" style="font-size:0.8rem;color:var(--text-muted);">${formatTime(o.timestamp)}</td>
                      <td data-label="Items" style="font-size:0.82rem;color:var(--text-muted);">
                        ${(o.items || []).map(i => `${i.name} (x${i.quantity || i.qty})`).join(', ')}
                      </td>
                      <td data-label="Paid" class="num" style="text-align:right;font-weight:700;color:var(--color-brown);">
                        ${formatRM(o.final_amount)}
                      </td>
                      <td data-label="Action" class="td-actions">
                        <button type="button" class="btn btn-sm btn-secondary" data-action="inspect-order" data-order-id="${o.id}">
                          View Details
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

/**
 * Point of Sale (POS) Component
 * Touch-optimized stall checkout with dynamic categories, editable prices, custom discount input,
 * expanded payment methods (Cash, DuitNow QR, TnG, Other with description), and brand theme.
 */






let activeCategoryFilter = 'All';
let searchQuery = '';
let selectedPromotionId = '';
let selectedPaymentMethod = 'Cash';
let otherPaymentNote = '';

let posMobileTab = 'catalog'; // 'catalog' | 'cart'

function setPosMobileTab(tab) {
  posMobileTab = tab;
}

function getPosMobileTab() {
  return posMobileTab;
}

function getPosState() {
  return {
    category: activeCategoryFilter,
    search: searchQuery,
    promoId: selectedPromotionId,
    paymentMethod: selectedPaymentMethod,
    otherNote: otherPaymentNote
  };
}

function setPosCategory(cat) {
  activeCategoryFilter = cat;
}

function setPosSearch(q) {
  searchQuery = (q || '').toLowerCase();
}

function setPosPromotion(promoId) {
  selectedPromotionId = promoId;
}

function setPosPaymentMethod(method) {
  selectedPaymentMethod = method;
  if (method !== 'Other') {
    otherPaymentNote = '';
  }
}

function setPosOtherNote(note) {
  otherPaymentNote = (note || '').trim();
}

function renderPos() {
  const dynamicCategories = store.getCategories();
  const categories = ['All', ...dynamicCategories];

  // Filter products: active products only
  let filteredProducts = store.products.filter(p => p.is_active !== false);

  if (activeCategoryFilter !== 'All') {
    if (activeCategoryFilter === 'Bundles') {
      filteredProducts = filteredProducts.filter(p => p.category === 'Bundle' || p.category === 'Bundles' || store.isBundleProduct(p.id));
    } else {
      filteredProducts = filteredProducts.filter(p => p.category === activeCategoryFilter);
    }
  }

  if (searchQuery.trim()) {
    filteredProducts = filteredProducts.filter(p => 
      p.name.toLowerCase().includes(searchQuery) || 
      (p.category && p.category.toLowerCase().includes(searchQuery))
    );
  }

  // Calculate cart totals
  let cartSubtotal = 0;
  store.cart.forEach(item => {
    cartSubtotal += round(item.unitPrice * item.quantity);
  });
  cartSubtotal = round(cartSubtotal);

  // Active promotions
  const activePromos = store.promotions.filter(p => isPromotionValid(p));
  const currentPromo = activePromos.find(p => p.id === selectedPromotionId) || null;

  // Check if any spend threshold promo is qualified (e.g. Spend RM200 Get Gift/Discount)
  const qualifiedThresholdPromo = activePromos.find(p => 
    (p.type === 'spend_threshold_gift' || p.type === 'spend_threshold_discount') && 
    cartSubtotal >= (Number(p.min_spend) || 0) &&
    (Number(p.min_spend) || 0) > 0
  );

  // Calculate promo discount + manual discount
  let promoDiscount = 0;
  if (currentPromo) {
    promoDiscount = calculatePromotionDiscount(currentPromo, store.cart, cartSubtotal);
  }
  const manualDiscount = store.getManualDiscount();
  const totalDiscount = round(promoDiscount + manualDiscount);
  const finalTotal = round(Math.max(0, cartSubtotal - totalDiscount));

  const totalCartCount = store.cart.reduce((sum, item) => sum + (item.quantity || 0), 0);

  return `
    <div>
      <!-- Mobile Segmented Switch: Products vs Cart -->
      <div class="pos-mobile-tabs">
        <button type="button" class="pos-mobile-tab-btn ${posMobileTab === 'catalog' ? 'active' : ''}" data-action="pos-set-mobile-tab" data-tab="catalog">
          ${renderIcon('package', 16)}
          <span>Products (${filteredProducts.length})</span>
        </button>
        <button type="button" class="pos-mobile-tab-btn ${posMobileTab === 'cart' ? 'active' : ''}" data-action="pos-set-mobile-tab" data-tab="cart">
          ${renderIcon('pos', 16)}
          <span>Cart (${totalCartCount}) • ${formatRM(finalTotal)}</span>
        </button>
      </div>

      <div class="pos-layout">
        <!-- Left: Product Catalog Grid -->
        <div class="pos-catalog ${posMobileTab === 'cart' ? 'pos-mobile-hidden' : ''}">
          <!-- Search and Category Filters -->
          <div style="margin-bottom:12px;display:flex;flex-direction:column;gap:8px;">
            <div style="width:100%;position:relative;">
              <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-light);pointer-events:none;">
                ${renderIcon('search', 16)}
              </span>
              <input type="text" 
                id="pos-search-input" 
                class="form-input" 
                placeholder="Search products..." 
                value="${searchQuery}" 
                style="padding-left:36px;width:100%;">
            </div>
            <div class="pos-category-scroll">
              ${categories.map(cat => `
                <button type="button" 
                  class="btn btn-sm ${activeCategoryFilter === cat ? 'btn-primary' : 'btn-secondary'}" 
                  data-action="pos-filter-cat" 
                  data-category="${cat}"
                  style="white-space:nowrap;border-radius:20px;padding:4px 12px;flex-shrink:0;">
                  ${cat}
                </button>
              `).join('')}
              
              <button type="button" class="btn btn-sm btn-secondary" data-action="open-manage-categories-modal" title="Manage Categories" style="border-radius:20px;border-style:dashed;padding:4px 10px;white-space:nowrap;flex-shrink:0;">
                ${renderIcon('plus', 12)}
                <span>Category</span>
              </button>
            </div>
          </div>

        <!-- Product Cards Grid -->
        <div class="pos-product-grid">
          ${filteredProducts.length === 0 ? `
            <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);">
              ${renderIcon('package', 36, 'style="opacity:0.4;margin-bottom:8px;"')}
              <div>No matching products found</div>
            </div>
          ` : filteredProducts.map(prod => {
            const isBundle = store.isBundleProduct(prod.id);
            const available = store.getAvailableStock(prod.id);
            const isOut = available <= 0;
            const inCartItem = store.cart.find(i => i.productId === prod.id);
            const cartQty = inCartItem ? inCartItem.quantity : 0;

            return `
              <div class="product-tap-card ${isOut ? 'out-of-stock' : ''}" 
                data-action="pos-add-to-cart" 
                data-product-id="${prod.id}"
                style="${isOut ? 'opacity:0.6;background:#fafafa;' : ''}">
                
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:4px;">
                    <span class="badge badge-outline" style="font-size:0.65rem;">${prod.category}</span>
                    ${isBundle ? `<span class="badge badge-bundle" style="font-size:0.65rem;">Bundle</span>` : ''}
                  </div>
                  <div style="font-weight:700;font-size:0.95rem;color:var(--color-brown-dark);line-height:1.25;margin-top:4px;">
                    ${prod.name}
                  </div>
                </div>

                <div style="margin-top:12px;">
                  <div style="font-size:1.15rem;font-weight:700;font-family:var(--font-mono);color:var(--color-brown);display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
                    <span>${formatRM(prod.selling_price)}</span>
                    ${prod.pricing_tiers && prod.pricing_tiers.length > 0 ? `
                      <span class="badge" style="font-size:0.65rem;font-weight:700;background:var(--bg-secondary);color:var(--color-brown-dark);border:1px solid var(--border-light);padding:1px 5px;" title="Volume Tier: Buy ${prod.pricing_tiers[0].min_qty}+ @ RM ${Number(prod.pricing_tiers[0].unit_price).toFixed(2)}">
                        ${prod.pricing_tiers[0].min_qty}+ @ RM ${Number(prod.pricing_tiers[0].unit_price).toFixed(2)}
                      </span>
                    ` : ''}
                  </div>
                  
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:0.75rem;">
                    <span style="color:${isOut ? 'var(--text-muted)' : available <= 5 ? 'var(--color-orange)' : 'var(--text-muted)'};font-weight:600;">
                      ${isOut 
                        ? (prod.display_stock > 0 ? `0 for sale (${prod.display_stock} Display Sample)` : 'Out of stock') 
                        : `${available} in stock${prod.display_stock > 0 ? ` (+${prod.display_stock} Display)` : ''}`}
                    </span>
                    ${cartQty > 0 ? `
                      <span class="badge" style="background:var(--color-brown);color:white;padding:2px 7px;">
                        Added ${cartQty}
                      </span>
                    ` : ''}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <!-- Right: Sticky Cart & Checkout Panel -->
      <div class="pos-cart-panel ${posMobileTab === 'catalog' ? 'pos-mobile-hidden' : ''}">
        <div class="pos-mobile-back-btn" style="padding:10px 14px 4px 14px;">
          <button type="button" class="btn btn-sm btn-secondary" data-action="pos-set-mobile-tab" data-tab="catalog" style="width:100%;justify-content:center;font-weight:700;">
            ${renderIcon('chevronLeft', 16)}
            <span>Back to Products</span>
          </button>
        </div>
        <div style="padding:14px 16px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:8px;">
            ${renderIcon('pos', 18)}
            <span style="font-weight:700;font-size:1rem;color:var(--color-brown-dark);">Current Cart</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button type="button" class="btn btn-sm btn-secondary" data-action="pos-open-add-gift-modal" title="Add free customer gift" style="font-size:0.75rem;padding:3px 8px;border-radius:14px;color:var(--color-brown-dark);font-weight:700;background:var(--bg-secondary);">
              Add Gift
            </button>
            ${store.cart.length > 0 ? `
              <button type="button" class="btn btn-sm btn-secondary" data-action="pos-clear-cart" style="color:var(--color-danger);padding:3px 8px;">
                ${renderIcon('trash', 14)}
              </button>
            ` : ''}
          </div>
        </div>

        <!-- Cart Items List -->
        <div class="pos-cart-items">
          ${store.cart.length === 0 ? `
            <div style="text-align:center;padding:60px 10px;color:var(--text-muted);">
              ${renderIcon('pos', 36, 'style="opacity:0.3;margin-bottom:12px;"')}
              <div style="font-weight:600;">Cart is empty</div>
              <div style="font-size:0.8rem;margin-top:4px;">Tap product cards on the left to add items</div>
            </div>
          ` : store.cart.map(item => `
            <div style="display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div style="flex:1;padding-right:8px;">
                  <div style="font-weight:700;font-size:0.92rem;color:var(--color-brown-dark);display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
                    <span>${item.product?.name || item.name}</span>
                    ${item.isFreeGift ? '<span class="badge" style="background:var(--color-orange);color:#fff;font-size:0.65rem;font-weight:700;padding:1px 6px;">Free Gift</span>' : ''}
                  </div>
                  
                  <!-- Editable Price on the fly & Free Gift Button -->
                  <div style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;">
                    <span style="font-size:0.75rem;color:var(--text-muted);font-weight:600;">Price RM</span>
                    <input type="number" step="0.10" class="form-input number-input cart-item-price-input" 
                      data-cart-item-id="${item.cartItemId || item.productId}"
                      data-product-id="${item.productId}" 
                      value="${item.unitPrice}" 
                      title="Click to edit unit price (special offer)"
                      style="width:70px;padding:2px 6px;font-size:0.85rem;height:26px;border-color:${item.isFreeGift ? 'var(--color-orange)' : item.isCustomPrice ? 'var(--color-orange)' : 'var(--border-light)'};background:#fff;">
                    
                    <button type="button" class="btn btn-sm ${item.isFreeGift ? 'btn-primary' : 'btn-secondary'}" 
                      data-action="pos-toggle-gift" 
                      data-cart-item-id="${item.cartItemId || item.productId}"
                      title="${item.isFreeGift ? 'Free Gift (Price RM0)' : 'Mark as Free Gift'}"
                      style="padding:2px 8px;font-size:0.72rem;height:26px;border-radius:13px;display:inline-flex;align-items:center;gap:3px;${item.isFreeGift ? 'background:var(--color-orange);border-color:var(--color-orange);color:#fff;font-weight:700;' : ''}">
                      <span>${item.isFreeGift ? 'Gift (RM0)' : 'Gift'}</span>
                    </button>

                    ${item.isCustomPrice && !item.isFreeGift ? '<span class="badge badge-bundle" style="font-size:0.65rem;padding:1px 5px;">Custom Price</span>' : ''}
                    ${!item.isFreeGift && !item.isCustomPrice && item.product?.pricing_tiers && item.product.pricing_tiers.some(t => Number(item.quantity) >= Number(t.min_qty)) ? `
                      <span class="badge" style="background:var(--color-brown);color:#fff;font-size:0.65rem;font-weight:700;padding:1px 5px;" title="Volume Tiered pricing active">
                        Tiered Rate
                      </span>
                    ` : ''}
                  </div>
                </div>

                <!-- Qty stepper -->
                <div style="display:flex;align-items:center;gap:6px;">
                  <button type="button" class="btn btn-sm btn-secondary" style="width:28px;height:28px;padding:0;" data-action="pos-qty-minus" data-product-id="${item.productId}">
                    ${renderIcon('minus', 12)}
                  </button>
                  <span style="font-family:var(--font-mono);font-weight:700;font-size:0.95rem;width:24px;text-align:center;">
                    ${item.quantity}
                  </span>
                  <button type="button" class="btn btn-sm btn-secondary" style="width:28px;height:28px;padding:0;" data-action="pos-qty-plus" data-product-id="${item.productId}">
                    ${renderIcon('plus', 12)}
                  </button>
                </div>

                <div style="width:75px;text-align:right;font-family:var(--font-mono);font-weight:700;font-size:0.95rem;color:var(--color-brown-dark);margin-left:8px;">
                  ${formatRM(item.unitPrice * item.quantity)}
                </div>
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Checkout Summary & Action Footer -->
        <div style="padding:14px 16px;border-top:1px solid var(--border-light);background-color:var(--color-white);">
          ${qualifiedThresholdPromo ? `
            <div style="margin-bottom:10px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;">
              <div style="font-size:0.8rem;color:var(--color-brown-dark);line-height:1.25;">
                <span style="font-weight:700;">Offer Unlocked (Min RM${qualifiedThresholdPromo.min_spend})</span><br>
                <span>${qualifiedThresholdPromo.name}</span>
              </div>
              ${qualifiedThresholdPromo.type === 'spend_threshold_gift' && qualifiedThresholdPromo.gift_product_id ? `
                <button type="button" class="btn btn-sm btn-primary" data-action="pos-claim-threshold-gift" data-gift-id="${qualifiedThresholdPromo.gift_product_id}" data-gift-qty="${qualifiedThresholdPromo.gift_quantity || 1}" style="font-size:0.72rem;padding:3px 8px;background:var(--color-orange);border-color:var(--color-orange);white-space:nowrap;font-weight:700;">
                  Add Gift
                </button>
              ` : ''}
            </div>
          ` : ''}
          <!-- Promotion Selector -->
          <div style="margin-bottom:8px;">
            <label class="form-label" style="font-size:0.72rem;margin-bottom:3px;">Preset Promotion / Bundle</label>
            <select id="pos-promo-select" class="form-select" style="font-size:0.82rem;padding:5px 8px;">
              <option value="">No preset promotion</option>
              ${activePromos.map(p => `
                <option value="${p.id}" ${selectedPromotionId === p.id ? 'selected' : ''}>
                  ${p.name} (${
                    p.type === 'bundle_price' ? `RM${p.price}` : 
                    p.type === 'fixed_discount' ? `-RM${p.value}` : 
                    p.type === 'percent_discount' ? `-${p.value}%` :
                    p.type === 'spend_threshold_discount' ? `Spend RM${p.min_spend} -${p.discount_type === 'percent' ? p.value + '%' : 'RM' + p.value}` :
                    `Spend RM${p.min_spend} Free Gift`
                  })
                </option>
              `).join('')}
            </select>
          </div>

          <!-- Manual Order Discount -->
          <div style="margin-bottom:12px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:8px 10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
              <label class="form-label" style="font-size:0.72rem;margin-bottom:0;display:flex;align-items:center;gap:4px;">
                ${renderIcon('tag', 13)}
                <span>Order Discount (Less RM)</span>
              </label>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-family:var(--font-mono);font-weight:700;color:var(--color-brown);font-size:0.85rem;">Less RM</span>
              <input type="number" step="0.50" id="pos-manual-discount-input" class="form-input number-input" 
                placeholder="0.00" 
                value="${store.getManualDiscount() > 0 ? store.getManualDiscount() : ''}" 
                style="padding:3px 8px;font-size:0.9rem;font-weight:700;flex:1;background:#fff;height:30px;">
              ${store.getManualDiscount() > 0 ? `
                <button type="button" class="btn btn-sm btn-secondary" id="pos-clear-manual-discount-btn" style="padding:2px 8px;font-size:0.75rem;height:30px;">
                  Clear
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Numbers Breakdown -->
          <div style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;color:var(--text-muted);">
              <span>Subtotal</span>
              <span class="num">${formatRM(cartSubtotal)}</span>
            </div>
            ${promoDiscount > 0 ? `
              <div style="display:flex;justify-content:space-between;color:var(--color-success);font-weight:600;">
                <span>Promotion (${currentPromo.name})</span>
                <span class="num">- ${formatRM(promoDiscount)}</span>
              </div>
            ` : ''}
            ${manualDiscount > 0 ? `
              <div style="display:flex;justify-content:space-between;color:var(--color-orange);font-weight:700;">
                <span>Order Discount</span>
                <span class="num">- ${formatRM(manualDiscount)}</span>
              </div>
            ` : ''}
            <div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:6px;border-top:1px dashed var(--border-light);">
              <span style="font-weight:700;font-size:1rem;color:var(--color-brown-dark);">Total Payable</span>
              <span class="num" style="font-size:1.45rem;font-weight:800;color:var(--color-brown);">
                ${formatRM(finalTotal)}
              </span>
            </div>
          </div>

          <!-- Payment Method Selector: Cash, DuitNow QR, TnG, Other -->
          <div style="margin-bottom:12px;">
            <label class="form-label" style="font-size:0.72rem;margin-bottom:4px;">Payment Method</label>
            <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;">
              ${['Cash', 'DuitNow QR', 'TnG', 'Other'].map(pm => `
                <button type="button" 
                  class="btn btn-sm ${selectedPaymentMethod === pm ? 'btn-primary' : 'btn-secondary'}"
                  data-action="pos-payment-method"
                  data-method="${pm}"
                  style="font-size:0.8rem;font-weight:700;padding:6px 2px;white-space:nowrap;">
                  ${pm === 'DuitNow QR' ? 'DuitNow' : pm}
                </button>
              `).join('')}
            </div>

            <!-- Optional Description for "Other" payment method -->
            ${selectedPaymentMethod === 'Other' ? `
              <div style="margin-top:8px;">
                <textarea 
                  id="pos-other-payment-input" 
                  class="form-textarea" 
                  rows="2"
                  placeholder="Payment note (e.g. Bank transfer, GrabPay...)" 
                  style="font-size:0.82rem;padding:6px 8px;background:#fff;border-color:var(--color-orange);width:100%;resize:vertical;">${otherPaymentNote}</textarea>
              </div>
            ` : ''}
          </div>

          <!-- Checkout Button -->
          <button type="button" 
            id="pos-confirm-btn"
            class="btn btn-primary btn-lg" 
            data-action="pos-complete-sale" 
            style="width:100%;font-size:1.02rem;"
            ${store.cart.length === 0 ? 'disabled' : ''}>
            ${renderIcon('check', 18)}
            <span>Charge ${formatRM(finalTotal)} (${selectedPaymentMethod === 'Other' && otherPaymentNote ? `Other: ${otherPaymentNote}` : selectedPaymentMethod})</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Floating Cart Bar for Mobile -->
    ${posMobileTab === 'catalog' && totalCartCount > 0 ? `
      <div class="pos-floating-cart-bar" data-action="pos-set-mobile-tab" data-tab="cart">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="background:var(--color-yellow);color:var(--color-brown-dark);font-weight:800;font-size:0.85rem;padding:2px 8px;border-radius:12px;">
            ${totalCartCount} item${totalCartCount > 1 ? 's' : ''}
          </span>
          <span style="font-weight:800;font-size:1.05rem;color:#ffffff;letter-spacing:-0.01em;">
            ${formatRM(finalTotal)}
          </span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;font-weight:700;font-size:0.88rem;color:#ffffff;">
          <span>Review Cart &amp; Pay</span>
          ${renderIcon('chevronRight', 16)}
        </div>
      </div>
    ` : ''}
  </div>
  `;
}

/**
 * Bundle & Promotion Management View Component
 * Manage bundle promotions, pricing rules, validity dates, component requirements, and usage counters.
 */





function renderPromotions() {
  const promotions = store.promotions || [];

  return `
    <div>
      <div class="page-header-row">
        <div>
          <h1 class="page-title">Bundle Promotions</h1>
          <div class="page-subtitle">Configure market stall package deals, discounts, and track usage</div>
        </div>
        <div>
          <button type="button" class="btn btn-primary" data-action="open-create-promo-modal">
            ${renderIcon('plus', 16)}
            <span>Create New Promotion</span>
          </button>
        </div>
      </div>

      <!-- Promotions Grid -->
      ${promotions.length === 0 ? `
        <div class="card" style="text-align:center;padding:60px 20px;color:var(--text-muted);">
          ${renderIcon('promotions', 40, 'style="opacity:0.3;margin-bottom:12px;"')}
          <div style="font-size:1.1rem;font-weight:600;color:var(--color-black);">No Promotions Created</div>
          <p style="margin-top:6px;max-width:400px;margin-left:auto;margin-right:auto;">

            return `

                <div>
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
                    <div>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <h2 style="font-size:1.1rem;font-weight:700;color:var(--color-black);">${promo.name}</h2>
                        ${isActive 
                          ? `<span class="badge badge-active">Active</span>` 
                          : `<span class="badge badge-outline">Paused</span>`}
                      </div>
                      <div style="font-size:0.85rem;color:var(--text-muted);margin-top:4px;">
                        ${promo.description || 'Special bundle price'}
                      </div>
                    </div>

                    <div style="text-align:right;">
                      <div class="num" style="font-size:1.35rem;font-weight:800;color:var(--color-black);">
                        ${promo.type === 'bundle_price' 
                          ? formatRM(promo.price) 
                          : promo.type === 'fixed_discount' 
                            ? `-${formatRM(promo.value)}` 
                            : promo.type === 'percent_discount'
                              ? `-${promo.value}%`
                              : promo.type === 'spend_threshold_discount'
                                ? (promo.discount_type === 'percent' ? `-${promo.value}%` : `-${formatRM(promo.value)}`)
                                : 'Free Gift'}
                      </div>
                      <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;">
                        ${promo.type === 'bundle_price' ? 'Bundle Price' : promo.type === 'spend_threshold_gift' ? `Spend Min RM${promo.min_spend || 0}` : promo.type === 'spend_threshold_discount' ? `Spend Min RM${promo.min_spend || 0}` : 'Discount'}
                      </div>
                    </div>
                  </div>

                  ${promo.type === 'spend_threshold_gift' && promo.gift_product_id ? `
                    <div style="margin-top:12px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:10px 12px;font-size:0.85rem;color:var(--color-brown-dark);">
                      Free Gift: <strong>${store.products.find(p => p.id === promo.gift_product_id)?.name || 'Gift item'}</strong> (x${promo.gift_quantity || 1})
                      <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">Triggered when customer spends RM${promo.min_spend || 0} or more</div>
                    </div>
                  ` : ''}

                  ${promo.type === 'spend_threshold_discount' ? `
                    <div style="margin-top:12px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:10px 12px;font-size:0.85rem;color:var(--color-brown-dark);">
                      Spend Offer: Spend <strong>RM${promo.min_spend || 0}</strong> and get <strong>${promo.discount_type === 'percent' ? promo.value + '% off' : 'RM' + promo.value + ' off'}</strong>!
                    </div>
                  ` : ''}

                  <!-- Bundle Components if applicable -->
                  ${promo.bundle_recipe && promo.bundle_recipe.length > 0 ? `
                    <div style="margin-top:16px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px;">
                      <div style="font-size:0.75rem;font-weight:600;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">
                        Required Bundle Items:
                      </div>
                      <div style="display:flex;flex-direction:column;gap:4px;">
                        ${promo.bundle_recipe.map(item => {
                          const prod = store.products.find(p => p.id === item.product_id);
                          return `
                            <div style="display:flex;justify-content:space-between;font-size:0.85rem;">
                              <span>• ${prod ? prod.name : 'Item'}</span>
                              <span style="font-family:var(--font-mono);font-weight:600;">× ${item.quantity}</span>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  ` : ''}

                  <!-- Date validity -->
                  <div style="margin-top:14px;font-size:0.8rem;color:var(--text-muted);display:flex;gap:16px;">
                    <div>
                      <span>Validity: </span>
                      <span style="color:var(--text-main);font-weight:500;">
                        ${promo.start_date || promo.end_date 
                          ? `${formatDate(promo.start_date)} - ${formatDate(promo.end_date) || 'Ongoing'}` 
                          : 'Always active'}
                      </span>
                    </div>
                  </div>
                </div>

                <!-- Footer with Usage Count & Controls -->
                <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;">
                  <div style="font-size:0.82rem;color:var(--text-muted);">
                    Used <span style="font-weight:700;color:var(--color-black);font-family:var(--font-mono);">${promo.usage_count || 0}</span> times
                  </div>
                  <div style="display:flex;gap:8px;">
                    <button type="button" class="btn btn-sm btn-secondary" data-action="toggle-promo-active" data-promo-id="${promo.id}">
                      ${isActive ? 'Pause' : 'Activate'}
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary" data-action="edit-promo" data-promo-id="${promo.id}">
                      Edit
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `;
}



// ==========================================
// Module: Muki Stall Manager/js/components/dailyRecords.js
// ==========================================
/**
 * Daily Records Component
 * Date-based history with daily financial summaries (Revenue, COGS, Gross Profit, Expenses, Net Profit),
 * breakdown tables, order inspection, and safe order cancellation with inventory restoration.
 */





let selectedRecordDate = getTodayDateString();

function getSelectedRecordDate() {
  return selectedRecordDate;
}

function setSelectedRecordDate(dateStr) {
  selectedRecordDate = dateStr;
}

function renderDailyRecords() {
  // Filter orders for the selected date
  const dayOrders = store.orders.filter(o => o.date === selectedRecordDate);
  const completedOrders = dayOrders.filter(o => o.status !== 'cancelled');

  // Filter expenses for the selected date
  const dayExpenses = store.expenses.filter(e => e.date === selectedRecordDate);

  // Financial calculations for completed orders
  let dayRevenue = 0;
  let dayCogs = 0;
  let dayGrossProfit = 0;
  let dayItemsSold = 0;
  let productBreakdown = {}; // { [prodName]: { qty, revenue, profit } }
  let paymentBreakdown = { Cash: 0, 'DuitNow QR': 0, TnG: 0, Other: 0 };
  let promoBreakdown = {}; // { [promoName]: count }

  completedOrders.forEach(o => {
    dayRevenue += Number(o.final_amount) || 0;
    dayCogs += Number(o.total_cost) || 0;
    dayGrossProfit += Number(o.gross_profit) || 0;

    let pm = o.payment_channel;
    if (!pm) {
      if (o.payment_method?.startsWith('Cash')) pm = 'Cash';
      else if (o.payment_method?.startsWith('DuitNow')) pm = 'DuitNow QR';
      else if (o.payment_method?.startsWith('TnG')) pm = 'TnG';
      else pm = 'Other';
    }
    paymentBreakdown[pm] = (paymentBreakdown[pm] || 0) + (Number(o.final_amount) || 0);

    if (o.promotion_snapshot && o.promotion_snapshot.name) {
      promoBreakdown[o.promotion_snapshot.name] = (promoBreakdown[o.promotion_snapshot.name] || 0) + 1;
    }

    (o.items || []).forEach(item => {
      const q = Number(item.quantity || item.qty) || 1;
      dayItemsSold += q;
      const name = item.name || 'Product';
      if (!productBreakdown[name]) {
        productBreakdown[name] = { qty: 0, revenue: 0, profit: 0 };
      }
      productBreakdown[name].qty += q;
      productBreakdown[name].revenue += Number(item.subtotal) || 0;
      productBreakdown[name].profit += (Number(item.subtotal) || 0) - (Number(item.costSubtotal) || 0);
    });
  });

  let totalExpenses = 0;
  dayExpenses.forEach(e => {
    totalExpenses += Number(e.amount) || 0;
  });

  dayRevenue = round(dayRevenue);
  dayCogs = round(dayCogs);
  dayGrossProfit = round(dayGrossProfit);
  totalExpenses = round(totalExpenses);
  
  // Net Profit = Gross Profit - Operating Expenses
  const dayNetProfit = round(dayGrossProfit - totalExpenses);

  // Previous and Next date navigation
  const currentDateObj = new Date(selectedRecordDate);
  const prevDateObj = new Date(currentDateObj);
  prevDateObj.setDate(prevDateObj.getDate() - 1);
  const prevDateStr = prevDateObj.toISOString().split('T')[0];

  const nextDateObj = new Date(currentDateObj);
  nextDateObj.setDate(nextDateObj.getDate() + 1);
  const nextDateStr = nextDateObj.toISOString().split('T')[0];

  const todayStr = getTodayDateString();

  return `
    <div>
      <div class="page-header-row">
        <div>
          <h1 class="page-title">Daily Sales Records</h1>
          <div class="page-subtitle">Inspect sales, profit margins, product breakdowns, and audit trails</div>
        </div>

        <!-- Date Navigator Controls -->
        <div style="display:flex;align-items:center;gap:8px;background:var(--color-white);padding:6px 10px;border:1px solid var(--border-light);border-radius:var(--radius-md);">
          <button type="button" class="btn btn-sm btn-secondary" data-action="records-prev-day" data-date="${prevDateStr}" title="Previous Day">
            ${renderIcon('chevronLeft', 16)}
          </button>
          
          <input type="date" 
            id="records-date-picker" 
            value="${selectedRecordDate}" 
            class="form-input" 
            style="width:auto;padding:4px 8px;font-weight:600;font-size:0.9rem;border:none;">

          <button type="button" class="btn btn-sm btn-secondary" data-action="records-next-day" data-date="${nextDateStr}" title="Next Day">
            ${renderIcon('chevronRight', 16)}
          </button>

          ${selectedRecordDate !== todayStr ? `
            <button type="button" class="btn btn-sm btn-primary" data-action="records-today" data-date="${todayStr}">
              Today
            </button>
          ` : ''}
        </div>
      </div>

      <!-- Financial Calculation Summary Cards -->
      <div class="grid-4" style="margin-bottom:20px;">
        <div class="card">
          <div class="card-subtitle">Gross Revenue</div>
          <div class="num" style="font-size:1.6rem;font-weight:700;color:var(--color-black);margin-top:4px;">
            ${formatRM(dayRevenue)}
          </div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">Actual amount paid</div>
        </div>

        <div class="card">
          <div class="card-subtitle">Cost of Goods (COGS)</div>
          <div class="num" style="font-size:1.6rem;font-weight:700;color:var(--text-muted);margin-top:4px;">
            ${formatRM(dayCogs)}
          </div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">Supplier product cost</div>
        </div>

        <div class="card">
          <div class="card-subtitle">Gross Profit</div>
          <div class="num" style="font-size:1.6rem;font-weight:700;color:var(--color-black);margin-top:4px;">
            ${formatRM(dayGrossProfit)}
          </div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">Revenue - COGS</div>
        </div>

        <div class="card" style="border-left:3px solid ${dayNetProfit >= 0 ? 'var(--color-black)' : 'var(--color-danger)'};">
          <div class="card-subtitle">Estimated Net Profit</div>
          <div class="num" style="font-size:1.6rem;font-weight:800;color:${dayNetProfit >= 0 ? 'var(--color-black)' : 'var(--color-danger)'};margin-top:4px;">
            ${formatRM(dayNetProfit)}
          </div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">Gross Profit - Expenses (${formatRM(totalExpenses)})</div>
        </div>
      </div>

      <!-- Quick Metrics Row -->
      <div style="display:flex;gap:20px;flex-wrap:wrap;background:var(--color-white);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:14px 20px;margin-bottom:24px;font-size:0.88rem;">
        <div>
          <span style="color:var(--text-muted);">Completed Orders: </span>
          <span style="font-weight:700;font-family:var(--font-mono);">${completedOrders.length}</span>
        </div>
        <div style="border-left:1px solid var(--border-light);padding-left:20px;">
          <span style="color:var(--text-muted);">Items Sold: </span>
          <span style="font-weight:700;font-family:var(--font-mono);">${dayItemsSold} units</span>
        </div>
        <div style="border-left:1px solid var(--border-light);padding-left:20px;">
          <span style="color:var(--text-muted);">Operating Expenses: </span>
          <span style="font-weight:700;font-family:var(--font-mono);">${formatRM(totalExpenses)}</span>
        </div>
        ${dayOrders.length - completedOrders.length > 0 ? `
          <div style="border-left:1px solid var(--border-light);padding-left:20px;">
            <span style="color:var(--color-danger);font-weight:600;">Cancelled Orders: </span>
            <span style="font-weight:700;font-family:var(--font-mono);color:var(--color-danger);">${dayOrders.length - completedOrders.length}</span>
          </div>
        ` : ''}
      </div>

      <!-- Breakdowns (Product Sales & Payment Methods) -->
      <div class="grid-2" style="margin-bottom:24px;">
        <!-- Sales by Product -->
        <div class="card">
          <div class="card-title">Sales by Product</div>
          <div class="card-subtitle" style="margin-bottom:12px;">Items sold and margin contributions</div>
          
          ${Object.keys(productBreakdown).length === 0 ? `
            <div style="text-align:center;padding:24px 10px;color:var(--text-muted);font-size:0.85rem;">
              No items sold on this date.
            </div>
          ` : `
            <div class="table-container">
              <table class="table table--mobile-cards">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th style="text-align:right;">Qty</th>
                    <th style="text-align:right;">Revenue</th>
                    <th style="text-align:right;">Gross Profit</th>
                  </tr>
                </thead>
                <tbody>
                  ${Object.entries(productBreakdown).map(([name, data]) => `
                    <tr>
                      <td data-label="Product" style="font-weight:700;">${name}</td>
                      <td data-label="Qty" class="num" style="text-align:right;font-weight:700;">${data.qty}</td>
                      <td data-label="Revenue" class="num" style="text-align:right;">${formatRM(data.revenue)}</td>
                      <td data-label="Profit" class="num" style="text-align:right;color:var(--color-brown);font-weight:700;">${formatRM(data.profit)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>

        <!-- Payment Methods & Promotions Used -->
        <div class="card">
          <div class="card-title">Payment & Promotion Breakdown</div>
          <div class="card-subtitle" style="margin-bottom:12px;">Payment channels and bundle promo redemptions</div>

          <div style="display:flex;flex-direction:column;gap:12px;">
            <div>
              <div style="font-size:0.78rem;font-weight:600;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">
                Payment Channels
              </div>
              <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;">
                <div style="background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:10px;">
                  <div style="font-size:0.75rem;color:var(--text-muted);">Cash</div>
                  <div class="num" style="font-size:1.05rem;font-weight:700;margin-top:2px;color:var(--color-brown);">${formatRM(paymentBreakdown.Cash || 0)}</div>
                </div>
                <div style="background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:10px;">
                  <div style="font-size:0.75rem;color:var(--text-muted);">DuitNow</div>
                  <div class="num" style="font-size:1.05rem;font-weight:700;margin-top:2px;color:var(--color-brown);">${formatRM(paymentBreakdown['DuitNow QR'] || 0)}</div>
                </div>
                <div style="background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:10px;">
                  <div style="font-size:0.75rem;color:var(--text-muted);">TnG</div>
                  <div class="num" style="font-size:1.05rem;font-weight:700;margin-top:2px;color:var(--color-brown);">${formatRM(paymentBreakdown.TnG || 0)}</div>
                </div>
                <div style="background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:10px;">
                  <div style="font-size:0.75rem;color:var(--text-muted);">Other</div>
                  <div class="num" style="font-size:1.05rem;font-weight:700;margin-top:2px;color:var(--color-brown);">${formatRM(paymentBreakdown.Other || 0)}</div>
                </div>
              </div>
            </div>

            <div style="margin-top:8px;">
              <div style="font-size:0.78rem;font-weight:600;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">
                Promotions Redeemed
              </div>
              ${Object.keys(promoBreakdown).length === 0 ? `
                <div style="font-size:0.85rem;color:var(--text-muted);">No promotions used on this date.</div>
              ` : `
                <div style="display:flex;flex-direction:column;gap:6px;">
                  ${Object.entries(promoBreakdown).map(([promoName, count]) => `
                    <div style="display:flex;justify-content:space-between;padding:6px 10px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-sm);font-size:0.85rem;">
                      <span style="font-weight:600;">${promoName}</span>
                      <span class="num" style="font-weight:700;">${count} times</span>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      </div>

      <!-- Individual Orders List for Selected Date -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div>
            <div class="card-title">Orders on ${formatDate(selectedRecordDate)}</div>
            <div class="card-subtitle">Click any order to inspect details, cost snapshots, or issue a void</div>
          </div>
          <span class="badge badge-outline">${dayOrders.length} total orders</span>
        </div>

        ${dayOrders.length === 0 ? `
          <div style="text-align:center;padding:50px 20px;color:var(--text-muted);">
            <div>No sales transactions recorded for this date.</div>
          </div>
        ` : `
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Time</th>
                  <th>Items Sold</th>
                  <th>Payment</th>
                  <th>Promotion</th>
                  <th style="text-align:right;">Subtotal</th>
                  <th style="text-align:right;">Final Paid</th>
                  <th style="text-align:right;">Gross Profit</th>
                  <th style="text-align:center;">Status</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${dayOrders.map(o => {
                  const isCancelled = o.status === 'cancelled';
                  return `
                    <tr style="${isCancelled ? 'opacity:0.6;background:var(--bg-secondary);' : ''}">
                      <td style="font-family:var(--font-mono);font-weight:700;font-size:0.85rem;">
                        ${o.order_number}
                      </td>
                      <td style="font-size:0.82rem;color:var(--text-muted);">${formatTime(o.timestamp)}</td>
                      <td style="font-size:0.85rem;max-width:220px;">
                        ${(o.items || []).map(i => `${i.name} (×${i.quantity || i.qty})`).join(', ')}
                      </td>
                      <td style="font-size:0.82rem;">${o.payment_method}</td>
                      <td style="font-size:0.8rem;color:var(--text-muted);">
                        ${o.promotion_snapshot?.name || '-'}
                      </td>
                      <td class="num" style="text-align:right;color:var(--text-muted);">${formatRM(o.subtotal)}</td>
                      <td class="num" style="text-align:right;font-weight:700;font-size:0.95rem;">
