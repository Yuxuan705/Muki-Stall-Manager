<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#936653">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muki POS">
  <title>Muki Stall Manager — Sales & Inventory POS</title>
  
  <style>
/* =========================================================
   Muki Stall Manager — Brand Theme
   Brand Brown: #936653
   Cream Background: #f8f6f3
   Accents: Orange (#f9a127), Soft Yellow (#f1dd9d)
   ========================================================= */

:root {
  --bg-primary: #f8f6f3;
  --bg-secondary: #f2ebe3;
  --bg-card: #ffffff;
  --bg-subtle: #eae1d7;
  --bg-hover: #e2d6c9;

  --border-light: #dfd3c6;
  --border-dark: #936653;

  --text-main: #936653;
  --text-dark: #5e3b2e;
  --text-muted: #a78170;
  --text-light: #c5a99c;

  --color-black: #936653;
  --color-brown: #936653;
  --color-brown-dark: #6e4433;
  --color-white: #f8f6f3;
  --color-orange: #f9a127;
  --color-yellow: #f1dd9d;
  --color-danger: #c53030;
  --color-success: #2f855a;

  --font-family-base: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-sans: var(--font-family-base);
  --font-mono: var(--font-family-base);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --sidebar-width: 250px;
  --header-height: 56px;
  --bottom-nav-height: 60px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(--font-family-base);
  -webkit-tap-highlight-color: transparent;
}

body, button, input, select, textarea {
  font-family: var(--font-family-base);
}

body {
  background-color: var(--bg-primary);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}

#app {
  display: flex;
  min-height: 100vh;
  background-color: var(--bg-primary);
}

/* Sidebar Navigation */
.sidebar {
  width: var(--sidebar-width);
  background-color: var(--color-white);
  border-right: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 40;
  user-select: none;
}

.sidebar-header {
  padding: 20px 20px 16px 20px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.brand-logo-img {
  height: 54px;
  width: auto;
  max-width: 140px;
  object-fit: contain;
  margin-bottom: 8px;
  display: block;
}

.brand-title {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--color-brown);
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-badge {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: var(--color-orange);
  color: #ffffff;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
}

.brand-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.sidebar-nav {
  padding: 12px 10px;
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-size: 0.92rem;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  background: transparent;
}

.nav-item svg {
  stroke: var(--color-brown);
}

.nav-item:hover {
  background-color: var(--bg-secondary);
}

.nav-item.active {
  background-color: var(--color-brown);
  color: var(--color-white);
}

.nav-item.active svg {
  stroke: var(--color-white);
}

.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--border-light);
  font-size: 0.78rem;
  color: var(--text-muted);
  background-color: var(--color-white);
}

/* Main Content Area */
.main-wrapper {
  flex: 1;
  margin-left: var(--sidebar-width);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-primary);
}

.main-content {
  flex: 1;
  padding: 24px 28px 48px 28px;
  max-width: 1300px;
  margin: 0 auto;
  width: 100%;
}

/* Mobile & iPad Header */
.top-header {
  display: none;
  background-color: var(--color-white);
  border-bottom: 1px solid var(--border-light);
  padding: 10px 16px;
  position: sticky;
  top: 0;
  z-index: 30;
  align-items: center;
  justify-content: space-between;
}

/* Bottom Navigation for Mobile */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: var(--color-white);
  border-top: 1px solid var(--border-light);
  height: var(--bottom-nav-height);
  z-index: 40;
  padding: 4px 6px;
  justify-content: space-around;
  align-items: center;
}

.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 0.68rem;
  font-weight: 600;
  text-decoration: none;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  gap: 2px;
}

.bottom-nav-item svg {
  stroke: var(--text-muted);
}

.bottom-nav-item.active {
  color: var(--color-brown);
  font-weight: 700;
}

.bottom-nav-item.active svg {
  stroke: var(--color-brown);
}

/* Typography */
h1.page-title {
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--color-brown-dark);
}

.page-subtitle {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.page-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 22px;
  flex-wrap: wrap;
  gap: 14px;
}

/* Cards */
.card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: 0 1px 3px rgba(147, 102, 83, 0.05);
}

.card-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--color-brown-dark);
  margin-bottom: 4px;
}

.card-subtitle {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  user-select: none;
  font-family: inherit;
  min-height: 38px;
}

.btn svg {
  stroke: currentColor;
}

.btn-sm {
  padding: 5px 12px;
  font-size: 0.8rem;
  min-height: 30px;
}

.btn-lg {
  padding: 12px 24px;
  font-size: 1rem;
  font-weight: 700;
  min-height: 48px;
}

.btn-primary {
  background-color: var(--color-brown);
  color: var(--color-white);
  border-color: var(--color-brown);
}

.btn-primary:hover {
  background-color: var(--color-brown-dark);
  border-color: var(--color-brown-dark);
}

.btn-secondary {
  background-color: var(--color-white);
  color: var(--color-brown);
  border-color: var(--border-light);
}

.btn-secondary:hover {
  background-color: var(--bg-secondary);
  border-color: var(--color-brown);
}

.btn-accent {
  background-color: var(--color-orange);
  color: #ffffff;
  border-color: var(--color-orange);
}

.btn-accent:hover {
  background-color: #e58d17;
}

.btn-danger {
  background-color: var(--color-white);
  color: var(--color-danger);
  border-color: #fca5a5;
}

.btn-danger:hover {
  background-color: #fef2f2;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Form Inputs */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--color-brown);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 9px 12px;
  font-size: 0.92rem;
  font-family: inherit;
  color: var(--color-brown-dark);
  background-color: var(--color-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--color-brown);
  box-shadow: 0 0 0 3px rgba(147, 102, 83, 0.15);
}

.form-input.number-input {
  font-family: var(--font-mono);
  font-weight: 600;
}

/* Tables */
.table-container {
  overflow-x: auto;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  background-color: var(--bg-card);
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  text-align: left;
}

.table th {
  background-color: var(--bg-secondary);
  padding: 10px 14px;
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-main);
  border-bottom: 1px solid var(--border-light);
}

.table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-light);
  color: var(--text-dark);
}

.table tr:last-child td {
  border-bottom: none;
}

.table tr:hover td {
  background-color: var(--bg-primary);
}

.table td.num {
  font-family: var(--font-family-base);
  font-feature-settings: "tnum";
  font-variant-numeric: tabular-nums;
  font-size: 0.92rem;
  font-weight: 600;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.badge svg {
  stroke: currentColor;
}

.badge-outline {
  border-color: var(--border-light);
  color: var(--color-brown);
  background: var(--bg-secondary);
}

.badge-active {
  background-color: #f0fdf4;
  color: var(--color-success);
  border-color: #bbf7d0;
}

.badge-cancelled {
  background-color: #fef2f2;
  color: var(--color-danger);
  border-color: #fecaca;
}

.badge-bundle {
  background-color: var(--color-yellow);
  color: #6e4433;
  border-color: #e5cb85;
}

.badge-warning {
  background-color: #fffbeb;
  color: #b45309;
  border-color: #fde68a;
}

.badge-accent {
  background-color: var(--color-orange);
  color: #ffffff;
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(94, 59, 46, 0.45);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-card {
  background-color: var(--color-white);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-light);
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 25px -5px rgba(94, 59, 46, 0.2);
  overflow: hidden;
}

.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--color-white);
}

.modal-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--color-brown-dark);
}

.modal-body {
  padding: 22px;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: 16px 22px;
  border-top: 1px solid var(--border-light);
  background-color: var(--bg-secondary);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
}

/* Grid Utilities */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

/* POS Specific Layout */
.pos-layout {
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 20px;
  height: calc(100vh - 110px);
}

.pos-catalog {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
}

.pos-cart-panel {
  background-color: var(--color-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(147, 102, 83, 0.08);
}

.pos-cart-items {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.pos-product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
  overflow-y: auto;
  padding: 4px 2px 20px 2px;
  flex: 1;
}

.product-tap-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  user-select: none;
  min-height: 130px;
  position: relative;
}

.product-tap-card:active {
  transform: scale(0.98);
}

.product-tap-card:hover {
  border-color: var(--color-brown);
  box-shadow: 0 4px 12px rgba(147, 102, 83, 0.12);
}

/* Receipt Printout Style */
.receipt-box {
  background-color: var(--color-white);
  border: 1px dashed var(--border-light);
  padding: 20px;
  border-radius: var(--radius-sm);
  font-family: var(--font-family-base);
  font-size: 0.85rem;
  line-height: 1.6;
  color: var(--color-brown-dark);
}

/* Responsive */
@media (max-width: 1024px) {
  .pos-layout {
    grid-template-columns: 1fr 360px;
  }
}

@media (max-width: 768px) {
  .sidebar {
    display: none;
  }

  .main-wrapper {
    margin-left: 0;
    padding-bottom: var(--bottom-nav-height);
  }

  .top-header {
    display: flex;
  }

  .bottom-nav {
    display: flex;
  }

  .main-content {
    padding: 16px 14px 28px 14px;
  }

  .pos-layout {
    display: flex;
    flex-direction: column;
    height: auto;
  }

  .pos-cart-panel {
    height: auto;
    max-height: 520px;
    margin-top: 16px;
  }

  .grid-2, .grid-3, .grid-4 {
    grid-template-columns: 1fr;
  }
}


    /* Print thermal receipt styles */
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt {
        position: absolute; left: 0; top: 0; width: 100%; max-width: 80mm;
        margin: 0; padding: 10px; background: #fff; border: none;
      }
      .modal-header, .modal-footer, .sidebar, .top-header, .bottom-nav { display: none !important; }
    }
  </style>

(function() {
// ==========================================
// Module: Muki Stall Manager/js/utils/format.js

/**
 * Formatting and Math Utilities
 * Consistent RM currency formatting, dates, math rounding, and sequential order numbers.
 */

function round(value, decimals = 2) {
  const factor = Math.pow(10, decimals);
  return Math.round((Number(value) || 0) * factor) / factor;
}

function formatRM(amount) {
  const num = round(amount, 2);
  return `RM ${num.toFixed(2)}`;
}

function parseRM(str) {
  if (typeof str === 'number') return str;
  if (!str) return 0;
  const cleaned = String(str).replace(/[^0-9.-]+/g, '');
  return round(parseFloat(cleaned) || 0);
}

function getTodayDateString() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function formatDate(dateVal) {
  if (!dateVal) return '-';
  const d = new Date(dateVal);
  if (isNaN(d.getTime())) return String(dateVal);
  return d.toLocaleDateString('en-GB', {
    day: '2-digit',
    month: 'short',
    year: 'numeric'
  });
}

function formatTime(dateVal) {
  if (!dateVal) return '-';
  const d = new Date(dateVal);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('en-US', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  });
}

function formatDateTime(dateVal) {
  if (!dateVal) return '-';
  const d = new Date(dateVal);
  if (isNaN(d.getTime())) return String(dateVal);
  return `${formatDate(d)} ${formatTime(d)}`;
}

function generateId(prefix = 'muki') {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
}

/**
 * Sequential Order Number Generator
 * Format: MUKI-YYYYMMDD-00001
 */
function generateOrderNumber(sequence = 1) {
  const d = new Date();
  const datePart = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const seqPart = String(sequence).padStart(5, '0');
  return `MUKI-${datePart}-${seqPart}`;
}

/**
 * IndexedDB Database Layer for Muki Stall Manager
 * Pure browser-native, reliable, persistent local storage.
 * Easily migratable to Firebase / Supabase in the future.
 */

const DB_NAME = 'MukiStallDB';
const DB_VERSION = 1;

let dbInstance = null;
let useLocalStorageFallback = false;

function getLocalStoreItems(storeName) {
  try {
    const raw = localStorage.getItem(`muki_${storeName}`);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function setLocalStoreItems(storeName, items) {
  try {
    localStorage.setItem(`muki_${storeName}`, JSON.stringify(items));
  } catch (e) {
    console.error('localStorage quota exceeded or blocked', e);
  }
}

function openDatabase() {
  if (dbInstance) return Promise.resolve(dbInstance);
  if (useLocalStorageFallback) return Promise.resolve(null);

  return new Promise((resolve) => {
    if (typeof indexedDB === 'undefined') {
      console.warn('IndexedDB not supported, falling back to localStorage');
      useLocalStorageFallback = true;
      return resolve(null);
    }

    try {
      let isSettled = false;
      const timeoutId = setTimeout(() => {
        if (!isSettled) {
          isSettled = true;
          console.warn('IndexedDB open timed out, falling back to localStorage');
          useLocalStorageFallback = true;
          resolve(null);
        }
      }, 2500);

      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;

        // Products Store
        if (!db.objectStoreNames.contains('products')) {
          const productStore = db.createObjectStore('products', { keyPath: 'id' });
          productStore.createIndex('category', 'category', { unique: false });
          productStore.createIndex('is_active', 'is_active', { unique: false });
        }

        // Bundle Recipes Store
        if (!db.objectStoreNames.contains('recipes')) {
          const recipeStore = db.createObjectStore('recipes', { keyPath: 'id' });
          recipeStore.createIndex('parent_product_id', 'parent_product_id', { unique: false });
          recipeStore.createIndex('component_product_id', 'component_product_id', { unique: false });
        }

        // Promotions Store
        if (!db.objectStoreNames.contains('promotions')) {
          const promoStore = db.createObjectStore('promotions', { keyPath: 'id' });
          promoStore.createIndex('is_active', 'is_active', { unique: false });
        }

        // Orders Store
        if (!db.objectStoreNames.contains('orders')) {
          const orderStore = db.createObjectStore('orders', { keyPath: 'id' });
          orderStore.createIndex('order_number', 'order_number', { unique: true });
          orderStore.createIndex('date', 'date', { unique: false });
          orderStore.createIndex('status', 'status', { unique: false });
        }

        // Stock Movement Audit Log
        if (!db.objectStoreNames.contains('stock_movements')) {
          const movementStore = db.createObjectStore('stock_movements', { keyPath: 'id' });
          movementStore.createIndex('product_id', 'product_id', { unique: false });
          movementStore.createIndex('timestamp', 'timestamp', { unique: false });
          movementStore.createIndex('reason', 'reason', { unique: false });
        }

        // Cost Change History Log
        if (!db.objectStoreNames.contains('cost_history')) {
          const costStore = db.createObjectStore('cost_history', { keyPath: 'id' });
          costStore.createIndex('product_id', 'product_id', { unique: false });
          costStore.createIndex('timestamp', 'timestamp', { unique: false });
        }

        // Expenses Store
        if (!db.objectStoreNames.contains('expenses')) {
          const expenseStore = db.createObjectStore('expenses', { keyPath: 'id' });
          expenseStore.createIndex('date', 'date', { unique: false });
          expenseStore.createIndex('category', 'category', { unique: false });
        }

        // Settings Store
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'key' });
        }
      };

      request.onsuccess = (event) => {
        if (isSettled) return;
        isSettled = true;
        clearTimeout(timeoutId);
        dbInstance = event.target.result;
        resolve(dbInstance);
      };

      request.onerror = (event) => {
        if (isSettled) return;
        isSettled = true;
        clearTimeout(timeoutId);
        console.warn('IndexedDB error, falling back to localStorage:', event.target.error);
        useLocalStorageFallback = true;
        resolve(null);
      };

      request.onblocked = () => {
        console.warn('IndexedDB open blocked');
      };
    } catch (e) {
      console.warn('IndexedDB initialization exception, using localStorage:', e);
      useLocalStorageFallback = true;
      resolve(null);
    }
  });
}

/**
 * Generic Read All
 */
async function getAll(storeName) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    return getLocalStoreItems(storeName);
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const request = store.getAll();

      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    } catch (err) {
      console.warn('Error reading store, falling back to localStorage:', err);
      resolve(getLocalStoreItems(storeName));
    }
  });
}

/**
 * Generic Get By ID
 */
async function getById(storeName, id) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    const items = getLocalStoreItems(storeName);
    const keyProp = storeName === 'settings' ? 'key' : 'id';
    return items.find(item => item[keyProp] === id) || null;
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const request = store.get(id);

      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    } catch (err) {
      const items = getLocalStoreItems(storeName);
      const keyProp = storeName === 'settings' ? 'key' : 'id';
      resolve(items.find(item => item[keyProp] === id) || null);
    }
  });
}

/**
 * Generic Put / Upsert Item
 */
async function putItem(storeName, item) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    const items = getLocalStoreItems(storeName);
    const keyProp = storeName === 'settings' ? 'key' : 'id';
    const idx = items.findIndex(i => i[keyProp] === item[keyProp]);
    if (idx >= 0) {
      items[idx] = item;
    } else {
      items.push(item);
    }
    setLocalStoreItems(storeName, items);
    return item[keyProp];
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const request = store.put(item);

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    } catch (err) {
      const items = getLocalStoreItems(storeName);
      const keyProp = storeName === 'settings' ? 'key' : 'id';
      const idx = items.findIndex(i => i[keyProp] === item[keyProp]);
      if (idx >= 0) items[idx] = item; else items.push(item);
      setLocalStoreItems(storeName, items);
      resolve(item[keyProp]);
    }
  });
}

/**
 * Generic Add Item
 */
async function addItem(storeName, item) {
  return putItem(storeName, item);
}

/**
 * Generic Delete Item
 */
async function deleteItem(storeName, id) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    let items = getLocalStoreItems(storeName);
    const keyProp = storeName === 'settings' ? 'key' : 'id';
    items = items.filter(i => i[keyProp] !== id);
    setLocalStoreItems(storeName, items);
    return true;
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const request = store.delete(id);

      request.onsuccess = () => resolve(true);
      request.onerror = () => reject(request.error);
    } catch (err) {
      let items = getLocalStoreItems(storeName);
      const keyProp = storeName === 'settings' ? 'key' : 'id';
      items = items.filter(i => i[keyProp] !== id);
      setLocalStoreItems(storeName, items);
      resolve(true);
    }
  });
}

/**
 * Generic Clear Store
 */
async function clearStore(storeName) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    setLocalStoreItems(storeName, []);
    return true;
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const request = store.clear();

      request.onsuccess = () => resolve(true);
      request.onerror = () => reject(request.error);
    } catch (err) {
      setLocalStoreItems(storeName, []);
      resolve(true);
    }
  });
}

/**
 * Bulk Put Items (in a single transaction)
 */
async function bulkPut(storeName, items) {
  if (!items || !items.length) return [];
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    const existing = getLocalStoreItems(storeName);
    const keyProp = storeName === 'settings' ? 'key' : 'id';
    const map = new Map(existing.map(i => [i[keyProp], i]));
    items.forEach(i => map.set(i[keyProp], i));
    const merged = Array.from(map.values());
    setLocalStoreItems(storeName, merged);
    return items;
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);

      items.forEach(item => store.put(item));

      tx.oncomplete = () => resolve(items);
      tx.onerror = () => reject(tx.error);
    } catch (err) {
      const existing = getLocalStoreItems(storeName);
      const keyProp = storeName === 'settings' ? 'key' : 'id';
      const map = new Map(existing.map(i => [i[keyProp], i]));
      items.forEach(i => map.set(i[keyProp], i));
      setLocalStoreItems(storeName, Array.from(map.values()));
      resolve(items);
    }
  });
}

/**
 * Transaction Helper
 */
async function runTransaction(storeNames, mode, fn) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    return fn(null);
  }
  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeNames, mode);
      let result = fn(tx);
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
    } catch (err) {
      reject(err);
    }
  });
}



// Explicit database adapter namespace for bundled runtime
const db = {
  openDatabase,
  getAll,
  getById,
  putItem,
  addItem,
  deleteItem,
  clearStore,
  bulkPut,
  runTransaction
};

/**
 * Central Reactive Store
 * Manages in-memory cache synchronized with IndexedDB and dispatches change events.
 */





class AppStore {
  constructor() {
    this.products = [];
    this.recipes = [];
    this.promotions = [];
    this.orders = [];
    this.stockMovements = [];
    this.costHistory = [];
    this.expenses = [];
    this.settings = {};
    this.cart = [];
    this.listeners = new Map();
    this.isReady = false;
  }

  // Subscribe to changes: 'products', 'orders', 'cart', 'expenses', etc., or '*' for any change
  subscribe(event, callback) {
    if (!this.listeners.has(event)) {
      this.listeners.set(event, new Set());
    }
    this.listeners.get(event).add(callback);
    return () => this.listeners.get(event)?.delete(callback);
  }

  notify(event, data) {
    if (this.listeners.has(event)) {
      this.listeners.get(event).forEach(cb => cb(data));
    }
    if (this.listeners.has('*')) {
      this.listeners.get('*').forEach(cb => cb({ event, data }));
    }
  }

  async init() {
    await db.openDatabase();
    
    // Check if initial seeding is needed
    const settingsList = await db.getAll('settings');
    const isInitialized = settingsList.some(s => s.key === 'initialized' && s.value === true);

    if (!isInitialized) {
      console.log('First launch detected. Seeding initial Muki data...');
      await db.bulkPut('products', INITIAL_PRODUCTS);
      await db.bulkPut('recipes', INITIAL_RECIPES);
      await db.bulkPut('promotions', INITIAL_PROMOTIONS);
      for (const s of INITIAL_SETTINGS) {
        await db.putItem('settings', s);
      }
    }

    await this.refreshAll();
    this.isReady = true;
    this.notify('ready', true);
  }

  async refreshAll() {
    const [products, recipes, promotions, orders, stockMovements, costHistory, expenses, settingsList] = await Promise.all([
      db.getAll('products'),
      db.getAll('recipes'),
      db.getAll('promotions'),
      db.getAll('orders'),
      db.getAll('stock_movements'),
      db.getAll('cost_history'),
      db.getAll('expenses'),
      db.getAll('settings')
    ]);

    // Ensure sort_order on products and sort by sequence
    products.forEach((p, idx) => {
      if (typeof p.sort_order !== 'number') {
        p.sort_order = idx + 1;
      }
    });
    this.products = products.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    this.recipes = recipes;
    this.promotions = promotions;
    // Sort orders newest first
    this.orders = orders.sort((a, b) => new Date(b.created_at || b.timestamp) - new Date(a.created_at || a.timestamp));
    this.stockMovements = stockMovements.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    this.costHistory = costHistory.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    this.expenses = expenses.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    this.settings = {};
    settingsList.forEach(s => {
      this.settings[s.key] = s.value;
    });

    this.notify('all_refreshed');
  }

  // --- Helpers for Component-based Inventory ---

  /**
   * Get recipes for a bundle product
   */
  getProductRecipes(productId) {
    return this.recipes.filter(r => r.parent_product_id === productId);
  }

  /**
   * Check if a product is a bundle or has recipe components
   */
  isBundleProduct(productId) {
    const prod = this.products.find(p => p.id === productId);
    if (!prod) return false;
    if (prod.is_bundle) return true;
    return this.recipes.some(r => r.parent_product_id === productId);
  }

  /**
   * Calculate available stock for a product:
   * - If regular product: its own stock.
   * - If bundle product: min(floor(component_stock / component_qty)) for each component recipe.
   */
  getAvailableStock(productId) {
    const prod = this.products.find(p => p.id === productId);
    if (!prod) return 0;

    const recipes = this.getProductRecipes(productId);
    if (!recipes || recipes.length === 0) {
      return Number(prod.stock) || 0;
    }

    // It's a bundle with components! Calculate how many can be assembled
    let maxAssemble = Infinity;
    for (const r of recipes) {
      const comp = this.products.find(p => p.id === r.component_product_id);
      const compStock = comp ? Math.max(0, Number(comp.stock) || 0) : 0;
      const reqQty = Number(r.quantity) || 1;
      const possible = Math.floor(compStock / reqQty);
      if (possible < maxAssemble) {
        maxAssemble = possible;
      }
    }

    return maxAssemble === Infinity ? 0 : maxAssemble;
  }

  /**
   * Calculate the live cost of a product:
   * - If it has a recipe, can compute sum of component costs or use set cost.
   */
  getComputedCost(productId) {
    const prod = this.products.find(p => p.id === productId);
    if (!prod) return 0;

    const recipes = this.getProductRecipes(productId);
    if (recipes && recipes.length > 0) {
      let sumCost = 0;
      for (const r of recipes) {
        const comp = this.products.find(p => p.id === r.component_product_id);
        const compCost = comp ? (Number(comp.cost) || 0) : 0;
        sumCost += compCost * (Number(r.quantity) || 1);
      }
      return round(sumCost);
    }

    return Number(prod.cost) || 0;
  }

  // --- Categories Management ---
  getCategories() {
    const defaultCats = ['Mukichip', 'Accessories', 'Stickers', 'Bundles', 'Other'];
    const custom = this.settings.custom_categories;
    if (Array.isArray(custom) && custom.length > 0) {
      return custom;
    }
    return defaultCats;
  }

  async addCategory(name) {
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    const cats = [...this.getCategories()];
    if (!cats.includes(trimmed)) {
      cats.push(trimmed);
      await db.putItem('settings', { key: 'custom_categories', value: cats });
      await this.refreshAll();
    }
  }

  async deleteCategory(name) {
    let cats = this.getCategories().filter(c => c !== name);
    if (cats.length === 0) cats = ['Other'];
    await db.putItem('settings', { key: 'custom_categories', value: cats });
    await this.refreshAll();
  }

  // --- Operating Expenses Categories Management ---
  getExpenseCategories() {
    const defaultExpenseCats = ['Stall rental', 'Transportation', 'Packaging', 'Printing', 'Other'];
    const custom = this.settings.custom_expense_categories;
    if (Array.isArray(custom) && custom.length > 0) {
      return custom;
    }
    return defaultExpenseCats;
  }

  async addExpenseCategory(name) {
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    const cats = [...this.getExpenseCategories()];
    if (!cats.includes(trimmed)) {
      cats.push(trimmed);
      await db.putItem('settings', { key: 'custom_expense_categories', value: cats });
      await this.refreshAll();
    }
  }

  async deleteExpenseCategory(name) {
    let cats = this.getExpenseCategories().filter(c => c !== name);
    if (cats.length === 0) cats = ['Other'];
    await db.putItem('settings', { key: 'custom_expense_categories', value: cats });
    await this.refreshAll();
  }

  // --- Product Ordering / Sequence Management ---
  async moveProduct(productId, direction) {
    const idx = this.products.findIndex(p => p.id === productId);
    if (idx === -1) return;

    const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
    if (targetIdx < 0 || targetIdx >= this.products.length) return;

    const current = this.products[idx];
    const target = this.products[targetIdx];

    const currentOrder = current.sort_order ?? (idx + 1);
    const targetOrder = target.sort_order ?? (targetIdx + 1);

    if (currentOrder === targetOrder) {
      this.products.splice(idx, 1);
      this.products.splice(targetIdx, 0, current);
      for (let i = 0; i < this.products.length; i++) {
        this.products[i].sort_order = i + 1;
        await db.putItem('products', this.products[i]);
      }
    } else {
      current.sort_order = targetOrder;
      target.sort_order = currentOrder;
      await db.putItem('products', current);
      await db.putItem('products', target);
    }

    await this.refreshAll();
  }

  async sortProductsBy(criteria) {
    let sorted = [...this.products];
    if (criteria === 'name_asc') {
      sorted.sort((a, b) => a.name.localeCompare(b.name));
    } else if (criteria === 'name_desc') {
      sorted.sort((a, b) => b.name.localeCompare(a.name));
    } else if (criteria === 'price_desc') {
      sorted.sort((a, b) => (Number(b.selling_price) || 0) - (Number(a.selling_price) || 0));
    } else if (criteria === 'price_asc') {
      sorted.sort((a, b) => (Number(a.selling_price) || 0) - (Number(b.selling_price) || 0));
    } else if (criteria === 'stock_asc') {
      sorted.sort((a, b) => this.getAvailableStock(a.id) - this.getAvailableStock(b.id));
    } else if (criteria === 'stock_desc') {
      sorted.sort((a, b) => this.getAvailableStock(b.id) - this.getAvailableStock(a.id));
    } else if (criteria === 'category') {
      sorted.sort((a, b) => (a.category || '').localeCompare(b.category || '') || a.name.localeCompare(b.name));
    }

    for (let i = 0; i < sorted.length; i++) {
      sorted[i].sort_order = i + 1;
      await db.putItem('products', sorted[i]);
    }
    await this.refreshAll();
  }

  // --- Cart Management for POS ---

  addToCart(productId, quantity = 1) {
    const product = this.products.find(p => p.id === productId);
    if (!product) return false;

    const existingIndex = this.cart.findIndex(item => item.productId === productId);
    if (existingIndex >= 0) {
      this.cart[existingIndex].quantity += quantity;
    } else {
      this.cart.push({
        productId,
        product,
        quantity,
        unitPrice: Number(product.selling_price) || 0,
        unitCost: this.getComputedCost(productId)
      });
    }

    this.notify('cart', this.cart);
    return true;
  }

  updateCartQty(productId, delta) {
    const item = this.cart.find(i => i.productId === productId);
    if (!item) return;

    item.quantity += delta;
    if (item.quantity <= 0) {
      this.removeFromCart(productId);
    } else {
      this.notify('cart', this.cart);
    }
  }

  setCartQty(productId, exactQty) {
    const item = this.cart.find(i => i.productId === productId);
    if (!item) return;

    const qty = parseInt(exactQty, 10);
    if (isNaN(qty) || qty <= 0) {
      this.removeFromCart(productId);
    } else {
      item.quantity = qty;
      this.notify('cart', this.cart);
    }
  }

  updateCartItemPrice(productId, newPrice) {
    const item = this.cart.find(i => i.productId === productId);
    if (!item) return;
    const parsed = Math.max(0, round(parseFloat(newPrice) || 0));
    item.unitPrice = parsed;
    item.isCustomPrice = true;
    this.notify('cart', this.cart);
  }

  setManualDiscount(amount) {
    this.manualDiscount = Math.max(0, round(parseFloat(amount) || 0));
    this.notify('cart', this.cart);
  }

  getManualDiscount() {
    return this.manualDiscount || 0;
  }

  removeFromCart(productId) {
    this.cart = this.cart.filter(item => item.productId !== productId);
    this.notify('cart', this.cart);
  }

  clearCart() {
    this.cart = [];
    this.manualDiscount = 0;
    this.notify('cart', this.cart);
  }
}

/**
 * Inventory Service
 * Handles component-based bundle deductions, stock adjustments, recipe management, and audit trails.
 */





/**
 * Deduct inventory for an order's items.
 * If an item is a bundle with a recipe, deducts component stock.
 * Otherwise, deducts item's own stock.
 * Creates stock_movement records for every change.
 */
async function deductStockForOrder(items, orderId, orderNumber) {
  const timestamp = new Date().toISOString();
  const deductions = []; // Array of { productId, delta, reason, notes }

  for (const item of items) {
    const qty = Number(item.quantity || item.qty) || 1;
    const recipes = store.getProductRecipes(item.productId || item.product_id);

    if (recipes && recipes.length > 0) {
      // Bundle: deduct each component
      for (const recipe of recipes) {
        const componentQty = (Number(recipe.quantity) || 1) * qty;
        deductions.push({
          productId: recipe.component_product_id,
          delta: -componentQty,
          reason: 'sale',
          notes: `Sold via bundle: ${item.name || item.product?.name} (Qty: ${qty}) [Order ${orderNumber}]`
        });
      }
    } else {
      // Single product: deduct direct stock
      deductions.push({
        productId: item.productId || item.product_id,
        delta: -qty,
        reason: 'sale',
        notes: `Sold directly (Qty: ${qty}) [Order ${orderNumber}]`
      });
    }
  }

  // Apply all deductions in database and log movements
  for (const ded of deductions) {
    const product = await db.getById('products', ded.productId);
    if (!product) continue;

    const previousStock = Number(product.stock) || 0;
    const newStock = previousStock + ded.delta; // delta is negative
    product.stock = newStock;
    product.updated_at = timestamp;

    await db.putItem('products', product);

    // Record movement audit
    await db.addItem('stock_movements', {
      id: generateId('smov'),
      product_id: ded.productId,
      product_name: product.name,
      delta: ded.delta,
      previous_stock: previousStock,
      new_stock: newStock,
      reason: ded.reason,
      order_id: orderId,
      order_number: orderNumber,
      notes: ded.notes,
      timestamp
    });
  }

  await store.refreshAll();
  return deductions;
}

/**
 * Restore inventory when an order is cancelled.
 * Reverses the exact deductions made for the order.
 */
async function restoreStockForCancelledOrder(order) {
  if (!order || order.status === 'cancelled') {
    throw new Error('Order is already cancelled or invalid.');
  }

  const timestamp = new Date().toISOString();
  const restorations = [];

  for (const item of order.items) {
    const qty = Number(item.quantity || item.qty) || 1;
    const recipes = store.getProductRecipes(item.productId || item.product_id);

    if (recipes && recipes.length > 0) {
      for (const recipe of recipes) {
        const componentQty = (Number(recipe.quantity) || 1) * qty;
        restorations.push({
          productId: recipe.component_product_id,
          delta: +componentQty,
          notes: `Restored from cancelled order ${order.order_number} (${item.name || 'Bundle'} x${qty})`
        });
      }
    } else {
      restorations.push({
        productId: item.productId || item.product_id,
        delta: +qty,
        notes: `Restored from cancelled order ${order.order_number} (${item.name} x${qty})`
      });
    }
  }

  for (const res of restorations) {
    const product = await db.getById('products', res.productId);
    if (!product) continue;

    const previousStock = Number(product.stock) || 0;
    const newStock = previousStock + res.delta;
    product.stock = newStock;
    product.updated_at = timestamp;

    await db.putItem('products', product);

    await db.addItem('stock_movements', {
      id: generateId('smov'),
      product_id: res.productId,
      product_name: product.name,
      delta: res.delta,
      previous_stock: previousStock,
      new_stock: newStock,
      reason: 'order_cancellation',
      order_id: order.id,
      order_number: order.order_number,
      notes: res.notes,
      timestamp
    });
  }

  await store.refreshAll();
  return restorations;
}

/**
 * Manual stock adjustment with audit logging
 */
async function adjustStock({ productId, adjustmentType, quantity, notes }) {
  const product = await db.getById('products', productId);
  if (!product) throw new Error('Product not found.');

  const timestamp = new Date().toISOString();
  const previousStock = Number(product.stock) || 0;
  let delta = 0;
  let newStock = previousStock;

  const numQty = Math.abs(parseInt(quantity, 10) || 0);

  switch (adjustmentType) {
    case 'receipt': // New stock received (+)
      delta = numQty;
      newStock = previousStock + numQty;
      break;
    case 'damaged': // Damaged item (-)
      delta = -numQty;
      newStock = previousStock - numQty;
      break;
    case 'missing': // Missing stock (-)
      delta = -numQty;
      newStock = previousStock - numQty;
      break;
    case 'correction': // Stock correction (set exact quantity)
      newStock = parseInt(quantity, 10) || 0;
      delta = newStock - previousStock;
      break;
    default:
      throw new Error(`Unknown adjustment type: ${adjustmentType}`);
  }

  product.stock = newStock;
  product.updated_at = timestamp;
  await db.putItem('products', product);

  await db.addItem('stock_movements', {
    id: generateId('smov'),
    product_id: productId,
    product_name: product.name,
    delta,
    previous_stock: previousStock,
    new_stock: newStock,
    reason: adjustmentType,
    order_id: null,
    order_number: null,
    notes: notes || `Manual stock adjustment (${adjustmentType})`,
    timestamp
  });

  await store.refreshAll();
  return { previousStock, newStock, delta };
}

/**
 * Recipe management for bundles
 */
async function saveRecipe(parentProductId, components) {
  // Remove existing recipes for parent
  const existing = await db.getAll('recipes');
  for (const r of existing) {
    if (r.parent_product_id === parentProductId) {
      await db.deleteItem('recipes', r.id);
    }
  }

  // Insert new recipes
  for (const comp of components) {
    if (!comp.component_product_id || !comp.quantity) continue;
    await db.addItem('recipes', {
      id: generateId('rec'),
      parent_product_id: parentProductId,
      component_product_id: comp.component_product_id,
      quantity: Number(comp.quantity) || 1
    });
  }

  await store.refreshAll();
}

/**
 * Promotions Service
 * Evaluates bundle promos, discount rules, and tracks promo usage counts.
 */





/**
 * Checks if a promotion is currently valid based on active status and dates
 */
function isPromotionValid(promo, date = new Date()) {
  if (!promo || !promo.is_active) return false;
  
  const currentDate = date.toISOString().split('T')[0];
  if (promo.start_date && currentDate < promo.start_date) return false;
  if (promo.end_date && currentDate > promo.end_date) return false;

  return true;
}

/**
 * Calculate the discount for the current cart given a promotion
 */
function calculatePromotionDiscount(promo, cartItems, cartSubtotal) {
  if (!promo || !isPromotionValid(promo)) return 0;

  if (promo.type === 'bundle_price') {
    // Check if cart contains required bundle items
    if (promo.bundle_recipe && promo.bundle_recipe.length > 0) {
      // Find how many complete sets exist in cart
      let maxSets = Infinity;
      let regularSetPrice = 0;

      for (const req of promo.bundle_recipe) {
        const inCart = cartItems.find(i => (i.productId || i.product_id) === req.product_id);
        const qtyInCart = inCart ? (Number(inCart.quantity || inCart.qty) || 0) : 0;
        const requiredQty = Number(req.quantity) || 1;
        const sets = Math.floor(qtyInCart / requiredQty);
        if (sets < maxSets) maxSets = sets;

        // Add regular price of required items
        const prod = store.products.find(p => p.id === req.product_id);
        const unitPrice = prod ? Number(prod.selling_price) : 0;
        regularSetPrice += unitPrice * requiredQty;
      }

      if (maxSets > 0 && maxSets !== Infinity) {
        const promoPrice = Number(promo.price) || 0;
        const savingPerSet = Math.max(0, regularSetPrice - promoPrice);
        return round(savingPerSet * maxSets);
      }
    } else {
      // Direct bundle product promotion
      const promoPrice = Number(promo.price) || 0;
      if (cartSubtotal > promoPrice) {
        return round(cartSubtotal - promoPrice);
      }
    }
    return 0;
  }

  if (promo.type === 'fixed_discount') {
    const val = Number(promo.value) || 0;
    return round(Math.min(cartSubtotal, val));
  }

  if (promo.type === 'percent_discount') {
    const pct = Number(promo.value) || 0;
    return round((cartSubtotal * pct) / 100);
  }

  return 0;
}

/**
 * Record promotion usage in DB when an order completes
 */
async function incrementPromotionUsage(promoId) {
  if (!promoId) return;
  const promo = await db.getById('promotions', promoId);
  if (!promo) return;

  promo.usage_count = (Number(promo.usage_count) || 0) + 1;
  await db.putItem('promotions', promo);
  await store.refreshAll();
}

/**
 * Create or update a promotion
 */
async function savePromotion(promoData) {
  const isNew = !promoData.id;
  const promo = {
    id: promoData.id || generateId('promo'),
    name: promoData.name.trim(),
    description: promoData.description || '',
    type: promoData.type || 'bundle_price',

    start_date: promoData.start_date || '',
    end_date: promoData.end_date || '',
    usage_count: Number(promoData.usage_count) || 0,
    created_at: promoData.created_at || new Date().toISOString()
  };

  await db.putItem('promotions', promo);

}

/**

/**
 * Sales / POS Service
 * Handles order checkout, cost snapshots, profit calculations, inventory deductions, and order cancellations.
 */







let isProcessingOrder = false;

/**
 * Process a new sale from the POS cart
 */
async function createOrder({ cartItems, paymentMethod = 'Cash', paymentNotes = '', promotion = null, customDiscount = 0 }) {
  if (isProcessingOrder) {
    throw new Error('An order is already being processed. Please wait.');
  }

  if (!cartItems || cartItems.length === 0) {
    throw new Error('Cart is empty.');
  }

  try {
    isProcessingOrder = true;

    const timestamp = new Date().toISOString();
    const orderDate = getTodayDateString();
    const orderId = generateId('ord');

    // Calculate sequential order number for today: MUKI-YYYYMMDD-00001
    const d = new Date();
    const datePart = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const todayOrders = (store.orders || []).filter(o => o.date === orderDate);
    let nextSeq = 1;
    todayOrders.forEach(o => {
      if (o.order_number && o.order_number.startsWith(`MUKI-${datePart}-`)) {
        const parts = o.order_number.split('-');
        const seq = parseInt(parts[2], 10);
        if (!isNaN(seq) && seq >= nextSeq) {
          nextSeq = seq + 1;
        }
      } else {
        nextSeq = Math.max(nextSeq, todayOrders.length + 1);
      }
    });
    const orderNumber = generateOrderNumber(nextSeq);

    // 1. Snapshot items with current price and current cost
    let subtotal = 0;
    let totalCogs = 0;

    const itemsSnapshot = cartItems.map(item => {
      const prod = store.products.find(p => p.id === (item.productId || item.product_id));
      const unitPrice = Number(item.unitPrice ?? prod?.selling_price ?? 0);
      const unitCost = Number(item.unitCost ?? store.getComputedCost(prod?.id) ?? 0);
      const qty = Number(item.quantity || item.qty) || 1;

      const itemSubtotal = round(unitPrice * qty);
      const itemCostTotal = round(unitCost * qty);

      subtotal += itemSubtotal;
      totalCogs += itemCostTotal;

      return {
        productId: prod ? prod.id : item.productId,
        name: prod ? prod.name : item.name,
        category: prod ? prod.category : 'General',
        quantity: qty,
        unitPrice: round(unitPrice),
        unitCost: round(unitCost),
        subtotal: itemSubtotal,
        costSubtotal: itemCostTotal
      };
    });

    subtotal = round(subtotal);
    totalCogs = round(totalCogs);

    // 2. Calculate discount & final payable amount
    const discount = round(customDiscount);
    const finalAmount = round(Math.max(0, subtotal - discount));
    
    // Gross Profit = Actual revenue paid - Cost of goods sold
    const grossProfit = round(finalAmount - totalCogs);

    // 3. Deduct stock (component-based)
    await deductStockForOrder(itemsSnapshot, orderId, orderNumber);

    // 4. Update promotion usage if applied
    if (promotion && promotion.id) {
      await incrementPromotionUsage(promotion.id);
    }

    let finalPaymentMethod = paymentMethod;
    if (paymentMethod === 'Other' && paymentNotes) {
      finalPaymentMethod = `Other (${paymentNotes})`;
    }

    // 5. Build and save order snapshot
    const order = {
      id: orderId,
      order_number: orderNumber,
      date: orderDate,
      timestamp,
      items: itemsSnapshot,
      subtotal,
      discount,
      final_amount: finalAmount,
      total_cost: totalCogs,
      gross_profit: grossProfit,
      payment_method: finalPaymentMethod,
      payment_channel: paymentMethod,
      payment_notes: paymentNotes || '',
      promotion_snapshot: promotion ? {
        id: promotion.id,
        name: promotion.name,
        type: promotion.type,
        discount
      } : null,
      status: 'completed',
      cancellation: null,
      created_at: timestamp
    };

    await db.addItem('orders', order);
    await store.refreshAll();

    // Clear cart after successful sale
    store.clearCart();

    return order;
  } finally {
    isProcessingOrder = false;
  }
}

/**
 * Cancel an order, restore stock, and record audit reason
 */
async function cancelOrder(orderId, reason = 'Customer requested cancellation') {
  const order = await db.getById('orders', orderId);
  if (!order) {
    throw new Error('Order not found.');
  }

  if (order.status === 'cancelled') {
    throw new Error('Order has already been cancelled.');
  }

  // 1. Restore inventory
  await restoreStockForCancelledOrder(order);

  // 2. Update order record with cancellation details
  order.status = 'cancelled';
  order.cancellation = {
    cancelled_at: new Date().toISOString(),
    reason: reason.trim() || 'No reason provided'
  };

  await db.putItem('orders', order);
  await store.refreshAll();

  return order;
}

/**
 * Permanently delete an order and restore stock if not already cancelled
 */
async function deleteOrder(orderId) {
  const order = await db.getById('orders', orderId);
  if (!order) {
    throw new Error('Order not found.');
  }

  // 1. If order was completed, restore inventory back to stock
  if (order.status !== 'cancelled') {
    await restoreStockForCancelledOrder(order);
  }

  // 2. Remove order from database
  await db.deleteItem('orders', orderId);
  await store.refreshAll();

  return true;
}

/**
 * Update product cost and log historical cost change
 */
async function updateProductCost(productId, newCost, notes = '') {
  const product = await db.getById('products', productId);
  if (!product) throw new Error('Product not found.');

  const previousCost = Number(product.cost) || 0;
  const parsedNewCost = round(Number(newCost) || 0);

  if (previousCost === parsedNewCost) {
    return product;
  }

  const timestamp = new Date().toISOString();

  // Update product cost
  product.cost = parsedNewCost;
  product.updated_at = timestamp;
  await db.putItem('products', product);

  // Record cost change history (previous orders remain untouched!)
  await db.addItem('cost_history', {
    id: generateId('cost'),
    product_id: productId,
    product_name: product.name,
    previous_cost: previousCost,
    new_cost: parsedNewCost,
    notes: notes || 'Supplier / production cost update',
    timestamp
  });

  await store.refreshAll();
  return product;
}

/**
 * Backup and Restore Service
 * Full JSON snapshot export/import and CSV for spreadsheets.
 */





/**
 * Generate full backup object containing all stores
 */
async function createBackupData() {
  const [products, recipes, promotions, orders, stockMovements, costHistory, expenses, settings] = await Promise.all([
    db.getAll('products'),
    db.getAll('recipes'),
    db.getAll('promotions'),
    db.getAll('orders'),
    db.getAll('stock_movements'),
    db.getAll('cost_history'),
    db.getAll('expenses'),
    db.getAll('settings')
  ]);

  const timestamp = new Date().toISOString();

  // Update last_backup_date setting
  await db.putItem('settings', { key: 'last_backup_date', value: timestamp });
  await store.refreshAll();

  return {
    meta: {
      appName: 'Muki Stall Manager',
      schemaVersion: 1,
      exportTimestamp: timestamp,
      summary: {
        products: products.length,
        recipes: recipes.length,
        promotions: promotions.length,
        orders: orders.length,
        stockMovements: stockMovements.length,
        costHistory: costHistory.length,
        expenses: expenses.length
      }
    },
    data: {
      products,
      recipes,
      promotions,
      orders,
      stock_movements: stockMovements,
      cost_history: costHistory,
      expenses,
      settings
    }
  };
}

/**
 * Trigger download of full JSON backup
 */
async function downloadJsonBackup() {
  const backup = await createBackupData();
  const dateStr = new Date().toISOString().split('T')[0];
  const filename = `muki-stall-backup-${dateStr}.json`;

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  triggerFileDownload(blob, filename);
  return backup;
}

/**
 * Validate a backup file content before restoring
 */
function validateBackupFile(parsedJson) {
  if (!parsedJson || typeof parsedJson !== 'object') {
    throw new Error('Invalid file format. Must be a valid JSON object.');
  }

  const data = parsedJson.data || parsedJson; // support flat or nested
  if (!data.products && !data.orders) {
    throw new Error('Unrecognized backup format. Missing core products or orders collections.');
  }

  return {
    valid: true,
    meta: parsedJson.meta || {},
    counts: {
      products: Array.isArray(data.products) ? data.products.length : 0,
      orders: Array.isArray(data.orders) ? data.orders.length : 0,
      promotions: Array.isArray(data.promotions) ? data.promotions.length : 0,
      expenses: Array.isArray(data.expenses) ? data.expenses.length : 0,
      recipes: Array.isArray(data.recipes) ? data.recipes.length : 0
    },
    raw: data
  };
}

/**
 * Restore data from parsed backup
 */
async function restoreFromBackup(backupData, mode = 'replace') {
  const data = backupData.data || backupData.raw || backupData;

  const storesToRestore = [
    { name: 'products', items: data.products },
    { name: 'recipes', items: data.recipes },
    { name: 'promotions', items: data.promotions },
    { name: 'orders', items: data.orders },
    { name: 'stock_movements', items: data.stock_movements },
    { name: 'cost_history', items: data.cost_history },
    { name: 'expenses', items: data.expenses },
    { name: 'settings', items: data.settings }
  ];

  for (const { name, items } of storesToRestore) {
    if (!items || !Array.isArray(items)) continue;

    if (mode === 'replace') {
      await db.clearStore(name);
    }

    await db.bulkPut(name, items);
  }

  // Record restoration timestamp
  await db.putItem('settings', { key: 'last_restored_date', value: new Date().toISOString() });
  await store.refreshAll();
  return true;
}

/**
 * Export orders to CSV
 */
function exportOrdersCsv(orders = store.orders) {
  const headers = [
    'Order Number',
    'Date',
    'Time',
    'Status',
    'Payment Method',
    'Items Sold',
    'Subtotal (RM)',
    'Discount (RM)',
    'Final Paid (RM)',
    'Total Cost (RM)',
    'Gross Profit (RM)',
    'Promotion Applied',
    'Cancellation Reason'
  ];

  const rows = orders.map(order => {
    const d = new Date(order.timestamp || order.date);
    const dateStr = d.toISOString().split('T')[0];
    const timeStr = d.toLocaleTimeString('en-US', { hour12: false });
    const itemsSummary = (order.items || [])
      .map(i => `${i.name} (x${i.quantity || i.qty})`)
      .join('; ');

    return [
      `"${order.order_number}"`,
      `"${dateStr}"`,
      `"${timeStr}"`,
      `"${order.status}"`,
      `"${order.payment_method}"`,
      `"${itemsSummary.replace(/"/g, '""')}"`,
      (order.subtotal || 0).toFixed(2),
      (order.discount || 0).toFixed(2),
      (order.final_amount || 0).toFixed(2),
      (order.total_cost || 0).toFixed(2),
      (order.gross_profit || 0).toFixed(2),
      `"${(order.promotion_snapshot?.name || '').replace(/"/g, '""')}"`,
      `"${(order.cancellation?.reason || '').replace(/"/g, '""')}"`
    ].join(',');
  });

  const csvContent = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  triggerFileDownload(blob, `muki-sales-report-${new Date().toISOString().split('T')[0]}.csv`);
}

/**
 * Export inventory to CSV
 */
function exportInventoryCsv() {
  const headers = [
    'Product Name',
    'Category',
    'Selling Price (RM)',
    'Cost (RM)',
    'Current Stock',
    'Available Assembled (Bundles)',
    'Is Bundle',
    'Status'
  ];

  const rows = store.products.map(prod => {
    const isBundle = store.isBundleProduct(prod.id);
    const available = store.getAvailableStock(prod.id);

    return [
      `"${prod.name.replace(/"/g, '""')}"`,
      `"${prod.category}"`,
      (Number(prod.selling_price) || 0).toFixed(2),
      (Number(prod.cost) || 0).toFixed(2),
      isBundle ? 'N/A (Bundle)' : (Number(prod.stock) || 0),
      isBundle ? available : 'N/A',
      isBundle ? 'Yes' : 'No',
      prod.is_active ? 'Active' : 'Disabled'
    ].join(',');
  });

  const csvContent = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  triggerFileDownload(blob, `muki-inventory-${new Date().toISOString().split('T')[0]}.csv`);
}

function triggerFileDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/**
 * GitHub Gist Cloud Sync Service
 * Allows solo stall owners to sync data between iPad and computer with 1 click.
 * Stores data safely in a private/secret GitHub Gist using the user's existing GitHub account.
 */





const GIST_FILENAME = 'muki-stall-data.json';
const GIST_DESCRIPTION = 'Muki Stall Manager — Business Data Cloud Backup (Private)';

/**
 * Retrieve saved GitHub credentials from settings
 */
async function getGitHubConfig() {
  const settings = await db.getAll('settings');
  const tokenSetting = settings.find(s => s.key === 'github_token');
  const gistIdSetting = settings.find(s => s.key === 'github_gist_id');
  const lastUploadSetting = settings.find(s => s.key === 'github_last_upload');
  const lastPullSetting = settings.find(s => s.key === 'github_last_pull');

  return {
    token: tokenSetting ? tokenSetting.value : '',
    gistId: gistIdSetting ? gistIdSetting.value : '',
    lastUpload: lastUploadSetting ? lastUploadSetting.value : null,
    lastPull: lastPullSetting ? lastPullSetting.value : null
  };
}

/**
 * Save GitHub Token
 */
async function saveGitHubToken(token) {
  const cleaned = (token || '').trim();
  await db.putItem('settings', { key: 'github_token', value: cleaned });
  await store.refreshAll();
  return cleaned;
}

/**
 * Test GitHub token connection
 */
async function testGitHubToken(token) {
  if (!token) throw new Error('Please enter your GitHub Token.');

  const res = await fetch('https://api.github.com/user', {
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json'
    }
  });

  if (!res.ok) {
    if (res.status === 401) throw new Error('Invalid or expired GitHub Token. Please verify you copied it completely.');
    throw new Error(`GitHub connection failed: HTTP ${res.status}`);
  }

  const user = await res.json();
  return user.login; // e.g. "yuxuan705"
}

/**
 * Upload current stall data to GitHub Secret Gist
 */
async function uploadToGitHub() {
  const config = await getGitHubConfig();
  if (!config.token) {
    throw new Error('GitHub Token is not configured. Please save a token first.');
  }

  // 1. Prepare current full database backup
  const backup = await createBackupData();
  const backupJsonString = JSON.stringify(backup, null, 2);

  let gistId = config.gistId;

  // 2. If no gistId stored, check if a Muki gist already exists under user's account
  if (!gistId) {
    try {
      const gistsRes = await fetch('https://api.github.com/gists?per_page=50', {
        headers: {
          'Authorization': `Bearer ${config.token}`,
          'Accept': 'application/vnd.github+json'
        }
      });

      if (gistsRes.ok) {
        const gists = await gistsRes.json();
        const existing = gists.find(g => g.files && g.files[GIST_FILENAME]);
        if (existing) {
          gistId = existing.id;
          await db.putItem('settings', { key: 'github_gist_id', value: gistId });
        }
      }
    } catch (e) {
      console.warn('Gist lookup warning:', e);
    }
  }

  // 3. Create new secret Gist or Update existing Gist
  let response;
  if (!gistId) {
    // Create new Secret Gist
    response = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${config.token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        description: GIST_DESCRIPTION,
        public: false, // Secret Gist, completely private
        files: {
          [GIST_FILENAME]: {
            content: backupJsonString
          }
        }
      })
    });
  } else {
    // Update existing Gist
    response = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: 'PATCH',
      headers: {
        'Authorization': `Bearer ${config.token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        description: GIST_DESCRIPTION,
        files: {
          [GIST_FILENAME]: {
            content: backupJsonString
          }
        }
      })
    });
  }

  if (!response.ok) {
    const errorBody = await response.json().catch(() => ({}));
    throw new Error(errorBody.message || `Upload failed: HTTP ${response.status}`);
  }

  const resultGist = await response.json();
  const now = new Date().toISOString();

  // Save gist ID and last upload timestamp
  await db.putItem('settings', { key: 'github_gist_id', value: resultGist.id });
  await db.putItem('settings', { key: 'github_last_upload', value: now });
  await store.refreshAll();

  return {
    gistId: resultGist.id,
    timestamp: now,
    summary: backup.meta.summary
  };
}

/**
 * Pull latest data from GitHub Secret Gist and restore
 */
async function pullFromGitHub() {
  const config = await getGitHubConfig();
  if (!config.token) {
    throw new Error('GitHub Token is not configured. Please save a token first.');
  }

  let gistId = config.gistId;

  // If no gistId, find it on GitHub
  if (!gistId) {
    const gistsRes = await fetch('https://api.github.com/gists?per_page=50', {
      headers: {
        'Authorization': `Bearer ${config.token}`,
        'Accept': 'application/vnd.github+json'
      }
    });

    if (!gistsRes.ok) {
      throw new Error(`Failed to retrieve data from GitHub: HTTP ${gistsRes.status}`);
    }

    const gists = await gistsRes.json();
    const existing = gists.find(g => g.files && g.files[GIST_FILENAME]);
    if (!existing) {
      throw new Error('No muki-stall-data.json backup found on GitHub yet. Please click "Upload to GitHub" on your stall device first.');
    }

    gistId = existing.id;
    await db.putItem('settings', { key: 'github_gist_id', value: gistId });
  }

  // Fetch Gist details
  const response = await fetch(`https://api.github.com/gists/${gistId}`, {
    headers: {
      'Authorization': `Bearer ${config.token}`,
      'Accept': 'application/vnd.github+json'
    }
  });

  if (!response.ok) {
    throw new Error(`Failed to pull from GitHub: HTTP ${response.status}`);
  }

  const gistData = await response.json();
  const fileEntry = gistData.files && gistData.files[GIST_FILENAME];
  if (!fileEntry || !fileEntry.content) {
    throw new Error('GitHub backup file is empty or removed.');
  }

  // Parse and validate content
  let parsed;
  try {
    parsed = JSON.parse(fileEntry.content);
  } catch (err) {
    throw new Error('GitHub backup file is corrupted and cannot be parsed as JSON.');
  }

  const validated = validateBackupFile(parsed);

  // Restore data
  await restoreFromBackup(parsed, 'replace');

  const now = new Date().toISOString();
  await db.putItem('settings', { key: 'github_last_pull', value: now });
  await store.refreshAll();

  return {
    timestamp: now,
    meta: parsed.meta || {},
    counts: validated.counts
  };
}

                        (sKeyAfterCancel === sKeyBeforeCancel + 1) && 
                        secondCancelFailed;
    log('Scenario 7: Cancel Order & Restore Stock Exactly Once', test7Passed, 
      `Restored stock (+1 V1, +1 V2, +1 Key). Second cancellation blocked: ${secondCancelFailed}`);

    // -------------------------------------------------------------
    // Test 8: Check daily revenue, gross profit, and net profit
    // -------------------------------------------------------------
    // Add a test expense
    const testExpense = {
      id: 'exp_test_rental',
      name: 'Stall Table Rental',
      category: 'Stall rental',
      amount: 50.00,
      date: order1.date,
      notes: 'Market organizers',
      timestamp: new Date().toISOString()
    };
    await db.putItem('expenses', testExpense);
    await store.refreshAll();

    const activeOrders = store.orders.filter(o => o.date === order1.date && o.status !== 'cancelled');
    const dayRevenue = activeOrders.reduce((sum, o) => sum + o.final_amount, 0);
    const dayGrossProfit = activeOrders.reduce((sum, o) => sum + o.gross_profit, 0);
    const dayExpenses = (await db.getAll('expenses')).filter(e => e.date === order1.date).reduce((sum, e) => sum + e.amount, 0);
    const dayNetProfit = round(dayGrossProfit - dayExpenses);

    const test8Passed = dayNetProfit === round(dayGrossProfit - 50.00);
    log('Scenario 8: Daily Revenue, Gross Profit, and Net Profit', test8Passed, 
      `Revenue: RM${dayRevenue.toFixed(2)}, Gross: RM${dayGrossProfit.toFixed(2)}, Expenses: RM${dayExpenses.toFixed(2)}, Net: RM${dayNetProfit.toFixed(2)}`);

    // Clean up test expense
    await db.deleteItem('expenses', 'exp_test_rental');

    // -------------------------------------------------------------
    // Test 9: Export a backup and restore it successfully
    // -------------------------------------------------------------
    const backupObj = await createBackupData();
    const validated = validateBackupFile(backupObj);
    const test9ValidationPassed = validated.valid && validated.counts.products > 0;

    // Restore test
    await restoreFromBackup(backupObj, 'replace');
    const postRestoreProducts = await db.getAll('products');
    const test9Passed = test9ValidationPassed && (postRestoreProducts.length === backupObj.data.products.length);
    log('Scenario 9: Export Backup & Validate/Restore', test9Passed, 
      `Backup contains ${validated.counts.products} products, ${validated.counts.orders} orders. Restored cleanly.`);

    // -------------------------------------------------------------
    // Test 10: Refresh the browser / store and verify existing data remains
    // -------------------------------------------------------------
    await store.refreshAll();
    const test10Passed = store.products.length > 0 && store.orders.length > 0;
    log('Scenario 10: Data Persistence Check', test10Passed, 
      `Store refreshed from IndexedDB. Products: ${store.products.length}, Orders: ${store.orders.length}`);

    console.log('--- All 10 Scenarios Completed ---');
    return results;
  } catch (error) {
    console.error('Test suite error:', error);
    log('Test Execution Error', false, error.message);
    return results;
  }
}

/**
 * Point of Sale (POS) Component
 * Touch-optimized stall checkout with dynamic categories, editable prices, custom discount input,
 * expanded payment methods (Cash, DuitNow QR, TnG, Other with description), and brand theme.
 */






let activeCategoryFilter = 'All';
let searchQuery = '';
let selectedPromotionId = '';
let selectedPaymentMethod = 'Cash';
let otherPaymentNote = '';

function getPosState() {
  return {
    category: activeCategoryFilter,
    search: searchQuery,
    promoId: selectedPromotionId,
    paymentMethod: selectedPaymentMethod,
    otherNote: otherPaymentNote
  };
}

function setPosCategory(cat) {
  activeCategoryFilter = cat;
}

function setPosSearch(q) {
  searchQuery = (q || '').toLowerCase();
}

function setPosPromotion(promoId) {
  selectedPromotionId = promoId;
}

function setPosPaymentMethod(method) {
  selectedPaymentMethod = method;
  if (method !== 'Other') {
    otherPaymentNote = '';
  }
}

function setPosOtherNote(note) {
  otherPaymentNote = (note || '').trim();
}

function renderPos() {
  const dynamicCategories = store.getCategories();
  const categories = ['All', ...dynamicCategories];

  // Filter products: active products only
  let filteredProducts = store.products.filter(p => p.is_active !== false);

  if (activeCategoryFilter !== 'All') {
    if (activeCategoryFilter === 'Bundles') {
      filteredProducts = filteredProducts.filter(p => p.category === 'Bundle' || p.category === 'Bundles' || store.isBundleProduct(p.id));
    } else {
      filteredProducts = filteredProducts.filter(p => p.category === activeCategoryFilter);
    }
  }

  if (searchQuery.trim()) {
    filteredProducts = filteredProducts.filter(p => 
      p.name.toLowerCase().includes(searchQuery) || 
      (p.category && p.category.toLowerCase().includes(searchQuery))
    );
  }

  // Calculate cart totals
  let cartSubtotal = 0;
  store.cart.forEach(item => {
    cartSubtotal += round(item.unitPrice * item.quantity);
  });
  cartSubtotal = round(cartSubtotal);

  // Active promotions
  const activePromos = store.promotions.filter(p => isPromotionValid(p));
  const currentPromo = activePromos.find(p => p.id === selectedPromotionId) || null;

  // Calculate promo discount + manual discount
  let promoDiscount = 0;
  if (currentPromo) {
    promoDiscount = calculatePromotionDiscount(currentPromo, store.cart, cartSubtotal);
  }
  const manualDiscount = store.getManualDiscount();
  const totalDiscount = round(promoDiscount + manualDiscount);
  const finalTotal = round(Math.max(0, cartSubtotal - totalDiscount));

  return `

        <!-- Checkout Summary & Action Footer -->

              <label class="form-label" style="font-size:0.72rem;margin-bottom:0;display:flex;align-items:center;gap:4px;">
                ${renderIcon('tag', 13)}
                <span>Order Discount (Less RM)</span>
              </label>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-family:var(--font-mono);font-weight:700;color:var(--color-brown);font-size:0.85rem;">Less RM</span>
              <input type="number" step="0.50" id="pos-manual-discount-input" class="form-input number-input"

              ${store.getManualDiscount() > 0 ? `
                <button type="button" class="btn btn-sm btn-secondary" id="pos-clear-manual-discount-btn" style="padding:2px 8px;font-size:0.75rem;height:30px;">

                </button>

          <!-- Numbers Breakdown -->
          <div style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;color:var(--text-muted);">
              <span>Subtotal</span>
              <span class="num">${formatRM(cartSubtotal)}</span>
            </div>
            ${promoDiscount > 0 ? `
              <div style="display:flex;justify-content:space-between;color:var(--color-success);font-weight:600;">
                <span>Promotion (${currentPromo.name})</span>
                <span class="num">- ${formatRM(promoDiscount)}</span>
              </div>
            ` : ''}
            ${manualDiscount > 0 ? `
              <div style="display:flex;justify-content:space-between;color:var(--color-orange);font-weight:700;">
                <span>Order Discount</span>
                <span class="num">- ${formatRM(manualDiscount)}</span>
              </div>
            ` : ''}
            <div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:6px;border-top:1px dashed var(--border-light);">
              <span style="font-weight:700;font-size:1rem;color:var(--color-brown-dark);">Total Payable</span>
              <span class="num" style="font-size:1.45rem;font-weight:800;color:var(--color-brown);">
                ${formatRM(finalTotal)}
              </span>
            </div>
          </div>

          <!-- Payment Method Selector: Cash, DuitNow QR, TnG, Other -->
          <div style="margin-bottom:12px;">
            <label class="form-label" style="font-size:0.72rem;margin-bottom:4px;">Payment Method</label>
            <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;">
              ${['Cash', 'DuitNow QR', 'TnG', 'Other'].map(pm => `
                <button type="button" 
                  class="btn btn-sm ${selectedPaymentMethod === pm ? 'btn-primary' : 'btn-secondary'}"
                  data-action="pos-payment-method"
                  data-method="${pm}"
                  style="font-size:0.8rem;font-weight:700;padding:6px 2px;white-space:nowrap;">
                  ${pm === 'DuitNow QR' ? 'DuitNow' : pm}
                </button>
              `).join('')}
            </div>

            <!-- Optional Description for "Other" payment method -->
            ${selectedPaymentMethod === 'Other' ? `
              <div style="margin-top:8px;">
                <input type="text" 
                  id="pos-other-payment-input" 
                  class="form-input" 
                  placeholder="Payment note (e.g. Bank transfer, GrabPay...)" 
                  value="${otherPaymentNote}" 
                  style="font-size:0.82rem;padding:5px 8px;background:#fff;border-color:var(--color-orange);">
              </div>
            ` : ''}
          </div>

          <!-- Checkout Button -->
          <button type="button" 
            id="pos-confirm-btn"
            class="btn btn-primary btn-lg" 
            data-action="pos-complete-sale" 
            style="width:100%;font-size:1.02rem;"
            ${store.cart.length === 0 ? 'disabled' : ''}>
            ${renderIcon('check', 18)}
            <span>Charge ${formatRM(finalTotal)} (${selectedPaymentMethod === 'Other' && otherPaymentNote ? `Other: ${otherPaymentNote}` : selectedPaymentMethod})</span>
          </button>
        </div>
      </div>
    </div>
  `;
}
