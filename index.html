<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muki POS">
  
  <title>Muki Stall Manager — Sales & Inventory POS</title>
  
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Thermal & standard receipt print styles */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-receipt, #printable-receipt * {
        visibility: visible;
      }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 80mm;
        margin: 0;
        padding: 10px;
        background: #fff;
        border: none;
      }
      .modal-header, .modal-footer, .sidebar, .top-header, .bottom-nav {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Root App Mount Point -->
  <div id="app">
    <!-- Initial Loading State -->
    <div style="display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#111827;padding:20px;text-align:center;">
      <div style="font-weight:800;font-size:1.6rem;letter-spacing:-0.03em;">MUKI STALL MANAGER</div>
      <div style="font-size:0.9rem;color:#6B7280;">Loading database & local inventory...</div>
      
      <div id="file-protocol-warning" style="display:none;margin-top:20px;max-width:440px;background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:14px;color:#92400E;font-size:0.85rem;line-height:1.5;">
        <strong>Notice:</strong> When opening via <code>file://</code>, modern browsers restrict JavaScript module imports. 
        Please double-click <strong><code>run.command</code></strong> in Finder to open the application with the local server!
      </div>
    </div>
  </div>

  <script>
    if (window.location.protocol === 'file:') {
      setTimeout(function() {
        var warn = document.getElementById('file-protocol-warning');
        if (warn && document.querySelector('.sidebar') === null) {
          warn.style.display = 'block';
        }
      }, 1500);
    }
  </script>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
