          <div class="modal-title" style="display:flex;align-items:center;gap:6px;">
            ${renderIcon('tag', 18)}
            <span>Manage Product Categories</span>
          </div>
          <button type="button" class="btn btn-sm btn-secondary" id="modal-close-btn">${renderIcon('x', 16)}</button>
        </div>
        <div class="modal-body">
          <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px;">
            Drag the ⠿ handles to rearrange category display order. Click × to delete.
          </p>

          <!-- Draggable Categories List -->
          <div id="category-reorder-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:20px;max-height:280px;overflow-y:auto;padding-right:4px;">
            ${categories.map((cat, idx) => `
              <div class="draggable-cat-item" draggable="true" data-cat="${cat}" style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);border:1px solid var(--border-light);padding:8px 12px;border-radius:var(--radius-sm);cursor:grab;transition:all 0.15s ease;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <span class="cat-drag-handle" style="color:var(--text-muted);cursor:grab;touch-action:none;user-select:none;font-weight:700;font-size:1.1rem;line-height:1;">⠿</span>
                  <span style="font-size:0.85rem;color:var(--text-muted);width:20px;">${idx + 1}.</span>
                  <span style="font-size:0.92rem;font-weight:700;color:var(--color-brown);">${cat}</span>
                </div>
                <button type="button" class="btn-delete-cat" data-category="${cat}" title="Delete Category" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.85rem;line-height:1;padding:4px 6px;display:flex;align-items:center;">
                  ${renderIcon('x', 14)}
                </button>
              </div>
            `).join('')}
          </div>

          <!-- Add New Category -->
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Add New Category</label>
            <div style="display:flex;gap:8px;">
              <input type="text" id="new-category-input" class="form-input" placeholder="Enter category name (e.g. Keychains, Prints)">
              <button type="button" class="btn btn-primary" id="btn-add-category" style="white-space:nowrap;">
                ${renderIcon('plus', 14)}
                <span>Add Category</span>
              </button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="modal-close-footer-btn">Done</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  document.getElementById('modal-close-footer-btn').addEventListener('click', closeModal);

  // Drag and drop category controller
  setupCategoryDragController('#category-reorder-list', '.draggable-cat-item', '.cat-drag-handle', async (newCats) => {
    await store.reorderCategories(newCats);
    showToast('Product category order updated', 'success');
    openManageCategoriesModal();
  });

  // Add category
  const addBtn = document.getElementById('btn-add-category');
  const input = document.getElementById('new-category-input');
  if (addBtn && input) {
    const handleAdd = async () => {
      const val = input.value.trim();
      if (!val) return;
      await store.addCategory(val);
      showToast(`Category "${val}" added`, 'success');
      openManageCategoriesModal();
    };
    addBtn.addEventListener('click', handleAdd);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAdd();
    });
  }

  // Delete category
  container.querySelectorAll('.btn-delete-cat').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cat = btn.getAttribute('data-category');
      if (confirm(`Are you sure you want to delete category "${cat}"?`)) {
        await store.deleteCategory(cat);
        showToast(`Category "${cat}" deleted`, 'success');
        openManageCategoriesModal();
      }
    });
  });
}

// 5. Add / Edit Product Modal
function openProductModal(prod = null) {
  const container = document.getElementById('modal-container');
  if (!container) return;

  const isEdit = !!prod;
  const categories = store.getCategories();

  // Working state for tiers and cost breakdown
  let pricingTiers = Array.isArray(prod?.pricing_tiers) && prod.pricing_tiers.length > 0
    ? JSON.parse(JSON.stringify(prod.pricing_tiers))
    : [];

  let breakdown = Array.isArray(prod?.cost_breakdown) && prod.cost_breakdown.length > 0
    ? JSON.parse(JSON.stringify(prod.cost_breakdown))
    : [];

  const defaultDate = prod?.date || new Date().toISOString().split('T')[0];

  function renderProductModal() {
    container.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-card" style="max-width:680px;width:95%;max-height:88vh;display:flex;flex-direction:column;">
          <div class="modal-header">
            <div class="modal-title">${isEdit ? 'Edit Product' : 'Add New Product'}</div>
            <button type="button" class="btn btn-sm btn-secondary" id="modal-close-btn">${renderIcon('x', 16)}</button>
          </div>
          <div class="modal-body" style="overflow-y:auto;max-height:calc(88vh - 120px);padding:16px;">
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Date Added / Restock Date</label>
                <input type="date" id="prod-date-input" class="form-input" value="${defaultDate}">
              </div>
              <div class="form-group">
                <label class="form-label">Category</label>
                <select id="prod-cat-select" class="form-select">
                  ${categories.map(c => `
                    <option value="${c}" ${prod?.category === c ? 'selected' : ''}>${c}</option>
                  `).join('')}
                </select>
              </div>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Product Name</label>
                <input type="text" id="prod-name-input" class="form-input" value="${prod?.name || ''}" placeholder="e.g. Clicker / Sticker / Keychain">
              </div>
              <div class="form-group">
                <label class="form-label">Product Status</label>
                <select id="prod-status-select" class="form-select">
                  <option value="true" ${prod?.is_active !== false ? 'selected' : ''}>Active (Available in POS)</option>
                  <option value="false" ${prod?.is_active === false ? 'selected' : ''}>Disabled (Hidden from POS)</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Is Bundle Set?</label>
              <select id="prod-bundle-select" class="form-select">
                <option value="false" ${!prod?.is_bundle ? 'selected' : ''}>Single Physical Item</option>
                <option value="true" ${prod?.is_bundle ? 'selected' : ''}>Bundle (Uses Recipe)</option>
              </select>
            </div>

            <!-- Selling Price & Tiered Volume Pricing -->
            <div style="background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px;margin-bottom:14px;">
              <div class="form-group" style="margin-bottom:10px;">
                <label class="form-label" style="font-weight:700;color:var(--color-brown);">Base Selling Price (RM)</label>
                <input type="number" step="0.05" id="prod-price-input" class="form-input number-input" value="${prod ? prod.selling_price : 0}" style="max-width:200px;font-size:1.05rem;font-weight:700;">
              </div>

              <!-- Tiered Pricing Header -->
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-light);">
                <div>
                  <span style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:var(--color-brown-dark);">
                    Tiered Quantity Pricing (Volume Discounts / Optional)
                  </span>
                  <div style="font-size:0.72rem;color:var(--text-muted);margin-top:2px;">
                    e.g. Buy 2+ pcs @ RM 17.50/ea (Clicker), or 3+ pcs @ RM 6.00/ea (Stickers). Auto-applies in POS.
                  </div>
                </div>
                <button type="button" class="btn btn-sm btn-secondary" id="btn-add-pricing-tier" style="font-size:0.75rem;padding:3px 10px;background:#ffffff;">
                  ${renderIcon('plus', 12)}
                  <span>+ Add Tier</span>
                </button>
              </div>

              <div id="pricing-tiers-list" style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
                ${pricingTiers.length === 0 ? `
                  <div id="no-tiers-placeholder" style="font-size:0.75rem;color:var(--text-muted);font-style:italic;padding:4px 0;">
                    No tiered discounts set. Item will sell at base price for any quantity.
                  </div>
                ` : pricingTiers.map((tier, idx) => `
                  <div class="tier-row" data-idx="${idx}" style="display:grid;grid-template-columns:1.2fr 1.5fr auto;gap:8px;align-items:center;background:#ffffff;padding:8px;border:1px solid var(--border-light);border-radius:var(--radius-sm);">
                    <div>
                      <label style="font-size:0.68rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:2px;">Min Quantity (pcs)</label>
                      <input type="number" min="2" step="1" class="form-input tier-min-qty" value="${tier.min_qty ?? 2}" placeholder="e.g. 2" style="padding:3px 6px;font-size:0.85rem;height:28px;">
                    </div>
                    <div>
                      <label style="font-size:0.68rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:2px;">Discount Unit Price (RM)</label>
                      <input type="number" step="0.05" class="form-input tier-price" value="${tier.unit_price ?? 0}" placeholder="e.g. 17.50" style="padding:3px 6px;font-size:0.85rem;height:28px;">
                    </div>
                    <div>
                      <label style="font-size:0.68rem;visibility:hidden;display:block;margin-bottom:2px;">Del</label>
                      <button type="button" class="btn btn-sm btn-secondary btn-del-tier" data-idx="${idx}" style="padding:4px 6px;color:var(--text-muted);height:28px;" title="Delete Tier">
                        ${renderIcon('trash', 14)}
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Cost Breakdown & Bulk Calculator (Directly embedded) -->
            <div style="background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px;margin-bottom:14px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <div>
                  <span style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:var(--color-brown);">
                    Cost Breakdown &amp; Bulk Calculator (Optional)
                  </span>
                  <div style="font-size:0.72rem;color:var(--text-muted);margin-top:2px;">
                    Enter bulk batch quantity (e.g. 100/1000 pcs) + packaging components to auto-compute unit cost.
                  </div>
                </div>
                <button type="button" class="btn btn-sm btn-secondary" id="btn-modal-add-component" style="font-size:0.75rem;padding:3px 10px;background:#ffffff;">
                  ${renderIcon('plus', 12)}
                  <span>+ Add Component</span>
                </button>
              </div>

              <div id="modal-cost-components-list" style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
                ${breakdown.length === 0 ? `
                  <div id="no-components-placeholder" style="font-size:0.75rem;color:var(--text-muted);font-style:italic;padding:4px 0;">
                    No bulk breakdown components yet. Click "+ Add Component" to calculate from batch factory invoice.
                  </div>
                ` : breakdown.map((item, idx) => {
                  const bCost = parseFloat(item.batch_cost) || 0;
                  const bQty = parseFloat(item.batch_qty) || 1;
                  const uCost = bQty > 0 ? (bCost / bQty) : 0;
                  item.unit_cost = uCost;

                  return `
                    <div class="prod-breakdown-row" data-idx="${idx}" style="background:#ffffff;border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:8px;">
                      <div style="display:grid;grid-template-columns:1.8fr 1.1fr 1.1fr 1.1fr auto;gap:8px;align-items:center;">
                        <div>
                          <label style="font-size:0.68rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:2px;">Component Name</label>
                          <input type="text" class="form-input comp-name" value="${item.name || ''}" placeholder="e.g. Acrylic Body / Bag / Card" style="padding:3px 6px;font-size:0.82rem;height:28px;">
                        </div>
                        <div>
                          <label style="font-size:0.68rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:2px;">Total Qty (pcs)</label>
                          <input type="number" step="1" min="1" class="form-input comp-qty" value="${item.batch_qty ?? 1000}" placeholder="e.g. 1000" style="padding:3px 6px;font-size:0.82rem;height:28px;">
                        </div>
                        <div>
                          <label style="font-size:0.68rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:2px;">Total Cost (RM)</label>
                          <input type="number" step="0.10" class="form-input comp-cost" value="${item.batch_cost ?? 0}" placeholder="e.g. 1500" style="padding:3px 6px;font-size:0.82rem;height:28px;">
                        </div>
                        <div style="text-align:right;">
                          <label style="font-size:0.68rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:2px;">Unit Cost</label>
                          <span class="num comp-unit" style="font-weight:800;font-size:0.88rem;color:var(--color-brown);line-height:28px;display:inline-block;">
                            RM ${uCost < 0.1 && (uCost * 100) % 1 !== 0 ? uCost.toFixed(3) : uCost.toFixed(2)}
                          </span>
                        </div>
                        <div>
                          <label style="font-size:0.68rem;visibility:hidden;display:block;margin-bottom:2px;">Del</label>
                          <button type="button" class="btn btn-sm btn-secondary btn-del-comp" data-idx="${idx}" style="padding:4px 6px;color:var(--text-muted);height:28px;" title="Delete Component">
                            ${renderIcon('trash', 14)}
                          </button>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Computed Breakdown Total and Final Unit Cost -->
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border-light);flex-wrap:wrap;gap:8px;">
                <span style="font-size:0.8rem;font-weight:700;color:var(--color-brown-dark);">
                  Computed Component Total: <strong id="modal-breakdown-unit-sum" style="color:var(--color-brown);font-size:1rem;">RM 0.00</strong> / unit
                </span>
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:0.75rem;color:var(--text-muted);font-weight:600;">Final Unit Cost (RM):</span>
                  <input type="number" step="0.01" id="prod-cost-input" class="form-input number-input" value="${prod ? prod.cost : 0}" style="width:110px;font-weight:700;height:30px;padding:2px 8px;">
                  <button type="button" class="btn btn-sm btn-secondary" id="btn-modal-sync-cost" style="font-size:0.72rem;padding:3px 8px;" title="Copy computed breakdown total into Final Unit Cost">
                    Apply Breakdown
                  </button>
                </div>
              </div>
            </div>

            <!-- Stock Group -->
            <div class="grid-2" id="prod-stock-group" style="${prod?.is_bundle ? 'display:none;' : ''}">
              <div class="form-group">
                <label class="form-label">Sellable Stock</label>
                <input type="number" id="prod-stock-input" class="form-input number-input" value="${prod ? (prod.stock ?? 0) : 0}">
              </div>
              <div class="form-group">
                <label class="form-label">Display Sample</label>
                <input type="number" id="prod-display-stock-input" class="form-input number-input" value="${prod ? (prod.display_stock ?? 0) : 0}">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Description / Notes (Optional)</label>
              <textarea id="prod-desc-input" class="form-textarea" rows="2" placeholder="Optional notes or details">${prod?.description || ''}</textarea>
            </div>
          </div>
          <div class="modal-footer" style="display:flex;justify-content:space-between;align-items:center;">
            ${isEdit ? `
              <button type="button" class="btn btn-secondary" style="color:var(--color-danger);" id="modal-prod-delete-btn">
                Delete Product
              </button>
            ` : '<div></div>'}
            <div style="display:flex;gap:8px;">
              <button type="button" class="btn btn-secondary" id="modal-prod-abort-btn">Cancel</button>
              <button type="button" class="btn btn-primary" id="modal-prod-save-btn">
                ${isEdit ? 'Save Changes' : 'Create Product'}
              </button>
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-prod-abort-btn').addEventListener('click', closeModal);

    if (isEdit) {
      document.getElementById('modal-prod-delete-btn')?.addEventListener('click', async () => {
        if (confirm(`Are you sure you want to permanently delete "${prod.name}"? This action cannot be undone.`)) {
          // Remove any recipe connections
          const affectedRecipes = store.recipes.filter(r => r.parent_product_id === prod.id || r.component_product_id === prod.id);
          for (const r of affectedRecipes) {
            await db.deleteItem('recipes', r.id);
          }
          await db.deleteItem('products', prod.id);
          await store.refreshAll();
          showToast(`Product "${prod.name}" permanently deleted.`, 'info');
          closeModal();
          renderApp();
        }
      });
    }

    const bundleSelect = document.getElementById('prod-bundle-select');
    bundleSelect.addEventListener('change', (e) => {
      const stockGrp = document.getElementById('prod-stock-group');
      if (stockGrp) stockGrp.style.display = e.target.value === 'true' ? 'none' : 'block';
    });

    // Helper: recalculate breakdown components in Add Product Modal
    function recalculateModalBreakdown() {
      let total = 0;
      container.querySelectorAll('.prod-breakdown-row').forEach(row => {
        const qtyInput = row.querySelector('.comp-qty');
        const costInput = row.querySelector('.comp-cost');
        const unitDisplay = row.querySelector('.comp-unit');

        const bCost = parseFloat(costInput?.value) || 0;
        const bQty = parseFloat(qtyInput?.value) || 1;
        const uCost = bQty > 0 ? (bCost / bQty) : 0;

        if (unitDisplay) {
          unitDisplay.textContent = `RM ${uCost < 0.1 && (uCost * 100) % 1 !== 0 ? uCost.toFixed(3) : uCost.toFixed(2)}`;
        }
        total += uCost;
      });

      const totalDisplay = document.getElementById('modal-breakdown-unit-sum');
      if (totalDisplay) {
        totalDisplay.textContent = `RM ${total < 0.1 && (total * 100) % 1 !== 0 ? total.toFixed(3) : total.toFixed(2)}`;
      }
      return total;
    }

    function saveBreakdownInputs() {
      container.querySelectorAll('.prod-breakdown-row').forEach(row => {
        const idx = parseInt(row.getAttribute('data-idx'), 10);
        if (breakdown[idx]) {
          breakdown[idx].name = row.querySelector('.comp-name')?.value || '';
          breakdown[idx].batch_qty = parseFloat(row.querySelector('.comp-qty')?.value) || 1;
          breakdown[idx].batch_cost = parseFloat(row.querySelector('.comp-cost')?.value) || 0;
          breakdown[idx].unit_cost = breakdown[idx].batch_qty > 0 ? (breakdown[idx].batch_cost / breakdown[idx].batch_qty) : 0;
        }
      });
    }

    function saveTierInputs() {
      container.querySelectorAll('.tier-row').forEach(row => {
        const idx = parseInt(row.getAttribute('data-idx'), 10);
        if (pricingTiers[idx]) {
          pricingTiers[idx].min_qty = parseInt(row.querySelector('.tier-min-qty')?.value, 10) || 2;
          pricingTiers[idx].unit_price = parseFloat(row.querySelector('.tier-price')?.value) || 0;
        }
      });
    }

    // Breakdown input live listeners
    container.querySelectorAll('.comp-qty, .comp-cost').forEach(input => {
      input.addEventListener('input', () => {
        const total = recalculateModalBreakdown();
        const costInput = document.getElementById('prod-cost-input');
        if (costInput && (parseFloat(costInput.value) === 0 || costInput.getAttribute('data-auto-synced') === 'true')) {
          costInput.value = total.toFixed(2);
          costInput.setAttribute('data-auto-synced', 'true');
        }
      });
    });

    // Sync button
    document.getElementById('btn-modal-sync-cost')?.addEventListener('click', () => {
      const total = recalculateModalBreakdown();
      const costInput = document.getElementById('prod-cost-input');
      if (costInput) {
        costInput.value = total.toFixed(2);
        costInput.setAttribute('data-auto-synced', 'true');
        showToast(`Calculated cost RM ${total.toFixed(2)} applied!`, 'success');
      }
    });

    // Add Component button
    document.getElementById('btn-modal-add-component')?.addEventListener('click', () => {
      saveBreakdownInputs();
      saveTierInputs();
      breakdown.push({ name: '', batch_qty: 1000, batch_cost: 0, unit_cost: 0 });
      renderProductModal();
    });

    // Delete Component button
    container.querySelectorAll('.btn-del-comp').forEach(btn => {
      btn.addEventListener('click', () => {
        saveBreakdownInputs();
        saveTierInputs();
        const idx = parseInt(btn.getAttribute('data-idx'), 10);
        breakdown.splice(idx, 1);
        renderProductModal();
      });
    });

    // Add Pricing Tier button
    document.getElementById('btn-add-pricing-tier')?.addEventListener('click', () => {
      saveBreakdownInputs();
      saveTierInputs();
      pricingTiers.push({ min_qty: 2, unit_price: 0 });
      renderProductModal();
    });

    // Delete Pricing Tier button
    container.querySelectorAll('.btn-del-tier').forEach(btn => {
      btn.addEventListener('click', () => {
        saveBreakdownInputs();
        saveTierInputs();
        const idx = parseInt(btn.getAttribute('data-idx'), 10);
        pricingTiers.splice(idx, 1);
        renderProductModal();
      });
    });

    // Save Product
    document.getElementById('modal-prod-save-btn').addEventListener('click', async () => {
      const name = document.getElementById('prod-name-input').value.trim();
      if (!name) {
        alert('Product name is required');
        return;
      }

      saveBreakdownInputs();
      saveTierInputs();

      const prodDate = document.getElementById('prod-date-input').value || defaultDate;
      const category = document.getElementById('prod-cat-select').value;
      const isBundle = document.getElementById('prod-bundle-select').value === 'true';
      const sellingPrice = round(parseFloat(document.getElementById('prod-price-input').value) || 0);
      const cost = round(parseFloat(document.getElementById('prod-cost-input').value) || 0);
      const stock = isBundle ? 0 : parseInt(document.getElementById('prod-stock-input').value, 10) || 0;
      const displayStock = isBundle ? 0 : Math.max(0, parseInt(document.getElementById('prod-display-stock-input')?.value, 10) || 0);
      const desc = document.getElementById('prod-desc-input').value.trim();

      // Clean and sort pricing tiers
      const validTiers = pricingTiers
        .filter(t => (Number(t.min_qty) || 0) > 1 && (Number(t.unit_price) || 0) > 0)
        .sort((a, b) => Number(b.min_qty) - Number(a.min_qty));

      // Clean cost breakdown
      const validBreakdown = breakdown.filter(b => (b.name && b.name.trim()) || (Number(b.batch_cost) || 0) > 0);

      const timestamp = new Date().toISOString();
      const productRecord = {
        ...(prod || {}),
        id: prod ? prod.id : generateId('prod'),
        name,
        date: prodDate,
        category,
        selling_price: sellingPrice,
        cost,
        stock,
        sort_order: (prod && typeof prod.sort_order === 'number') ? prod.sort_order : (store.products.length + 1),
        is_bundle: isBundle,
        is_active: document.getElementById('prod-status-select')?.value === 'false' ? false : true,
        description: desc,
        needs_config: false,
        pricing_tiers: validTiers,
        cost_breakdown: validBreakdown,
        cost_notes: prod ? (prod.cost_notes || '') : '',
        display_stock: displayStock,
        created_at: prod ? prod.created_at : timestamp,
        updated_at: timestamp
      };

      await db.putItem('products', productRecord);

      // If new product and has cost or breakdown, log initial cost history entry
      if (!prod && (cost > 0 || validBreakdown.length > 0)) {
        await db.addItem('cost_history', {
          id: generateId('cost'),
          product_id: productRecord.id,
          product_name: productRecord.name,
          previous_cost: 0,
          new_cost: cost,
          selling_price: sellingPrice,
          notes: 'Initial product creation & component breakdown',
          components: validBreakdown,
          date: prodDate,
          timestamp
        });
      } else if (prod && (cost !== Number(prod.cost) || JSON.stringify(validBreakdown) !== JSON.stringify(prod.cost_breakdown || []))) {
        await db.addItem('cost_history', {
          id: generateId('cost'),
          product_id: productRecord.id,
          product_name: productRecord.name,
          previous_cost: Number(prod.cost) || 0,
          new_cost: cost,
          selling_price: sellingPrice,
          notes: desc || 'Product edit: cost and components update',
          components: validBreakdown,
          date: prodDate,
          timestamp
        });
      }

      await store.refreshAll();
      showToast(`Product "${name}" saved!`, 'success');
      closeModal();
    });

    // Initial recalculation on render
    recalculateModalBreakdown();
  }

  renderProductModal();
}

    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-cost-close-btn').addEventListener('click', closeModal);

    // Recalculate new batch breakdown
    function recalcNewBatchBreakdown() {
      let total = 0;
      container.querySelectorAll('.batch-comp-row').forEach(row => {
        const qty = parseFloat(row.querySelector('.bcomp-qty')?.value) || 1;
        const cost = parseFloat(row.querySelector('.bcomp-cost')?.value) || 0;
        const uCost = qty > 0 ? (cost / qty) : 0;
        const unitDisp = row.querySelector('.bcomp-unit');
        if (unitDisp) {
          unitDisp.textContent = `RM ${uCost < 0.1 && (uCost * 100) % 1 !== 0 ? uCost.toFixed(3) : uCost.toFixed(2)}`;
        }
        total += uCost;
      });

      const disp = document.getElementById('new-batch-calc-unit');
      if (disp) {
        disp.textContent = `RM ${total < 0.1 && (total * 100) % 1 !== 0 ? total.toFixed(3) : total.toFixed(2)}`;
      }
      return total;
    }

    // Save inputs of breakdown
    function saveNewBatchBreakdown() {
      container.querySelectorAll('.batch-comp-row').forEach(row => {
        const idx = parseInt(row.getAttribute('data-idx'), 10);
        if (newBatchBreakdown[idx]) {
          newBatchBreakdown[idx].name = row.querySelector('.bcomp-name')?.value || '';
          newBatchBreakdown[idx].batch_qty = parseFloat(row.querySelector('.bcomp-qty')?.value) || 1;
          newBatchBreakdown[idx].batch_cost = parseFloat(row.querySelector('.bcomp-cost')?.value) || 0;
          newBatchBreakdown[idx].unit_cost = newBatchBreakdown[idx].batch_qty > 0 ? (newBatchBreakdown[idx].batch_cost / newBatchBreakdown[idx].batch_qty) : 0;
        }
      });
    }

    container.querySelectorAll('.bcomp-qty, .bcomp-cost').forEach(input => {
      input.addEventListener('input', () => {

      renderModalContent();
    });

    // Delete component button
    container.querySelectorAll('.btn-del-bcomp').forEach(btn => {
      btn.addEventListener('click', () => {
        saveNewBatchBreakdown();
        const idx = parseInt(btn.getAttribute('data-idx'), 10);

    // Inline edit batch listeners

        renderModalContent();

    container.querySelectorAll('.btn-cancel-edit-batch').forEach(btn => {
      btn.addEventListener('click', () => {
        editingBatchId = null;
        renderModalContent();
      });
    });

    // Save edited batch
    container.querySelectorAll('.btn-save-batch-edit').forEach(btn => {
      btn.addEventListener('click', async () => {
        const batchId = btn.getAttribute('data-batch-id');
        const card = container.querySelector(`.fifo-batch-card[data-batch-id="${batchId}"]`);
        if (!card) return;

        const newDate = card.querySelector('.edit-batch-date')?.value || today;
        const newUnitCost = round(parseFloat(card.querySelector('.edit-batch-cost')?.value) || 0);
        const newRem = parseInt(card.querySelector('.edit-batch-rem')?.value, 10) || 0;
        const newInit = parseInt(card.querySelector('.edit-batch-init')?.value, 10) || newRem;
        const newNotes = card.querySelector('.edit-batch-notes')?.value || '';

        const targetBatch = batches.find(b => b.id === batchId);
        if (targetBatch) {
          targetBatch.date = newDate;
          targetBatch.unit_cost = newUnitCost;
          targetBatch.remaining_qty = newRem;
          targetBatch.initial_qty = newInit;
          targetBatch.notes = newNotes;
        }

        editingBatchId = null;

        // Persist to product
        const product = await db.getById('products', prod.id);
        if (product) {
          product.cost_batches = batches;
          // Recalculate total physical stock and active cost
          product.stock = batches.reduce((sum, b) => sum + Math.max(0, Number(b.remaining_qty) || 0), 0);
          const firstActive = batches.find(b => (Number(b.remaining_qty) || 0) > 0);
          if (firstActive) {
            product.cost = Number(firstActive.unit_cost) || 0;
          }
          await db.putItem('products', product);
          await store.refreshAll();
          showToast('Batch updated successfully!', 'success');
        }

        renderModalContent();
      });
    });

    // Delete batch
    container.querySelectorAll('.btn-del-batch').forEach(btn => {
      btn.addEventListener('click', async () => {
        const batchId = btn.getAttribute('data-batch-id');
        if (confirm('Are you sure you want to delete this FIFO batch? Remaining stock for this batch will be removed.')) {
          batches = batches.filter(b => b.id !== batchId);
          if (batches.length === 0) {
            batches = [{
              id: 'batch_init_' + prod.id,
              date: today,
              initial_qty: 0,
              remaining_qty: 0,
              unit_cost: Number(prod.cost) || 0,
              notes: 'Reset empty batch'
            }];
          }

          const product = await db.getById('products', prod.id);
          if (product) {
            product.cost_batches = batches;
            product.stock = batches.reduce((sum, b) => sum + Math.max(0, Number(b.remaining_qty) || 0), 0);
            const firstActive = batches.find(b => (Number(b.remaining_qty) || 0) > 0);
            if (firstActive) {
              product.cost = Number(firstActive.unit_cost) || 0;
            }
            await db.putItem('products', product);
            await store.refreshAll();
            showToast('Batch deleted.', 'info');
          }

          renderModalContent();
        }
      });
    });

    // Add Inward Batch to FIFO Queue button
    document.getElementById('btn-add-inward-batch')?.addEventListener('click', async () => {
      saveNewBatchBreakdown();
      const inDate = document.getElementById('new-batch-date')?.value || today;
      const inQty = parseInt(document.getElementById('new-batch-qty')?.value, 10);
      const inUnitCost = round(parseFloat(document.getElementById('new-batch-unit-cost')?.value) || recalcNewBatchBreakdown());
      const inNotes = document.getElementById('new-batch-notes')?.value.trim() || 'Inward restock batch';

      if (isNaN(inQty) || inQty <= 0) {
        alert('Please enter a valid received quantity greater than 0.');
        return;
      }

      const newBatchId = generateId('batch');
      const newBatch = {
        id: newBatchId,
        date: inDate,
        initial_qty: inQty,
        remaining_qty: inQty,
        unit_cost: inUnitCost,
        cost_breakdown: JSON.parse(JSON.stringify(newBatchBreakdown)),
        notes: inNotes,
        created_at: new Date().toISOString()
      };

      batches.push(newBatch);

      const product = await db.getById('products', prod.id);
      if (product) {
        product.cost_batches = batches;
        // Total stock is sum of all batch remaining quantities
        product.stock = batches.reduce((sum, b) => sum + Math.max(0, Number(b.remaining_qty) || 0), 0);
        
        // Active unit cost is the first batch with remaining_qty > 0
        const firstActive = batches.find(b => (Number(b.remaining_qty) || 0) > 0);
        if (firstActive) {
          product.cost = Number(firstActive.unit_cost) || 0;
        }

        await db.putItem('products', product);

        // Record into cost_history audit trail
        await db.addItem('cost_history', {
          id: generateId('cost'),
          product_id: product.id,
          product_name: product.name,
          previous_cost: Number(prod.cost) || 0,
          new_cost: inUnitCost,
          selling_price: Number(product.selling_price) || 0,
          notes: `Restock batch: ${inQty} pcs @ RM ${inUnitCost.toFixed(2)} (${inNotes})`,
          components: JSON.parse(JSON.stringify(newBatchBreakdown)),
          date: inDate,
          timestamp: new Date().toISOString()
        });

        // Record stock movement inward
        await db.addItem('stock_movements', {
          id: generateId('smov'),
          product_id: product.id,
          product_name: product.name,
          delta: inQty,
          previous_stock: Number(prod.stock) || 0,
          new_stock: product.stock,
          reason: 'purchase_in',
          notes: `Batch inward: ${inQty} pcs @ RM ${inUnitCost.toFixed(2)} (${inNotes})`,
          timestamp: new Date().toISOString()
        });

        await store.refreshAll();
        showToast(`Added ${inQty} pcs batch to FIFO queue!`, 'success');
      }

      renderModalContent();
    });

    // Delete mistaken log entry
    container.querySelectorAll('.btn-del-modal-history').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const logId = btn.getAttribute('data-log-id');
        if (confirm('Are you sure you want to delete this cost history record?')) {
          await db.deleteItem('cost_history', logId);
          await store.refreshAll();
          showToast('Cost history record deleted.', 'info');
          renderModalContent();
        }
      });
    });

    // Initial breakdown calc for new batch
    const initTotal = recalcNewBatchBreakdown();
    const unitInput = document.getElementById('new-batch-unit-cost');
    if (unitInput && !unitInput.value) {
      unitInput.value = initTotal.toFixed(2);
    }
  }

  renderModalContent();
}

    const startDate = document.getElementById('promo-start-input').value;

    await savePromotion({
      id: promo?.id,
      name,
      description: desc,
      type,
      price: type === 'bundle_price' ? val : 0,
      value: (type !== 'bundle_price' && type !== 'spend_threshold_gift') ? val : 0,
      min_spend: minSpend,
      discount_type: discountType,

      start_date: startDate,
      end_date: endDate,
      is_active: promo ? promo.is_active : true,
      bundle_recipe: promo?.bundle_recipe || []

    showToast('Promotion saved!', 'success');
    closeModal();
  });
}

// 13. Drag and Drop Product Reordering Controller (Desktop & Mobile Touch)
function setupDraggableRows() {
  const rows = Array.from(document.querySelectorAll('.draggable-product-row'));
  if (rows.length <= 1) return;

  let draggedId = null;

  // --- Desktop HTML5 Drag & Drop ---
  rows.forEach(row => {
    row.addEventListener('dragstart', (e) => {
      draggedId = row.getAttribute('data-product-id');
      row.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
    });

    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      const rect = row.getBoundingClientRect();
      const isTop = (e.clientY - rect.top) < (rect.height / 2);
      if (isTop) {
        row.classList.add('drag-over-top');
        row.classList.remove('drag-over-bottom');
      } else {
        row.classList.add('drag-over-bottom');
        row.classList.remove('drag-over-top');
      }
    });

    row.addEventListener('dragleave', () => {
      row.classList.remove('drag-over-top', 'drag-over-bottom');
    });

    row.addEventListener('drop', async (e) => {
      e.preventDefault();
      const targetId = row.getAttribute('data-product-id');
      const isTop = row.classList.contains('drag-over-top');
      rows.forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom', 'is-dragging'));

      if (!draggedId || draggedId === targetId) return;

      const currentIds = Array.from(document.querySelectorAll('.draggable-product-row'))
        .map(r => r.getAttribute('data-product-id'));
      
      const fromIdx = currentIds.indexOf(draggedId);
      if (fromIdx < 0) return;
      currentIds.splice(fromIdx, 1);

      let toIdx = currentIds.indexOf(targetId);
      if (!isTop) toIdx += 1;
      currentIds.splice(toIdx, 0, draggedId);

      await store.reorderProducts(currentIds);
      if (typeof setInventorySort === 'function') setInventorySort('custom');
      showToast('Custom order saved', 'success');
      renderApp();
    });

    row.addEventListener('dragend', () => {
      rows.forEach(r => r.classList.remove('is-dragging', 'drag-over-top', 'drag-over-bottom'));
      draggedId = null;
    });
  });

  // --- Mobile Touch Drag & Drop (iOS Safari & Android) ---
  const handles = document.querySelectorAll('.drag-handle');
  let touchDraggedRow = null;
  let touchDraggedId = null;
  let touchIndicator = null;
  let lastTargetRow = null;

  handles.forEach(handle => {
    handle.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      touchDraggedRow = handle.closest('.draggable-product-row');
      if (!touchDraggedRow) return;

      touchDraggedId = touchDraggedRow.getAttribute('data-product-id');
      const prodName = touchDraggedRow.getAttribute('data-product-name') || 'Product';

      touchDraggedRow.classList.add('is-dragging');

      // Create floating touch indicator
      touchIndicator = document.createElement('div');
      touchIndicator.className = 'touch-drag-indicator';
      touchIndicator.textContent = `Moving: ${prodName}`;
      touchIndicator.style.left = `${touch.clientX}px`;
      touchIndicator.style.top = `${touch.clientY}px`;
      document.body.appendChild(touchIndicator);
    }, { passive: false });

    handle.addEventListener('touchmove', (e) => {
      if (!touchDraggedRow) return;
      e.preventDefault(); // Prevent page scrolling during drag

      const touch = e.touches[0];
      if (touchIndicator) {
        touchIndicator.style.left = `${touch.clientX}px`;
        touchIndicator.style.top = `${touch.clientY}px`;
      }

      // Temporarily hide touchIndicator so document.elementFromPoint can hit the underlying row
      touchIndicator.style.display = 'none';
      const elem = document.elementFromPoint(touch.clientX, touch.clientY);
      touchIndicator.style.display = 'flex';

      const targetRow = elem ? elem.closest('.draggable-product-row') : null;

      if (targetRow && targetRow !== touchDraggedRow) {
        if (lastTargetRow && lastTargetRow !== targetRow) {
          lastTargetRow.classList.remove('drag-over-top', 'drag-over-bottom');
        }
        lastTargetRow = targetRow;

        const rect = targetRow.getBoundingClientRect();
        const isTop = (touch.clientY - rect.top) < (rect.height / 2);
        if (isTop) {
          targetRow.classList.add('drag-over-top');
          targetRow.classList.remove('drag-over-bottom');
        } else {
          targetRow.classList.add('drag-over-bottom');
          targetRow.classList.remove('drag-over-top');
        }
      } else if (lastTargetRow) {
        lastTargetRow.classList.remove('drag-over-top', 'drag-over-bottom');
        lastTargetRow = null;
      }
    }, { passive: false });

    handle.addEventListener('touchend', async () => {
      if (!touchDraggedRow) return;

      if (touchIndicator && touchIndicator.parentNode) {
        touchIndicator.parentNode.removeChild(touchIndicator);
        touchIndicator = null;
      }

      touchDraggedRow.classList.remove('is-dragging');

      if (lastTargetRow && lastTargetRow !== touchDraggedRow) {
        const targetId = lastTargetRow.getAttribute('data-product-id');
        const isTop = lastTargetRow.classList.contains('drag-over-top');
        lastTargetRow.classList.remove('drag-over-top', 'drag-over-bottom');

        const currentIds = Array.from(document.querySelectorAll('.draggable-product-row'))
          .map(r => r.getAttribute('data-product-id'));
        
        const fromIdx = currentIds.indexOf(touchDraggedId);
        if (fromIdx >= 0) {
          currentIds.splice(fromIdx, 1);
          let toIdx = currentIds.indexOf(targetId);
          if (!isTop) toIdx += 1;
          currentIds.splice(toIdx, 0, touchDraggedId);

          await store.reorderProducts(currentIds);
          showToast('Product order updated', 'success');
          renderApp();
        }
      }

      touchDraggedRow = null;
      touchDraggedId = null;
      lastTargetRow = null;
    });
  });
}

            <!-- Receipt Items Editor -->
            <div style="margin-bottom:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:var(--color-brown);">Receipt Items</span>
                <button type="button" class="btn btn-sm btn-secondary" id="btn-add-order-item" style="font-size:0.75rem;padding:3px 8px;">
                  ${renderIcon('plus', 12)}
                  <span>Add Product</span>
                </button>
              </div>

              <div id="edit-order-items-list" style="display:flex;flex-direction:column;gap:8px;">
                ${editItems.map((item, idx) => `
                  <div class="order-edit-row" data-idx="${idx}" style="background:#ffffff;border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:8px 10px;">
                    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;align-items:center;">
                      <div>
                        <div style="font-weight:700;font-size:0.85rem;color:var(--color-brown-dark);">${item.name}</div>
                        ${item.isFreeGift ? '<span class="badge badge-accent" style="font-size:0.65rem;">Free Gift</span>' : ''}
                      </div>
                      <div>
                        <label style="font-size:0.68rem;color:var(--text-muted);display:block;">Unit Price</label>
                        <input type="number" step="0.05" class="form-input edit-item-price" value="${item.unitPrice}" style="padding:2px 6px;font-size:0.82rem;height:28px;" ${item.isFreeGift ? 'disabled' : ''}>
                      </div>
                      <div>
                        <label style="font-size:0.68rem;color:var(--text-muted);display:block;">Quantity</label>
                        <input type="number" step="1" min="1" class="form-input edit-item-qty" value="${item.quantity || item.qty || 1}" style="padding:2px 6px;font-size:0.82rem;height:28px;">
                      </div>
                      <div style="text-align:right;">
                        <label style="font-size:0.68rem;color:var(--text-muted);display:block;">Subtotal</label>
                        <span class="num edit-item-subtotal" style="font-weight:700;font-size:0.85rem;color:var(--color-brown);line-height:28px;">
                          ${formatRM(item.subtotal)}
                        </span>
                      </div>
                      <div>
                        <label style="font-size:0.68rem;visibility:hidden;display:block;">Del</label>
                        <button type="button" class="btn btn-sm btn-secondary btn-del-order-item" data-idx="${idx}" style="padding:4px 6px;color:var(--text-muted);height:28px;" ${editItems.length <= 1 ? 'disabled' : ''}>
                          ${renderIcon('trash', 14)}
                        </button>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Add Product Selector Box -->
            <div id="add-product-box" style="display:none;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:10px;margin-bottom:14px;">
              <label class="form-label" style="font-size:0.75rem;">Select Product to Add</label>
              <div style="display:flex;gap:6px;">
                <select id="select-add-product" class="form-select" style="font-size:0.85rem;">
                  ${availableProducts.map(p => `
                    <option value="${p.id}" data-price="${p.selling_price || 0}" data-name="${p.name}">
                      ${p.name} (${formatRM(p.selling_price)})
                    </option>
                  `).join('')}
                </select>
                <button type="button" class="btn btn-primary btn-sm" id="btn-confirm-add-item" style="white-space:nowrap;">
                  Add
                </button>
              </div>
            </div>

            <!-- Payment & Date Adjustments -->
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Payment Method</label>
                <select id="edit-order-payment" class="form-select">
                  ${['Cash', 'DuitNow QR', "Touch 'n Go", 'Credit/Debit Card', 'Online Transfer', 'Other'].map(m => `
                    <option value="${m}" ${paymentMethod === m ? 'selected' : ''}>${m}</option>
                  `).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Date &amp; Time</label>
                <input type="datetime-local" id="edit-order-timestamp" class="form-input" value="${orderTimestamp.slice(0, 16)}">
              </div>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Discount (RM)</label>
                <input type="number" step="0.50" min="0" id="edit-order-discount" class="form-input number-input" value="${discount}">
              </div>
              <div class="form-group">
                <label class="form-label">Payment / Receipt Notes (Optional)</label>
                <textarea id="edit-order-notes" class="form-textarea" rows="2" placeholder="e.g. Paid via TnG eWallet, customer notes...">${paymentNotes}</textarea>
              </div>
            </div>

            <!-- Live Recalculated Summary -->
            <div style="background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px;margin-top:10px;">
              <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:4px;">
                <span style="color:var(--text-muted);">Items Subtotal:</span>
                <span class="num font-bold" id="edit-subtotal-val">${formatRM(subtotal)}</span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;">
                <span style="color:var(--text-muted);">Discount Applied:</span>
                <span class="num" id="edit-discount-val">- ${formatRM(discount)}</span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:1.05rem;font-weight:700;border-top:1px dashed var(--border-light);padding-top:6px;color:var(--color-brown);">
                <span>Final Paid Amount:</span>
                <span class="num" id="edit-final-val">${formatRM(finalAmount)}</span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-top:4px;color:var(--text-muted);">
                <span>Estimated Gross Profit:</span>
                <span class="num" id="edit-profit-val">${formatRM(grossProfit)}</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="modal-abort-edit-btn">Cancel</button>
            <button type="button" class="btn btn-primary" id="modal-save-order-btn">Save Receipt Changes</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-abort-edit-btn').addEventListener('click', closeModal);

    const addBox = document.getElementById('add-product-box');
    document.getElementById('btn-add-order-item').addEventListener('click', () => {
      addBox.style.display = addBox.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('btn-confirm-add-item').addEventListener('click', () => {
      const select = document.getElementById('select-add-product');
      const opt = select.options[select.selectedIndex];
      const pid = select.value;
      const name = opt.getAttribute('data-name');
      const price = parseFloat(opt.getAttribute('data-price')) || 0;

      editItems.push({
        productId: pid,
        name,
        quantity: 1,
        unitPrice: price,
        unitCost: store.getComputedCost(pid),
        subtotal: price,
        itemCostTotal: store.getComputedCost(pid),
        isFreeGift: false
      });
      addBox.style.display = 'none';
      renderEditModal();
    });

    container.querySelectorAll('.btn-del-order-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.getAttribute('data-idx'), 10);
        editItems.splice(idx, 1);
        renderEditModal();
      });
    });

    container.querySelectorAll('.edit-item-price, .edit-item-qty').forEach(inp => {
      inp.addEventListener('input', () => {
        saveRowInputs();
        updateSummary();
      });
    });

    document.getElementById('edit-order-discount').addEventListener('input', (e) => {
      discount = parseFloat(e.target.value) || 0;
      updateSummary();
    });

    function saveRowInputs() {
      container.querySelectorAll('.order-edit-row').forEach(row => {
        const idx = parseInt(row.getAttribute('data-idx'), 10);
        if (editItems[idx]) {
          const p = parseFloat(row.querySelector('.edit-item-price')?.value) || 0;
          const q = parseInt(row.querySelector('.edit-item-qty')?.value, 10) || 1;
          editItems[idx].unitPrice = editItems[idx].isFreeGift ? 0 : p;
          editItems[idx].quantity = q;
          editItems[idx].subtotal = round(editItems[idx].unitPrice * q);
          const stEl = row.querySelector('.edit-item-subtotal');
          if (stEl) stEl.textContent = formatRM(editItems[idx].subtotal);
        }
      });
    }

    function updateSummary() {
      let sub = 0;
      let cost = 0;
      editItems.forEach(it => {
        sub += it.subtotal || 0;
        cost += (it.unitCost || 0) * (it.quantity || 1);
      });
      const fin = round(Math.max(0, sub - discount));
      const prof = round(fin - cost);

      const subEl = document.getElementById('edit-subtotal-val');
      const disEl = document.getElementById('edit-discount-val');
      const finEl = document.getElementById('edit-final-val');
      const profEl = document.getElementById('edit-profit-val');
      if (subEl) subEl.textContent = formatRM(sub);
      if (disEl) disEl.textContent = `- ${formatRM(discount)}`;
      if (finEl) finEl.textContent = formatRM(fin);
      if (profEl) profEl.textContent = formatRM(prof);
    }

    document.getElementById('modal-save-order-btn').addEventListener('click', async () => {
      saveRowInputs();
      const pMethod = document.getElementById('edit-order-payment').value;
      const pNotes = document.getElementById('edit-order-notes').value.trim();
      const dtVal = document.getElementById('edit-order-timestamp').value;
      const finalTimestamp = dtVal ? new Date(dtVal).toISOString() : order.timestamp;

      try {
        await updateOrder(order.id, {
          paymentMethod: pMethod,
          paymentNotes: pNotes,
          timestamp: finalTimestamp,
          discount,
          items: editItems
        });
        showToast(`Receipt ${order.order_number} updated successfully!`, 'success');
        closeModal();
        renderApp();
      } catch (err) {
        alert(`Failed to update receipt: ${err.message}`);
      }
    });
  }

  renderEditModal();
}

// 15. Category Drag & Drop Reorder Helper
function setupCategoryDragController(containerSelector, itemClass, handleClass, saveCallback) {
  const container = document.querySelector(containerSelector);
  if (!container) return;

  const items = Array.from(container.querySelectorAll(itemClass));
  let draggedItem = null;

  items.forEach(item => {
    item.addEventListener('dragstart', (e) => {
      draggedItem = item;
      item.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.getAttribute('data-cat'));
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = item.getBoundingClientRect();
      const isTop = (e.clientY - rect.top) < (rect.height / 2);
      if (isTop) {
        item.classList.add('drag-over-top');
        item.classList.remove('drag-over-bottom');
      } else {
        item.classList.add('drag-over-bottom');
        item.classList.remove('drag-over-top');
      }
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over-top', 'drag-over-bottom');
    });

    item.addEventListener('drop', async (e) => {
      e.preventDefault();
      const targetCat = item.getAttribute('data-cat');
      const draggedCat = draggedItem?.getAttribute('data-cat');
      const isTop = item.classList.contains('drag-over-top');
      items.forEach(i => i.classList.remove('drag-over-top', 'drag-over-bottom', 'is-dragging'));

      if (!draggedCat || draggedCat === targetCat) return;

      const currentCats = Array.from(container.querySelectorAll(itemClass)).map(i => i.getAttribute('data-cat'));
      const fromIdx = currentCats.indexOf(draggedCat);
      if (fromIdx < 0) return;
      currentCats.splice(fromIdx, 1);
      let toIdx = currentCats.indexOf(targetCat);
      if (!isTop) toIdx += 1;
      currentCats.splice(toIdx, 0, draggedCat);

      await saveCallback(currentCats);
    });

    item.addEventListener('dragend', () => {
      items.forEach(i => i.classList.remove('is-dragging', 'drag-over-top', 'drag-over-bottom'));
      draggedItem = null;
    });
  });

  // Touch drag for mobile Safari
  const handles = container.querySelectorAll(handleClass);
  let touchDraggedItem = null;
  let lastTarget = null;

  handles.forEach(handle => {
    handle.addEventListener('touchstart', (e) => {
      touchDraggedItem = handle.closest(itemClass);
      if (!touchDraggedItem) return;
      touchDraggedItem.classList.add('is-dragging');
    }, { passive: true });

    handle.addEventListener('touchmove', (e) => {
      if (!touchDraggedItem) return;
      e.preventDefault();
      const touch = e.touches[0];
      const elem = document.elementFromPoint(touch.clientX, touch.clientY);
      const target = elem ? elem.closest(itemClass) : null;

      if (target && target !== touchDraggedItem) {
        if (lastTarget && lastTarget !== target) {
          lastTarget.classList.remove('drag-over-top', 'drag-over-bottom');
        }
        lastTarget = target;
        const rect = target.getBoundingClientRect();
        const isTop = (touch.clientY - rect.top) < (rect.height / 2);
        if (isTop) {
          target.classList.add('drag-over-top');
          target.classList.remove('drag-over-bottom');
        } else {
          target.classList.add('drag-over-bottom');
          target.classList.remove('drag-over-top');
        }
      } else if (lastTarget) {
        lastTarget.classList.remove('drag-over-top', 'drag-over-bottom');
        lastTarget = null;
      }
    }, { passive: false });

    handle.addEventListener('touchend', async () => {
      if (!touchDraggedItem) return;
      touchDraggedItem.classList.remove('is-dragging');

      if (lastTarget && lastTarget !== touchDraggedItem) {
        const targetCat = lastTarget.getAttribute('data-cat');
        const draggedCat = touchDraggedItem.getAttribute('data-cat');
        const isTop = lastTarget.classList.contains('drag-over-top');
        lastTarget.classList.remove('drag-over-top', 'drag-over-bottom');

        const currentCats = Array.from(container.querySelectorAll(itemClass)).map(i => i.getAttribute('data-cat'));
        const fromIdx = currentCats.indexOf(draggedCat);
        if (fromIdx >= 0) {
          currentCats.splice(fromIdx, 1);
          let toIdx = currentCats.indexOf(targetCat);
          if (!isTop) toIdx += 1;
          currentCats.splice(toIdx, 0, draggedCat);
          await saveCallback(currentCats);
        }
      }

      touchDraggedItem = null;
      lastTarget = null;
    });
  });
}

})();

  </script>
