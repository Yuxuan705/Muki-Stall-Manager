<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Muki POS">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Muki Stall Manager — Sales &amp; Inventory POS</title>

  <!-- PWA Icons -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/png" href="Muki.png">

  <style>
/* =========================================================
   Muki Stall Manager — Brand Theme
   Brand Brown: #936653
   Cream Background: #f8f6f3
   Accents: Orange (#f9a127), Soft Yellow (#f1dd9d)
   ========================================================= */

:root {
  --bg-primary: #f8f6f3;
  --bg-secondary: #f2ebe3;
  --bg-card: #ffffff;
  --bg-subtle: #eae1d7;
  --bg-hover: #e2d6c9;

  --border-light: #dfd3c6;
  --border-dark: #936653;

  --text-main: #936653;
  --text-dark: #5e3b2e;
  --text-muted: #a78170;
  --text-light: #c5a99c;

  --color-black: #936653;
  --color-brown: #936653;
  --color-brown-dark: #6e4433;
  --color-white: #f8f6f3;
  --color-orange: #f9a127;
  --color-yellow: #f1dd9d;
  --color-danger: #5e3b2e;
  --color-success: #936653;

  --font-family-base: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-sans: var(--font-family-base);
  --font-mono: var(--font-family-base);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --sidebar-width: 250px;
  --header-height: 56px;
  --bottom-nav-height: 60px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(--font-family-base);
  -webkit-tap-highlight-color: transparent;
}

body, button, input, select, textarea {
  font-family: var(--font-family-base);
}

html {
  overflow-x: hidden;
  max-width: 100vw;
  width: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  width: 100%;
  max-width: 100vw;
  touch-action: pan-y pinch-zoom;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.spin-anim {
  animation: spin 0.6s linear infinite !important;
  display: inline-block;
}

#app {
  display: flex;
  min-height: 100vh;
  background-color: var(--bg-primary);
}

/* Sidebar Navigation */
.sidebar {
  width: var(--sidebar-width);
  background-color: var(--color-white);
  border-right: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 40;
  user-select: none;
}

.sidebar-header {
  padding: 20px 20px 16px 20px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.brand-logo-img {
  height: 54px;
  width: auto;
  max-width: 140px;
  object-fit: contain;
  margin-bottom: 8px;
  display: block;
}

.brand-title {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--color-brown);
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-badge {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: var(--color-orange);
  color: #ffffff;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
}

.brand-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.sidebar-nav {
  padding: 12px 10px;
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-size: 0.92rem;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  background: transparent;
}

.nav-item svg {
  stroke: var(--color-brown);
}

.nav-item:hover {
  background-color: var(--bg-secondary);
}

.nav-item.active {
  background-color: var(--color-brown);
  color: var(--color-white);
}

.nav-item.active svg {
  stroke: var(--color-white);
}

.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--border-light);
  font-size: 0.78rem;
  color: var(--text-muted);
  background-color: var(--color-white);
}

/* Main Content Area */
.main-wrapper {
  flex: 1;
  margin-left: var(--sidebar-width);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-primary);
}

.main-content {
  flex: 1;
  padding: 24px 28px 48px 28px;
  max-width: 1300px;
  margin: 0 auto;
  width: 100%;
}

/* Mobile & iPad Header */
.top-header {
  display: none;
  background-color: var(--color-white);
  border-bottom: 1px solid var(--border-light);
  padding: 10px 16px;
  position: sticky;
  top: 0;
  z-index: 30;
  align-items: center;
  justify-content: space-between;
}

/* Bottom Navigation for Mobile */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: var(--color-white);
  border-top: 1px solid var(--border-light);
  height: var(--bottom-nav-height);
  z-index: 40;
  padding: 4px 6px;
  justify-content: space-around;
  align-items: center;
}

.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 0.68rem;
  font-weight: 600;
  text-decoration: none;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  gap: 2px;
}

.bottom-nav-item svg {
  stroke: var(--text-muted);
}

.bottom-nav-item.active {
  color: var(--color-brown);
  font-weight: 700;
}

.bottom-nav-item.active svg {
  stroke: var(--color-brown);
}

/* Typography */
h1.page-title {
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--color-brown-dark);
}

.page-subtitle {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.page-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 22px;
  flex-wrap: wrap;
  gap: 14px;
}

/* Cards */
.card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: 0 1px 3px rgba(147, 102, 83, 0.05);
}

.card-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--color-brown-dark);
  margin-bottom: 4px;
}

.card-subtitle {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  user-select: none;
  font-family: inherit;
  min-height: 38px;
}

.btn svg {
  stroke: currentColor;
}

.btn-sm {
  padding: 5px 12px;
  font-size: 0.8rem;
  min-height: 30px;
}

.btn-lg {
  padding: 12px 24px;
  font-size: 1rem;
  font-weight: 700;
  min-height: 48px;
}

.btn-primary {
  background-color: var(--color-brown);
  color: var(--color-white);
  border-color: var(--color-brown);
}

.btn-primary:hover {
  background-color: var(--color-brown-dark);
  border-color: var(--color-brown-dark);
}

.btn-secondary {
  background-color: var(--color-white);
  color: var(--color-brown);
  border-color: var(--border-light);
}

.btn-secondary:hover {
  background-color: var(--bg-secondary);
  border-color: var(--color-brown);
}

.btn-accent {
  background-color: var(--color-orange);
  color: #ffffff;
  border-color: var(--color-orange);
}

.btn-accent:hover {
  background-color: #e58d17;
}

.btn-danger {
  background-color: var(--color-white);
  color: var(--color-brown-dark);
  border-color: var(--border-light);
}

.btn-danger:hover {
  background-color: var(--bg-hover);
  border-color: var(--color-brown);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Form Inputs */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--color-brown);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 9px 12px;
  font-size: 0.92rem;
  font-family: inherit;
  color: var(--color-brown-dark);
  background-color: var(--color-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.form-textarea {
  resize: vertical;
  min-height: 64px;
  line-height: 1.45;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--color-brown);
  box-shadow: 0 0 0 3px rgba(147, 102, 83, 0.15);
}

.form-input.number-input {
  font-family: var(--font-mono);
  font-weight: 600;
}

/* Tables */
.table-container {
  overflow-x: auto;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  background-color: var(--bg-card);
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  text-align: left;
}

.table th {
  background-color: var(--bg-secondary);
  padding: 10px 14px;
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-main);
  border-bottom: 1px solid var(--border-light);
}

.table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-light);
  color: var(--text-dark);
}

.table tr:last-child td {
  border-bottom: none;
}

.table tr:hover td {
  background-color: var(--bg-primary);
}

.table td.num {
  font-family: var(--font-family-base);
  font-feature-settings: "tnum";
  font-variant-numeric: tabular-nums;
  font-size: 0.92rem;
  font-weight: 600;
  white-space: nowrap !important;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.badge svg {
  stroke: currentColor;
}

.badge-outline {
  border-color: var(--border-light);
  color: var(--color-brown);
  background: var(--bg-secondary);
}

.badge-active {
  background-color: var(--bg-secondary);
  color: var(--color-brown-dark);
  border-color: var(--border-light);
}

.badge-cancelled {
  background-color: var(--bg-subtle);
  color: var(--text-muted);
  border-color: var(--border-light);
}

.badge-bundle {
  background-color: var(--color-yellow);
  color: var(--color-brown-dark);
  border-color: var(--border-light);
}

.badge-warning {
  background-color: var(--color-yellow);
  color: var(--color-brown-dark);
  border-color: var(--border-light);
}

.badge-accent {
  background-color: var(--color-orange);
  color: #ffffff;
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(94, 59, 46, 0.45);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-card {
  background-color: var(--color-white);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-light);
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 25px -5px rgba(94, 59, 46, 0.2);
  overflow: hidden;
}

.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--color-white);
}

.modal-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--color-brown-dark);
}

.modal-body {
  padding: 22px;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: 16px 22px;
  border-top: 1px solid var(--border-light);
  background-color: var(--bg-secondary);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
}

/* Grid Utilities */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

/* POS Specific Layout */
.pos-layout {
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 20px;
  height: calc(100vh - 110px);
}

.pos-catalog {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
}

.pos-cart-panel {
  background-color: var(--color-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(147, 102, 83, 0.08);
}

.pos-cart-items {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.pos-product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
  overflow-y: auto;
  padding: 4px 2px 20px 2px;
  flex: 1;
}

.product-tap-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  user-select: none;
  min-height: 130px;
  position: relative;
}

.product-tap-card:active {
  transform: scale(0.98);
}

.product-tap-card:hover {
  border-color: var(--color-brown);
  box-shadow: 0 4px 12px rgba(147, 102, 83, 0.12);
}

/* Receipt Printout Style */
.receipt-box {
  background-color: var(--color-white);
  border: 1px dashed var(--border-light);
  padding: 20px;
  border-radius: var(--radius-sm);
  font-family: var(--font-family-base);
  font-size: 0.85rem;
  line-height: 1.6;
  color: var(--color-brown-dark);
}

/* =========================================================
   RESPONSIVE — TABLET & MOBILE
   ========================================================= */

@media (min-width: 769px) {
  .pos-mobile-tabs,
  .pos-floating-cart-bar,
  .pos-mobile-back-btn {
    display: none !important;
  }

  .table--mobile-cards {
    display: table;
  }
  .table--mobile-cards thead {
    display: table-header-group !important;
  }
  .table--mobile-cards tbody {
    display: table-row-group;
  }
  .table--mobile-cards tr {
    display: table-row;
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
  }
  .table--mobile-cards td {
    display: table-cell;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-light);
  }
  .table--mobile-cards td::before {
    display: none !important;
  }
}

/* =========================================================
   TABLET & IPAD (769px - 1024px)
   Compact Rail Sidebar + Rock-solid Fixed Viewport (Zero Shifts)
   ========================================================= */
@media (min-width: 769px) and (max-width: 1024px) {
  :root {
    --sidebar-tablet-width: 76px;
  }

  /* Global viewport lock - prevent any iPad bounce or horizontal drift */
  html, body {
    overflow-x: hidden !important;
    max-width: 100vw !important;
    width: 100% !important;
    overscroll-behavior-x: none;
    -webkit-text-size-adjust: 100%;
  }

  #app, .app-layout {
    max-width: 100vw !important;
    width: 100% !important;
    overflow-x: hidden !important;
  }

  /* Compact rail sidebar for iPad */
  .sidebar {
    width: var(--sidebar-tablet-width) !important;
    padding: 10px 4px !important;
    box-sizing: border-box !important;
  }

  .sidebar .brand-title-wrap,
  .sidebar .brand-subtitle,
  .sidebar .sidebar-footer {
    display: none !important;
  }

  .sidebar-header {
    padding: 6px 2px 10px 2px !important;
    margin-bottom: 8px !important;
    justify-content: center !important;
    align-items: center !important;
    border-bottom: 1px solid var(--border-light) !important;
  }

  .brand-logo-img {
    height: 32px !important;
    width: auto !important;
    margin: 0 auto !important;
  }

  .btn-sidebar-refresh {
    display: none !important;
  }

  .sidebar-nav {
    gap: 4px !important;
    padding: 0 2px !important;
  }

  .nav-item {
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 8px 3px !important;
    gap: 3px !important;
    text-align: center !important;
    border-radius: var(--radius-sm) !important;
  }

  .nav-item span {
    font-size: 0.65rem !important;
    line-height: 1.15 !important;
    font-weight: 700 !important;
    white-space: normal !important;
    text-align: center !important;
    max-width: 68px !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 2 !important;
    -webkit-box-orient: vertical !important;
  }

  .nav-item svg {
    width: 20px !important;
    height: 20px !important;
    flex-shrink: 0 !important;
  }

  /* Main content wrapper on iPad */
  .main-wrapper {
    margin-left: var(--sidebar-tablet-width) !important;
    width: calc(100vw - var(--sidebar-tablet-width)) !important;
    max-width: calc(100vw - var(--sidebar-tablet-width)) !important;
    box-sizing: border-box !important;
    overflow-x: hidden !important;
  }

  .main-content {
    padding: 16px 18px 24px 18px !important;
    box-sizing: border-box !important;
    width: 100% !important;
    max-width: 100% !important;
    overflow-x: hidden !important;
  }

  /* POS layout on iPad */
  .pos-layout {
    grid-template-columns: 1fr 310px !important;
    gap: 14px !important;
    height: calc(100vh - 84px) !important;
    min-width: 0 !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }

  .pos-product-grid {
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)) !important;
    gap: 10px !important;
    padding: 2px 2px 14px 2px !important;
  }

  .product-tap-card {
    padding: 10px !important;
    min-height: 110px !important;
  }

  .pos-cart-panel {
    width: 310px !important;
    min-width: 310px !important;
  }

  /* Critical: Prevent iOS Safari auto-zoom on inputs on iPad */
  .form-input, .form-select, .form-textarea {
    font-size: 16px !important;
    box-sizing: border-box !important;
  }

  /* Table containment on iPad */
  .table-container {
    width: 100% !important;
    max-width: 100% !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
  }
}

/* ---- MOBILE (≤ 768px) ---- */
@media (max-width: 768px) {
  :root {
    --bottom-nav-height: calc(62px + env(safe-area-inset-bottom, 0px));
    --header-height: calc(52px + env(safe-area-inset-top, 0px));
  }

  /* Global viewport lock - NO horizontal scroll anywhere */
  html, body {
    overflow-x: hidden !important;
    max-width: 100vw !important;
    width: 100% !important;
    overscroll-behavior-y: none;
    -webkit-text-size-adjust: 100%;
  }

  #app {
    max-width: 100vw !important;
    width: 100% !important;
    overflow-x: hidden !important;
  }

  /* Hide desktop sidebar, show mobile chrome */
  .sidebar { display: none !important; }

/**
 * Formatting and Math Utilities
 * Consistent RM currency formatting, dates, math rounding, and sequential order numbers.
 */

function round(value, decimals = 2) {
  const factor = Math.pow(10, decimals);
  return Math.round((Number(value) || 0) * factor) / factor;
}

function formatRM(amount) {
  const num = round(amount, 2);
  return `RM ${num.toFixed(2)}`;
}

function parseRM(str) {
  if (typeof str === 'number') return str;
  if (!str) return 0;
  const cleaned = String(str).replace(/[^0-9.-]+/g, '');
  return round(parseFloat(cleaned) || 0);
}

function getTodayDateString() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function formatDate(dateVal) {
  if (!dateVal) return '-';
  const d = new Date(dateVal);
  if (isNaN(d.getTime())) return String(dateVal);
  return d.toLocaleDateString('en-GB', {
    day: '2-digit',
    month: 'short',
    year: 'numeric'
  });
}

function formatTime(dateVal) {
  if (!dateVal) return '-';
  const d = new Date(dateVal);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('en-US', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  });
}

function formatDateTime(dateVal) {
  if (!dateVal) return '-';
  const d = new Date(dateVal);
  if (isNaN(d.getTime())) return String(dateVal);
  return `${formatDate(d)} ${formatTime(d)}`;
}

function generateId(prefix = 'muki') {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
}

/**
 * Sequential Order Number Generator
 * Format: MUKI-YYYYMMDD-00001
 */
function generateOrderNumber(sequence = 1) {
  const d = new Date();
  const datePart = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const seqPart = String(sequence).padStart(5, '0');
  return `MUKI-${datePart}-${seqPart}`;
}

/**
 * IndexedDB Database Layer for Muki Stall Manager
 * Pure browser-native, reliable, persistent local storage.
 * Easily migratable to Firebase / Supabase in the future.
 */

const DB_NAME = 'MukiStallDB';
const DB_VERSION = 1;

let dbInstance = null;
let useLocalStorageFallback = false;

function getLocalStoreItems(storeName) {
  try {
    const raw = localStorage.getItem(`muki_${storeName}`);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function setLocalStoreItems(storeName, items) {
  try {
    localStorage.setItem(`muki_${storeName}`, JSON.stringify(items));
  } catch (e) {
    console.error('localStorage quota exceeded or blocked', e);
  }
}

function openDatabase() {
  if (dbInstance) return Promise.resolve(dbInstance);
  if (useLocalStorageFallback) return Promise.resolve(null);

  return new Promise((resolve) => {
    if (typeof indexedDB === 'undefined') {
      console.warn('IndexedDB not supported, falling back to localStorage');
      useLocalStorageFallback = true;
      return resolve(null);
    }

    try {
      let isSettled = false;
      const timeoutId = setTimeout(() => {
        if (!isSettled) {
          isSettled = true;
          console.warn('IndexedDB open timed out, falling back to localStorage');
          useLocalStorageFallback = true;
          resolve(null);
        }
      }, 2500);

      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;

        // Products Store
        if (!db.objectStoreNames.contains('products')) {
          const productStore = db.createObjectStore('products', { keyPath: 'id' });
          productStore.createIndex('category', 'category', { unique: false });
          productStore.createIndex('is_active', 'is_active', { unique: false });
        }

        // Bundle Recipes Store
        if (!db.objectStoreNames.contains('recipes')) {
          const recipeStore = db.createObjectStore('recipes', { keyPath: 'id' });
          recipeStore.createIndex('parent_product_id', 'parent_product_id', { unique: false });
          recipeStore.createIndex('component_product_id', 'component_product_id', { unique: false });
        }

        // Promotions Store
        if (!db.objectStoreNames.contains('promotions')) {
          const promoStore = db.createObjectStore('promotions', { keyPath: 'id' });
          promoStore.createIndex('is_active', 'is_active', { unique: false });
        }

        // Orders Store
        if (!db.objectStoreNames.contains('orders')) {
          const orderStore = db.createObjectStore('orders', { keyPath: 'id' });
          orderStore.createIndex('order_number', 'order_number', { unique: true });
          orderStore.createIndex('date', 'date', { unique: false });
          orderStore.createIndex('status', 'status', { unique: false });
        }

        // Stock Movement Audit Log
        if (!db.objectStoreNames.contains('stock_movements')) {
          const movementStore = db.createObjectStore('stock_movements', { keyPath: 'id' });
          movementStore.createIndex('product_id', 'product_id', { unique: false });
          movementStore.createIndex('timestamp', 'timestamp', { unique: false });
          movementStore.createIndex('reason', 'reason', { unique: false });
        }

        // Cost Change History Log
        if (!db.objectStoreNames.contains('cost_history')) {
          const costStore = db.createObjectStore('cost_history', { keyPath: 'id' });
          costStore.createIndex('product_id', 'product_id', { unique: false });
          costStore.createIndex('timestamp', 'timestamp', { unique: false });
        }

        // Expenses Store
        if (!db.objectStoreNames.contains('expenses')) {
          const expenseStore = db.createObjectStore('expenses', { keyPath: 'id' });
          expenseStore.createIndex('date', 'date', { unique: false });
          expenseStore.createIndex('category', 'category', { unique: false });
        }

        // Settings Store
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'key' });
        }
      };

      request.onsuccess = (event) => {
        if (isSettled) return;
        isSettled = true;
        clearTimeout(timeoutId);
        dbInstance = event.target.result;
        resolve(dbInstance);
      };

      request.onerror = (event) => {
        if (isSettled) return;
        isSettled = true;
        clearTimeout(timeoutId);
        console.warn('IndexedDB error, falling back to localStorage:', event.target.error);
        useLocalStorageFallback = true;
        resolve(null);
      };

      request.onblocked = () => {
        console.warn('IndexedDB open blocked');
      };
    } catch (e) {
      console.warn('IndexedDB initialization exception, using localStorage:', e);
      useLocalStorageFallback = true;
      resolve(null);
    }
  });
}

/**
 * Generic Read All
 */
async function getAll(storeName) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    return getLocalStoreItems(storeName);
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const request = store.getAll();

      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    } catch (err) {
      console.warn('Error reading store, falling back to localStorage:', err);
      resolve(getLocalStoreItems(storeName));
    }
  });
}

/**
 * Generic Get By ID
 */
async function getById(storeName, id) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    const items = getLocalStoreItems(storeName);
    const keyProp = storeName === 'settings' ? 'key' : 'id';
    return items.find(item => item[keyProp] === id) || null;
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const request = store.get(id);

      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    } catch (err) {
      const items = getLocalStoreItems(storeName);
      const keyProp = storeName === 'settings' ? 'key' : 'id';
      resolve(items.find(item => item[keyProp] === id) || null);
    }
  });
}

/**
 * Generic Put / Upsert Item
 */
async function putItem(storeName, item) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    const items = getLocalStoreItems(storeName);
    const keyProp = storeName === 'settings' ? 'key' : 'id';
    const idx = items.findIndex(i => i[keyProp] === item[keyProp]);
    if (idx >= 0) {
      items[idx] = item;
    } else {
      items.push(item);
    }
    setLocalStoreItems(storeName, items);
    return item[keyProp];
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const request = store.put(item);

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    } catch (err) {
      const items = getLocalStoreItems(storeName);
      const keyProp = storeName === 'settings' ? 'key' : 'id';
      const idx = items.findIndex(i => i[keyProp] === item[keyProp]);
      if (idx >= 0) items[idx] = item; else items.push(item);
      setLocalStoreItems(storeName, items);
      resolve(item[keyProp]);
    }
  });
}

/**
 * Generic Add Item
 */
async function addItem(storeName, item) {
  return putItem(storeName, item);
}

/**
 * Generic Delete Item
 */
async function deleteItem(storeName, id) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    let items = getLocalStoreItems(storeName);
    const keyProp = storeName === 'settings' ? 'key' : 'id';
    items = items.filter(i => i[keyProp] !== id);
    setLocalStoreItems(storeName, items);
    return true;
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const request = store.delete(id);

      request.onsuccess = () => resolve(true);
      request.onerror = () => reject(request.error);
    } catch (err) {
      let items = getLocalStoreItems(storeName);
      const keyProp = storeName === 'settings' ? 'key' : 'id';
      items = items.filter(i => i[keyProp] !== id);
      setLocalStoreItems(storeName, items);
      resolve(true);
    }
  });
}

/**
 * Generic Clear Store
 */
async function clearStore(storeName) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    setLocalStoreItems(storeName, []);
    return true;
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const request = store.clear();

      request.onsuccess = () => resolve(true);
      request.onerror = () => reject(request.error);
    } catch (err) {
      setLocalStoreItems(storeName, []);
      resolve(true);
    }
  });
}

/**
 * Bulk Put Items (in a single transaction)
 */
async function bulkPut(storeName, items) {
  if (!items || !items.length) return [];
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    const existing = getLocalStoreItems(storeName);
    const keyProp = storeName === 'settings' ? 'key' : 'id';
    const map = new Map(existing.map(i => [i[keyProp], i]));
    items.forEach(i => map.set(i[keyProp], i));
    const merged = Array.from(map.values());
    setLocalStoreItems(storeName, merged);
    return items;
  }

  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);

      items.forEach(item => store.put(item));

      tx.oncomplete = () => resolve(items);
      tx.onerror = () => reject(tx.error);
    } catch (err) {
      const existing = getLocalStoreItems(storeName);
      const keyProp = storeName === 'settings' ? 'key' : 'id';
      const map = new Map(existing.map(i => [i[keyProp], i]));
      items.forEach(i => map.set(i[keyProp], i));
      setLocalStoreItems(storeName, Array.from(map.values()));
      resolve(items);
    }
  });
}

/**
 * Transaction Helper
 */
async function runTransaction(storeNames, mode, fn) {
  const db = await openDatabase();
  if (!db || useLocalStorageFallback) {
    return fn(null);
  }
  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeNames, mode);
      let result = fn(tx);
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
    } catch (err) {
      reject(err);
    }
  });
}



// Explicit database adapter namespace for bundled runtime
const db = {
  openDatabase,
  getAll,
  getById,
  putItem,
  addItem,
  deleteItem,
  clearStore,
  bulkPut,
  runTransaction
};

/**
 * Central Reactive Store
 * Manages in-memory cache synchronized with IndexedDB and dispatches change events.
 */





class AppStore {
  constructor() {
    this.products = [];
    this.recipes = [];
    this.promotions = [];
    this.orders = [];
    this.stockMovements = [];
    this.costHistory = [];
    this.expenses = [];
    this.settings = {};
    this.cart = [];
    this.listeners = new Map();
    this.isReady = false;
  }

  // Subscribe to changes: 'products', 'orders', 'cart', 'expenses', etc., or '*' for any change
  subscribe(event, callback) {
    if (!this.listeners.has(event)) {
      this.listeners.set(event, new Set());
    }
    this.listeners.get(event).add(callback);
    return () => this.listeners.get(event)?.delete(callback);
  }

  notify(event, data) {
    if (this.listeners.has(event)) {
      this.listeners.get(event).forEach(cb => cb(data));
    }
    if (this.listeners.has('*')) {
      this.listeners.get('*').forEach(cb => cb({ event, data }));
    }
  }

  async init() {
    await db.openDatabase();
    
    // Check if initial seeding is needed
    const settingsList = await db.getAll('settings');
    const isInitialized = settingsList.some(s => s.key === 'initialized' && s.value === true);

    if (!isInitialized) {
      console.log('First launch detected. Seeding initial Muki data...');
      await db.bulkPut('products', INITIAL_PRODUCTS);
      await db.bulkPut('recipes', INITIAL_RECIPES);
      await db.bulkPut('promotions', INITIAL_PROMOTIONS);
      for (const s of INITIAL_SETTINGS) {
        await db.putItem('settings', s);
      }
    }

    await this.refreshAll();
    this.isReady = true;
    this.notify('ready', true);
  }

  async refreshAll() {
    const [products, recipes, promotions, orders, stockMovements, costHistory, expenses, settingsList] = await Promise.all([
      db.getAll('products'),
      db.getAll('recipes'),
      db.getAll('promotions'),
      db.getAll('orders'),
      db.getAll('stock_movements'),
      db.getAll('cost_history'),
      db.getAll('expenses'),
      db.getAll('settings')
    ]);

    // Ensure sort_order on products and sort by sequence
    products.forEach((p, idx) => {
      if (typeof p.sort_order !== 'number') {
        p.sort_order = idx + 1;
      }
    });
    this.products = products.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    this.recipes = recipes;
    this.promotions = promotions;
    // Sort orders newest first
    this.orders = orders.sort((a, b) => new Date(b.created_at || b.timestamp) - new Date(a.created_at || a.timestamp));
    this.stockMovements = stockMovements.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    this.costHistory = costHistory.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    this.expenses = expenses.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    this.settings = {};
    settingsList.forEach(s => {
      this.settings[s.key] = s.value;
    });

    this.notify('all_refreshed');
  }

  // --- Helpers for Component-based Inventory ---

  /**
   * Get recipes for a bundle product
   */
  getProductRecipes(productId) {
    return this.recipes.filter(r => r.parent_product_id === productId);
  }

  /**
   * Check if a product is a bundle or has recipe components
   */
  isBundleProduct(productId) {
    const prod = this.products.find(p => p.id === productId);
    if (!prod) return false;
    if (prod.is_bundle) return true;
    return this.recipes.some(r => r.parent_product_id === productId);
  }

  /**
   * Calculate available stock for a product:
   * - If regular product: its own stock.
   * - If bundle product: min(floor(component_stock / component_qty)) for each component recipe.
   */
  getAvailableStock(productId) {
    const prod = this.products.find(p => p.id === productId);
    if (!prod) return 0;

    const recipes = this.getProductRecipes(productId);
    if (!recipes || recipes.length === 0) {
      return Number(prod.stock) || 0;
    }

    // It's a bundle with components! Calculate how many can be assembled
    let maxAssemble = Infinity;
    for (const r of recipes) {
      const comp = this.products.find(p => p.id === r.component_product_id);
      const compStock = comp ? Math.max(0, Number(comp.stock) || 0) : 0;
      const reqQty = Number(r.quantity) || 1;
      const possible = Math.floor(compStock / reqQty);
      if (possible < maxAssemble) {
        maxAssemble = possible;
      }
    }

    return maxAssemble === Infinity ? 0 : maxAssemble;
  }

  /**
   * Calculate the live cost of a product:
   * - If it has a recipe, can compute sum of component costs or use set cost.
   */
  getComputedCost(productId, quantity = 1) {
    const prod = this.products.find(p => p.id === productId);
    if (!prod) return 0;

    const recipes = this.getProductRecipes(productId);
    if (recipes && recipes.length > 0) {
      let sumCost = 0;
      for (const r of recipes) {
        const comp = this.products.find(p => p.id === r.component_product_id);
        const compCost = comp ? this.getComputedCost(comp.id, (Number(r.quantity) || 1) * quantity) : 0;
        sumCost += compCost * (Number(r.quantity) || 1);
      }
      return round(sumCost);
    }

    // Single physical product: evaluate against FIFO batches
    if (Array.isArray(prod.cost_batches) && prod.cost_batches.length > 0) {
      let needed = Math.max(1, Number(quantity) || 1);
      let costSum = 0;
      for (const b of prod.cost_batches) {
        const bRem = Number(b.remaining_qty) || 0;
        if (bRem > 0) {
          const take = Math.min(needed, bRem);
          costSum += take * (Number(b.unit_cost) || 0);
          needed -= take;
          if (needed <= 0) break;
        }
      }
      if (needed > 0) {
        costSum += needed * (Number(prod.cost) || 0);
      }
      return round(costSum / Math.max(1, Number(quantity) || 1));
    }

    return Number(prod.cost) || 0;
  }

  /**
   * Calculate total valuation of inventory at cost (Total Inventory Investment / Stock Value):
   */
  getTotalInventoryCost() {
    let totalCost = 0;
    for (const p of this.products) {
      if (this.isBundleProduct(p.id)) continue;
      if (Array.isArray(p.cost_batches) && p.cost_batches.length > 0) {
        for (const b of p.cost_batches) {
          const rem = Math.max(0, Number(b.remaining_qty) || 0);
          const uCost = Number(b.unit_cost) || 0;
          totalCost += rem * uCost;
        }
      } else {
        const stock = Math.max(0, Number(p.stock) || 0);
        const cost = Number(p.cost) || 0;
        totalCost += stock * cost;
      }
    }
    return round(totalCost);
  }

  /**
   * Calculate total potential retail valuation of physical inventory:
   */
  getTotalInventoryRetailValue() {
    let totalRetail = 0;
    for (const p of this.products) {
      if (this.isBundleProduct(p.id)) continue;
      const stock = Math.max(0, Number(p.stock) || 0);
      const price = Number(p.selling_price) || 0;
      totalRetail += stock * price;
    }
    return round(totalRetail);
  }

  /**
   * Total physical sellable pieces across non-bundle products:
   */
  getTotalPhysicalStock() {
    let totalUnits = 0;
    for (const p of this.products) {
      if (this.isBundleProduct(p.id)) continue;
      totalUnits += Math.max(0, Number(p.stock) || 0);
    }
    return totalUnits;
  }

  // --- Categories Management ---
  getCategories() {
    const defaultCats = ['Mukichip', 'Accessories', 'Stickers', 'Bundles', 'Other'];
    const custom = this.settings.custom_categories;
    if (Array.isArray(custom) && custom.length > 0) {
      return custom;
    }
    return defaultCats;
  }

  async addCategory(name) {
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    const cats = [...this.getCategories()];
    if (!cats.includes(trimmed)) {
      cats.push(trimmed);
      await db.putItem('settings', { key: 'custom_categories', value: cats });
      await this.refreshAll();
    }
  }

  async deleteCategory(name) {
    let cats = this.getCategories().filter(c => c !== name);
    if (cats.length === 0) cats = ['Other'];
    await db.putItem('settings', { key: 'custom_categories', value: cats });
    await this.refreshAll();
  }

  async reorderCategories(newCategories) {
    if (!Array.isArray(newCategories) || newCategories.length === 0) return;
    await db.putItem('settings', { key: 'custom_categories', value: newCategories });
    await this.refreshAll();
  }

  // --- Operating Expenses Categories Management ---
  getExpenseCategories() {
    const defaultExpenseCats = ['Stall rental', 'Transportation', 'Packaging', 'Printing', 'Defect & Wastage', 'Other'];
    const custom = this.settings.custom_expense_categories;
    if (Array.isArray(custom) && custom.length > 0) {
      return custom;
    }
    return defaultExpenseCats;
  }

  async addExpenseCategory(name) {
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    const cats = [...this.getExpenseCategories()];
    if (!cats.includes(trimmed)) {
      cats.push(trimmed);
      await db.putItem('settings', { key: 'custom_expense_categories', value: cats });
      await this.refreshAll();
    }
  }

  async deleteExpenseCategory(name) {
    let cats = this.getExpenseCategories().filter(c => c !== name);
    if (cats.length === 0) cats = ['Other'];
    await db.putItem('settings', { key: 'custom_expense_categories', value: cats });
    await this.refreshAll();
  }

  async reorderExpenseCategories(newCategories) {
    if (!Array.isArray(newCategories) || newCategories.length === 0) return;
    await db.putItem('settings', { key: 'custom_expense_categories', value: newCategories });
    await this.refreshAll();
  }

  // --- Product Ordering / Sequence Management ---
  async moveProduct(productId, direction) {
    const idx = this.products.findIndex(p => p.id === productId);
    if (idx === -1) return;

    const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
    if (targetIdx < 0 || targetIdx >= this.products.length) return;

    const current = this.products[idx];
    const target = this.products[targetIdx];

    const currentOrder = current.sort_order ?? (idx + 1);
    const targetOrder = target.sort_order ?? (targetIdx + 1);

    if (currentOrder === targetOrder) {
      this.products.splice(idx, 1);
      this.products.splice(targetIdx, 0, current);
      for (let i = 0; i < this.products.length; i++) {
        this.products[i].sort_order = i + 1;
        await db.putItem('products', this.products[i]);
      }
    } else {
      current.sort_order = targetOrder;
      target.sort_order = currentOrder;
      await db.putItem('products', current);
      await db.putItem('products', target);
    }

    await this.refreshAll();
  }

  async reorderProducts(reorderedProductIds) {
    if (!Array.isArray(reorderedProductIds) || reorderedProductIds.length === 0) return;

    for (let i = 0; i < reorderedProductIds.length; i++) {
      const id = reorderedProductIds[i];
      const prod = this.products.find(p => p.id === id);
      if (prod) {
        prod.custom_order = i + 1;
        prod.sort_order = i + 1;
        await db.putItem('products', prod);
      }
    }

    // Persist user-defined custom sequence
    await db.putItem('settings', { key: 'custom_product_order', value: reorderedProductIds });
    this.products.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    await this.refreshAll();
  }

  async sortProductsBy(criteria) {
    // Restore saved custom user-defined sequence
    if (criteria === 'custom' || criteria === 'default') {
      const setting = await db.getById('settings', 'custom_product_order');
      const orderIds = setting?.value;
      if (Array.isArray(orderIds) && orderIds.length > 0) {
        for (let i = 0; i < orderIds.length; i++) {
          const prod = this.products.find(p => p.id === orderIds[i]);
          if (prod) {
            prod.sort_order = i + 1;
            await db.putItem('products', prod);
          }
        }
      } else {
        const sorted = [...this.products].sort((a, b) => (a.custom_order || a.sort_order || 0) - (b.custom_order || b.sort_order || 0));
        for (let i = 0; i < sorted.length; i++) {
          sorted[i].sort_order = i + 1;
          await db.putItem('products', sorted[i]);
        }
      }
      await this.refreshAll();
      return;
    }

    let sorted = [...this.products];
    if (criteria === 'name_asc') {
      sorted.sort((a, b) => a.name.localeCompare(b.name));
    } else if (criteria === 'name_desc') {
      sorted.sort((a, b) => b.name.localeCompare(a.name));
    } else if (criteria === 'price_desc') {
      sorted.sort((a, b) => (Number(b.selling_price) || 0) - (Number(a.selling_price) || 0));
    } else if (criteria === 'price_asc') {
      sorted.sort((a, b) => (Number(a.selling_price) || 0) - (Number(b.selling_price) || 0));
    } else if (criteria === 'stock_asc') {
      sorted.sort((a, b) => this.getPhysicalStock(a.id) - this.getPhysicalStock(b.id));
    } else if (criteria === 'stock_desc') {
      sorted.sort((a, b) => this.getPhysicalStock(b.id) - this.getPhysicalStock(a.id));
    } else if (criteria === 'available_asc') {
      sorted.sort((a, b) => this.getAvailableStock(a.id) - this.getAvailableStock(b.id));
    } else if (criteria === 'available_desc') {
      sorted.sort((a, b) => this.getAvailableStock(b.id) - this.getAvailableStock(a.id));
    } else if (criteria === 'cost_desc') {
      sorted.sort((a, b) => (Number(b.cost) || 0) - (Number(a.cost) || 0));
    } else if (criteria === 'cost_asc') {
      sorted.sort((a, b) => (Number(a.cost) || 0) - (Number(b.cost) || 0));
    } else if (criteria === 'category') {
      sorted.sort((a, b) => (a.category || '').localeCompare(b.category || '') || a.name.localeCompare(b.name));
    }

    for (let i = 0; i < sorted.length; i++) {
      sorted[i].sort_order = i + 1;
      await db.putItem('products', sorted[i]);
    }
    await this.refreshAll();
  }

  // --- Cart Management for POS ---

  // Calculate unit price considering tiered quantity pricing
  getProductUnitPrice(product, quantity = 1) {
    if (!product) return 0;
    const basePrice = Number(product.selling_price) || 0;
    const tiers = Array.isArray(product.pricing_tiers) ? product.pricing_tiers : [];
    if (tiers.length === 0) return basePrice;

    // Sort tiers descending by min_qty: higher quantity tiers apply first
    const validTiers = [...tiers]
      .filter(t => (Number(t.min_qty) || 0) > 1 && (Number(t.unit_price) || 0) > 0)
      .sort((a, b) => Number(b.min_qty) - Number(a.min_qty));

    for (const tier of validTiers) {
      if (quantity >= Number(tier.min_qty)) {
        return Number(tier.unit_price);
      }
    }
    return basePrice;
  }

  addToCart(productId, quantity = 1, isFreeGift = false) {
    const product = this.products.find(p => p.id === productId);
    if (!product) return false;

    const existingIndex = this.cart.findIndex(item => item.productId === productId && Boolean(item.isFreeGift) === Boolean(isFreeGift));
    if (existingIndex >= 0) {
      this.cart[existingIndex].quantity += quantity;
      const item = this.cart[existingIndex];
      // Automatically apply tiered pricing if not custom price / free gift
      if (!item.isFreeGift && !item.isCustomPrice && item.product) {
        item.unitPrice = this.getProductUnitPrice(item.product, item.quantity);
      }
    } else {
      const cartItemId = 'citem_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      const unitPrice = isFreeGift ? 0 : this.getProductUnitPrice(product, quantity);
      this.cart.push({
        cartItemId,
        productId,
        product,
        quantity,
        unitPrice,
        unitCost: this.getComputedCost(productId),
        isCustomPrice: Boolean(isFreeGift),
        isFreeGift: Boolean(isFreeGift)
      });
    }

    this.notify('cart', this.cart);
    return true;
  }

  addFreeGiftToCart(productId, quantity = 1) {
    return this.addToCart(productId, quantity, true);
  }

  toggleCartItemGift(identifier) {
    const item = this.cart.find(i => i.cartItemId === identifier || i.productId === identifier);
    if (!item) return;

    if (item.isFreeGift) {
      item.isFreeGift = false;
      item.isCustomPrice = false;
      item.unitPrice = Number(item.product?.selling_price) || 0;
    } else {
      item.isFreeGift = true;
      item.isCustomPrice = true;
      item.unitPrice = 0;
    }
    this.notify('cart', this.cart);
  }

  updateCartQty(identifier, delta) {
    const item = this.cart.find(i => i.cartItemId === identifier || i.productId === identifier);
    if (!item) return;

    item.quantity += delta;
    if (item.quantity <= 0) {
      this.removeFromCart(identifier);
    } else {
      if (!item.isFreeGift && !item.isCustomPrice && item.product) {
        item.unitPrice = this.getProductUnitPrice(item.product, item.quantity);
      }
      this.notify('cart', this.cart);
    }
  }

  setCartQty(identifier, exactQty) {
    const item = this.cart.find(i => i.cartItemId === identifier || i.productId === identifier);
    if (!item) return;

    const qty = parseInt(exactQty, 10);
    if (isNaN(qty) || qty <= 0) {
      this.removeFromCart(identifier);
    } else {
      item.quantity = qty;
      if (!item.isFreeGift && !item.isCustomPrice && item.product) {
        item.unitPrice = this.getProductUnitPrice(item.product, item.quantity);
      }
      this.notify('cart', this.cart);
    }
  }

  updateCartItemPrice(identifier, newPrice) {
    const item = this.cart.find(i => i.cartItemId === identifier || i.productId === identifier);
    if (!item) return;
    const parsed = Math.max(0, round(parseFloat(newPrice) || 0));
    item.unitPrice = parsed;
    item.isCustomPrice = true;
    if (item.isFreeGift && parsed > 0) {
      item.isFreeGift = false;
    }
    this.notify('cart', this.cart);
  }

  setManualDiscount(amount) {
    this.manualDiscount = Math.max(0, round(parseFloat(amount) || 0));
    this.notify('cart', this.cart);
  }

  getManualDiscount() {
    return this.manualDiscount || 0;
  }

  removeFromCart(identifier) {
    this.cart = this.cart.filter(item => item.cartItemId !== identifier && item.productId !== identifier);
    this.notify('cart', this.cart);
  }

  clearCart() {
    this.cart = [];
    this.manualDiscount = 0;
    this.notify('cart', this.cart);
  }
}

/**
 * Inventory Service
 * Handles component-based bundle deductions, stock adjustments, recipe management, and audit trails.
 */





/**
 * Deduct inventory for an order's items.
 * If an item is a bundle with a recipe, deducts component stock.
 * Otherwise, deducts item's own stock.
 * Creates stock_movement records for every change.
 */
async function deductStockForOrder(items, orderId, orderNumber) {
  const timestamp = new Date().toISOString();
  const deductions = []; // Array of { productId, delta, reason, notes }

  for (const item of items) {
    const qty = Number(item.quantity || item.qty) || 1;
    const recipes = store.getProductRecipes(item.productId || item.product_id);

    if (recipes && recipes.length > 0) {
      // Bundle: deduct each component
      for (const recipe of recipes) {
        const componentQty = (Number(recipe.quantity) || 1) * qty;
        deductions.push({
          productId: recipe.component_product_id,
          delta: -componentQty,
          reason: 'sale',
          notes: `Sold via bundle: ${item.name || item.product?.name} (Qty: ${qty}) [Order ${orderNumber}]`
        });
      }
    } else {
      // Single product: deduct direct stock
      deductions.push({
        productId: item.productId || item.product_id,
        delta: -qty,
        reason: 'sale',
        notes: `Sold directly (Qty: ${qty}) [Order ${orderNumber}]`
      });
    }
  }

  // Apply all deductions in database and log movements with FIFO batch deduction
  for (const ded of deductions) {
    const product = await db.getById('products', ded.productId);
    if (!product) continue;

    const previousStock = Number(product.stock) || 0;
    const newStock = previousStock + ded.delta; // delta is negative
    product.stock = newStock;
    product.updated_at = timestamp;

    // Deduct from FIFO batches if product has batches or initialize batches
    let batches = Array.isArray(product.cost_batches) && product.cost_batches.length > 0
      ? product.cost_batches
      : [{
          id: 'batch_init_' + product.id,
          date: product.date || timestamp.split('T')[0],
          initial_qty: previousStock,
          remaining_qty: previousStock,
          unit_cost: Number(product.cost) || 0,
          cost_breakdown: Array.isArray(product.cost_breakdown) ? product.cost_breakdown : [],
          notes: 'Initial inventory batch'
        }];

    let qtyToDeduct = Math.abs(ded.delta);
    for (const batch of batches) {
      const bRem = Number(batch.remaining_qty) || 0;
      if (bRem > 0) {
        const take = Math.min(qtyToDeduct, bRem);
        batch.remaining_qty = bRem - take;
        qtyToDeduct -= take;
        if (qtyToDeduct <= 0) break;
      }
    }

    product.cost_batches = batches;

    // Update active unit cost to the currently active FIFO batch (first batch with remaining_qty > 0)
    const activeBatch = batches.find(b => (Number(b.remaining_qty) || 0) > 0);
    if (activeBatch) {
      product.cost = Number(activeBatch.unit_cost) || 0;
    }

    await db.putItem('products', product);

    // Record movement audit
    await db.addItem('stock_movements', {
      id: generateId('smov'),
      product_id: ded.productId,
      product_name: product.name,
      delta: ded.delta,
      previous_stock: previousStock,
      new_stock: newStock,
      reason: ded.reason,
      order_id: orderId,
      order_number: orderNumber,
      notes: ded.notes,
      timestamp
    });
  }

  await store.refreshAll();
  return deductions;
}

/**
 * Restore inventory when an order is cancelled.
 * Reverses the exact deductions made for the order.
 */
async function restoreStockForCancelledOrder(order) {
  if (!order || order.status === 'cancelled') {
    throw new Error('Order is already cancelled or invalid.');
  }

  const timestamp = new Date().toISOString();
  const restorations = [];

  for (const item of order.items) {
    const qty = Number(item.quantity || item.qty) || 1;
    const recipes = store.getProductRecipes(item.productId || item.product_id);

    if (recipes && recipes.length > 0) {
      for (const recipe of recipes) {
        const componentQty = (Number(recipe.quantity) || 1) * qty;
        restorations.push({
          productId: recipe.component_product_id,
          delta: +componentQty,
          notes: `Restored from cancelled order ${order.order_number} (${item.name || 'Bundle'} x${qty})`
        });
      }
    } else {
      restorations.push({
        productId: item.productId || item.product_id,
        delta: +qty,
        notes: `Restored from cancelled order ${order.order_number} (${item.name} x${qty})`
      });
    }
  }

  for (const res of restorations) {
    const product = await db.getById('products', res.productId);
    if (!product) continue;

    const previousStock = Number(product.stock) || 0;
    const newStock = previousStock + res.delta;
    product.stock = newStock;
    product.updated_at = timestamp;

    await db.putItem('products', product);

    await db.addItem('stock_movements', {
      id: generateId('smov'),
      product_id: res.productId,
      product_name: product.name,
      delta: res.delta,
      previous_stock: previousStock,
      new_stock: newStock,
      reason: 'order_cancellation',
      order_id: order.id,
      order_number: order.order_number,
      notes: res.notes,
      timestamp
    });
  }

  await store.refreshAll();
  return restorations;
}

/**
 * Manual stock adjustment with audit logging
 */
async function adjustStock({ productId, adjustmentType, quantity, notes, recordAsExpense = false, lossAmount = 0 }) {
  const product = await db.getById('products', productId);
  if (!product) throw new Error('Product not found.');

  const timestamp = new Date().toISOString();
  const previousStock = Number(product.stock) || 0;
  let delta = 0;
  let newStock = previousStock;

  const numQty = Math.abs(parseInt(quantity, 10) || 0);

  switch (adjustmentType) {
    case 'receipt': // New stock received (+)
      delta = numQty;
      newStock = previousStock + numQty;
      break;
    case 'damaged': // Damaged item / production defect (-)
      delta = -numQty;
      newStock = previousStock - numQty;
      break;
    case 'missing': // Missing stock (-)
      delta = -numQty;
      newStock = previousStock - numQty;
      break;
    case 'correction': // Stock correction (set exact quantity)
      newStock = parseInt(quantity, 10) || 0;
      delta = newStock - previousStock;
      break;
    default:
      throw new Error(`Unknown adjustment type: ${adjustmentType}`);
  }

  product.stock = newStock;
  product.updated_at = timestamp;
  await db.putItem('products', product);

  const unitCost = Number(product.cost) || 0;
  const computedLoss = Math.round(((Number(lossAmount) || (numQty * unitCost))) * 100) / 100;

  // If damaged or missing and recordAsExpense is enabled, automatically log to Operating Expenses
  if ((adjustmentType === 'damaged' || adjustmentType === 'missing') && recordAsExpense && computedLoss > 0) {
    const today = new Date().toISOString().split('T')[0];
    await db.addItem('expenses', {
      id: generateId('exp'),
      date: today,
      name: `Wastage: ${numQty}x ${product.name}`,
      category: 'Defect & Wastage',
      amount: computedLoss,
      notes: notes ? `${notes} (Damage deduction: -${numQty} pcs @ RM${unitCost.toFixed(2)}/ea)` : `Production/stall damage loss: -${numQty} pcs @ RM${unitCost.toFixed(2)}/ea`,
      created_at: timestamp
    });
  }

  await db.addItem('stock_movements', {
    id: generateId('smov'),
    product_id: productId,
    product_name: product.name,
    delta,
    previous_stock: previousStock,
    new_stock: newStock,
    reason: adjustmentType,
    order_id: null,
    order_number: null,
    loss_amount: (adjustmentType === 'damaged' || adjustmentType === 'missing') ? computedLoss : 0,
    notes: notes || `Manual stock adjustment (${adjustmentType})`,
    timestamp
  });

  await store.refreshAll();
  return { previousStock, newStock, delta, loss: computedLoss };
}

/**
 * Recipe management for bundles
 */
async function saveRecipe(parentProductId, components) {
  // Remove existing recipes for parent
  const existing = await db.getAll('recipes');
  for (const r of existing) {
    if (r.parent_product_id === parentProductId) {
      await db.deleteItem('recipes', r.id);
    }
  }

  // Insert new recipes
  for (const comp of components) {
    if (!comp.component_product_id || !comp.quantity) continue;
    await db.addItem('recipes', {
      id: generateId('rec'),
      parent_product_id: parentProductId,
      component_product_id: comp.component_product_id,
      quantity: Number(comp.quantity) || 1
    });
  }

  await store.refreshAll();
}


/**
 * Manage Stall Display Samples
 * Actions:
 * - 'take_for_display': Move quantity from sellable stock to display_stock
 * - 'return_to_stock': Return display_stock back to sellable stock
 * - 'scrap_display': Discard worn/damaged display sample, optionally record loss to Expenses
 */
async function manageDisplaySample({ productId, action, quantity = 1, notes = '', recordAsExpense = true }) {
  const product = await db.getById('products', productId);
  if (!product) throw new Error('Product not found.');

  const timestamp = new Date().toISOString();
  const currentSellable = Number(product.stock) || 0;
  const currentDisplay = Number(product.display_stock) || 0;
  const numQty = Math.max(1, parseInt(quantity, 10) || 1);
  const unitCost = Number(product.cost) || 0;

  if (action === 'take_for_display') {
    if (currentSellable < numQty) {
      throw new Error(`Cannot set aside ${numQty} for display: only ${currentSellable} in sellable stock.`);
    }
    product.stock = currentSellable - numQty;
    product.display_stock = currentDisplay + numQty;
    product.updated_at = timestamp;
    await db.putItem('products', product);

    await db.addItem('stock_movements', {
      id: generateId('smov'),
      product_id: productId,
      product_name: product.name,
      delta: -numQty,
      previous_stock: currentSellable,
      new_stock: product.stock,
      reason: 'display_take',
      notes: notes ? `${notes} (Set aside ${numQty} for stall display)` : `Moved ${numQty} unit(s) to stall display sample`,
      timestamp
    });
  } else if (action === 'return_to_stock') {
    if (currentDisplay < numQty) {
      throw new Error(`Cannot return ${numQty} from display: only ${currentDisplay} on display.`);
    }
    product.stock = currentSellable + numQty;
    product.display_stock = currentDisplay - numQty;
    product.updated_at = timestamp;
    await db.putItem('products', product);

    await db.addItem('stock_movements', {
      id: generateId('smov'),
      product_id: productId,
      product_name: product.name,
      delta: +numQty,
      previous_stock: currentSellable,
      new_stock: product.stock,
      reason: 'display_return',
      notes: notes ? `${notes} (Returned ${numQty} display sample to stock)` : `Returned ${numQty} display sample(s) back to sellable stock`,
      timestamp
    });
  } else if (action === 'scrap_display') {
    if (currentDisplay < numQty) {
      throw new Error(`Cannot scrap ${numQty} from display: only ${currentDisplay} on display.`);
    }
    product.display_stock = currentDisplay - numQty;
    product.updated_at = timestamp;
    await db.putItem('products', product);

    const loss = Math.round(numQty * unitCost * 100) / 100;
    if (recordAsExpense && loss > 0) {
      const today = new Date().toISOString().split('T')[0];
      await db.addItem('expenses', {
        id: generateId('exp'),
        date: today,
        name: `Display Scrapped: ${numQty}x ${product.name}`,
        category: 'Defect & Wastage',
        amount: loss,
        notes: notes ? `${notes} (Display sample retired @ RM${unitCost.toFixed(2)}/ea)` : `Display sample worn out / retired (-${numQty} pcs)`,
        created_at: timestamp
      });
    }

    await db.addItem('stock_movements', {
      id: generateId('smov'),
      product_id: productId,
      product_name: product.name,
      delta: 0,
      previous_stock: currentSellable,
      new_stock: currentSellable,
      loss_amount: loss,
      reason: 'display_scrapped',
      notes: notes ? `${notes} (Display sample scrapped, Loss RM${loss.toFixed(2)})` : `Scrapped ${numQty} worn display sample(s) (Loss: RM ${loss.toFixed(2)})`,
      timestamp
    });
  }

  await store.refreshAll();
  return product;
}

/**
 * Promotions Service
 * Evaluates bundle promos, discount rules, and tracks promo usage counts.
 */





/**
 * Checks if a promotion is currently valid based on active status and dates
 */
function isPromotionValid(promo, date = new Date()) {
  if (!promo || !promo.is_active) return false;
  
  const currentDate = date.toISOString().split('T')[0];
  if (promo.start_date && currentDate < promo.start_date) return false;
  if (promo.end_date && currentDate > promo.end_date) return false;

  return true;
}

/**
 * Calculate the discount for the current cart given a promotion
 */
function calculatePromotionDiscount(promo, cartItems, cartSubtotal) {
  if (!promo || !isPromotionValid(promo)) return 0;

  if (promo.type === 'bundle_price') {
    // Check if cart contains required bundle items
    if (promo.bundle_recipe && promo.bundle_recipe.length > 0) {
      // Find how many complete sets exist in cart
      let maxSets = Infinity;
      let regularSetPrice = 0;

      for (const req of promo.bundle_recipe) {
        const inCart = cartItems.find(i => (i.productId || i.product_id) === req.product_id);
        const qtyInCart = inCart ? (Number(inCart.quantity || inCart.qty) || 0) : 0;
        const requiredQty = Number(req.quantity) || 1;
        const sets = Math.floor(qtyInCart / requiredQty);
        if (sets < maxSets) maxSets = sets;

        // Add regular price of required items
        const prod = store.products.find(p => p.id === req.product_id);
        const unitPrice = prod ? Number(prod.selling_price) : 0;
        regularSetPrice += unitPrice * requiredQty;
      }

      if (maxSets > 0 && maxSets !== Infinity) {
        const promoPrice = Number(promo.price) || 0;
        const savingPerSet = Math.max(0, regularSetPrice - promoPrice);
        return round(savingPerSet * maxSets);
      }
    } else {
      // Direct bundle product promotion
      const promoPrice = Number(promo.price) || 0;
      if (cartSubtotal > promoPrice) {
        return round(cartSubtotal - promoPrice);
      }
    }
    return 0;
  }

  if (promo.type === 'fixed_discount') {
    const val = Number(promo.value) || 0;
    return round(Math.min(cartSubtotal, val));
  }

  if (promo.type === 'percent_discount') {
    const pct = Number(promo.value) || 0;
    return round((cartSubtotal * pct) / 100);
  }

  // Spend threshold discount (e.g. Spend RM200 get RM20 off or 10% off)
  if (promo.type === 'spend_threshold_discount') {
    const minSpend = Number(promo.min_spend) || 0;
    if (cartSubtotal >= minSpend) {
      if (promo.discount_type === 'percent') {
        const pct = Number(promo.value) || 0;
        return round((cartSubtotal * pct) / 100);
      } else {
        const val = Number(promo.value) || 0;
        return round(Math.min(cartSubtotal, val));
      }
    }
    return 0;
  }

  // Spend threshold free gift (e.g. Spend RM200 get free gift)
  if (promo.type === 'spend_threshold_gift') {
    const minSpend = Number(promo.min_spend) || 0;
    if (cartSubtotal >= minSpend) {
      // If the gift product is in cart at full price (not already RM0), discount one of it
      const giftItem = cartItems.find(i => (i.productId || i.product_id) === promo.gift_product_id && !i.isFreeGift);
      if (giftItem) {
        return round(Number(giftItem.unitPrice) || 0);
      }
    }
    return 0;
  }

  return 0;
}

/**
 * Record promotion usage in DB when an order completes
 */
async function incrementPromotionUsage(promoId) {
  if (!promoId) return;
  const promo = await db.getById('promotions', promoId);
  if (!promo) return;

  promo.usage_count = (Number(promo.usage_count) || 0) + 1;
  await db.putItem('promotions', promo);
  await store.refreshAll();
}

/**
 * Create or update a promotion
 */
async function savePromotion(promoData) {
  const isNew = !promoData.id;
  const promo = {
    id: promoData.id || generateId('promo'),
    name: promoData.name.trim(),
    description: promoData.description || '',
    type: promoData.type || 'bundle_price',
    price: Number(promoData.price) || 0,
    value: Number(promoData.value) || 0,
    is_active: promoData.is_active !== false,
    bundle_recipe: promoData.bundle_recipe || [],
    start_date: promoData.start_date || '',
    end_date: promoData.end_date || '',
    usage_count: Number(promoData.usage_count) || 0,
    created_at: promoData.created_at || new Date().toISOString()
  };

/**
 * Sales / POS Service
 * Handles order checkout, cost snapshots, profit calculations, inventory deductions, and order cancellations.
 */







let isProcessingOrder = false;

/**
 * Process a new sale from the POS cart
 */
async function createOrder({ cartItems, paymentMethod = 'Cash', paymentNotes = '', promotion = null, customDiscount = 0 }) {
  if (isProcessingOrder) {
    throw new Error('An order is already being processed. Please wait.');
  }

  if (!cartItems || cartItems.length === 0) {
    throw new Error('Cart is empty.');
  }

  try {
    isProcessingOrder = true;

    const timestamp = new Date().toISOString();
    const orderDate = getTodayDateString();
    const orderId = generateId('ord');

    // Calculate sequential order number for today: MUKI-YYYYMMDD-00001
    const d = new Date();
    const datePart = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const todayOrders = (store.orders || []).filter(o => o.date === orderDate);
    let nextSeq = 1;
    todayOrders.forEach(o => {
      if (o.order_number && o.order_number.startsWith(`MUKI-${datePart}-`)) {
        const parts = o.order_number.split('-');
        const seq = parseInt(parts[2], 10);
        if (!isNaN(seq) && seq >= nextSeq) {
          nextSeq = seq + 1;
        }
      } else {
        nextSeq = Math.max(nextSeq, todayOrders.length + 1);
      }
    });
    const orderNumber = generateOrderNumber(nextSeq);

    // 1. Snapshot items with current price and current cost
    let subtotal = 0;
    let totalCogs = 0;

    const itemsSnapshot = cartItems.map(item => {
      const prod = store.products.find(p => p.id === (item.productId || item.product_id));
      const isGift = Boolean(item.isFreeGift);
      const unitPrice = isGift ? 0 : Number(item.unitPrice ?? prod?.selling_price ?? 0);
      const unitCost = Number(item.unitCost ?? store.getComputedCost(prod?.id) ?? 0);
      const qty = Number(item.quantity || item.qty) || 1;

      const itemSubtotal = round(unitPrice * qty);
      const itemCostTotal = round(unitCost * qty);

      subtotal += itemSubtotal;
      totalCogs += itemCostTotal;

      return {
        productId: prod ? prod.id : item.productId,
        name: prod ? prod.name : item.name,
        category: prod ? prod.category : 'General',
        quantity: qty,
        unitPrice: round(unitPrice),
        unitCost: round(unitCost),
        subtotal: itemSubtotal,
        costSubtotal: itemCostTotal,
        isFreeGift: isGift
      };
    });

    subtotal = round(subtotal);
    totalCogs = round(totalCogs);

    // 2. Calculate discount & final payable amount
    const discount = round(customDiscount);
    const finalAmount = round(Math.max(0, subtotal - discount));
    
    // Gross Profit = Actual revenue paid - Cost of goods sold
    const grossProfit = round(finalAmount - totalCogs);

    // 3. Deduct stock (component-based)
    await deductStockForOrder(itemsSnapshot, orderId, orderNumber);

    // 4. Update promotion usage if applied
    if (promotion && promotion.id) {
      await incrementPromotionUsage(promotion.id);
    }

    let finalPaymentMethod = paymentMethod;
    if (paymentMethod === 'Other' && paymentNotes) {
      finalPaymentMethod = `Other (${paymentNotes})`;
    }

    // 5. Build and save order snapshot
    const order = {
      id: orderId,
      order_number: orderNumber,
      date: orderDate,
      timestamp,
      items: itemsSnapshot,
      subtotal,
      discount,
      final_amount: finalAmount,
      total_cost: totalCogs,
      gross_profit: grossProfit,
      payment_method: finalPaymentMethod,
      payment_channel: paymentMethod,
      payment_notes: paymentNotes || '',
      promotion_snapshot: promotion ? {
        id: promotion.id,
        name: promotion.name,
        type: promotion.type,
        discount
      } : null,
      status: 'completed',
      cancellation: null,
      created_at: timestamp
    };

    await db.addItem('orders', order);
    await store.refreshAll();

    // Clear cart after successful sale
    store.clearCart();

    return order;
  } finally {
    isProcessingOrder = false;
  }
}

/**
 * Cancel an order, restore stock, and record audit reason
 */
async function cancelOrder(orderId, reason = 'Customer requested cancellation') {
  const order = await db.getById('orders', orderId);
  if (!order) {
    throw new Error('Order not found.');
  }

  if (order.status === 'cancelled') {
    throw new Error('Order has already been cancelled.');
  }

  // 1. Restore inventory
  await restoreStockForCancelledOrder(order);

  // 2. Update order record with cancellation details
  order.status = 'cancelled';
  order.cancellation = {
    cancelled_at: new Date().toISOString(),
    reason: reason.trim() || 'No reason provided'
  };

  await db.putItem('orders', order);
  await store.refreshAll();

  return order;
}

/**
 * Permanently delete an order and restore stock if not already cancelled
 */
async function deleteOrder(orderId) {
  const order = await db.getById('orders', orderId);
  if (!order) {
    throw new Error('Order not found.');
  }

  // 1. If order was completed, restore inventory back to stock
  if (order.status !== 'cancelled') {
    await restoreStockForCancelledOrder(order);
  }

  // 2. Remove order from database
  await db.deleteItem('orders', orderId);
  await store.refreshAll();

  return true;
}

/**
 * Update product cost and log historical cost change
 */
async function updateProductCost(productId, newCost, notes = '', date = '', components = null) {
  const product = await db.getById('products', productId);
  if (!product) throw new Error('Product not found.');

  const previousCost = Number(product.cost) || 0;
  const parsedNewCost = round(Number(newCost) || 0);

  const timestamp = new Date().toISOString();
  const entryDate = date || timestamp.split('T')[0];

  const breakdownSnapshot = Array.isArray(components)
    ? JSON.parse(JSON.stringify(components))
    : (Array.isArray(product.cost_breakdown) ? JSON.parse(JSON.stringify(product.cost_breakdown)) : []);

  // Update product cost and breakdown
  product.cost = parsedNewCost;
  if (Array.isArray(components)) {
    product.cost_breakdown = breakdownSnapshot;
  }
  product.updated_at = timestamp;
  await db.putItem('products', product);

  // Record cost change history with date, notes, previous/new cost, selling price, and components snapshot
  await db.addItem('cost_history', {
    id: generateId('cost'),
    product_id: productId,
    product_name: product.name,
    previous_cost: previousCost,
    new_cost: parsedNewCost,
    selling_price: Number(product.selling_price) || 0,
    notes: notes || 'Bulk purchase cost breakdown update',
    components: breakdownSnapshot,
    date: entryDate,
    timestamp
  });

  await store.refreshAll();
  return product;
}


/**
 * Update an existing order / receipt
 * Allows modifying payment method, payment notes, timestamp, discount, and item quantities/prices.
 * Automatically synchronizes inventory differences and recalculates totals and profit snapshots.
 */
async function updateOrder(orderId, {
  paymentMethod,
  paymentNotes,
  timestamp,
  discount,
  items
}) {
  const order = await db.getById('orders', orderId);
  if (!order) throw new Error('Order not found.');

  const wasCompleted = order.status !== 'cancelled';

  // If order was completed and items changed, adjust inventory delta
  if (wasCompleted && Array.isArray(items)) {
    // 1. Calculate old item quantities by productId
    const oldQtyMap = {};
    (order.items || []).forEach(it => {
      const pid = it.productId || it.product_id;
      oldQtyMap[pid] = (oldQtyMap[pid] || 0) + (Number(it.quantity || it.qty) || 0);
    });

    // 2. Calculate new item quantities by productId
    const newQtyMap = {};
    items.forEach(it => {
      const pid = it.productId || it.product_id;
      newQtyMap[pid] = (newQtyMap[pid] || 0) + (Number(it.quantity || it.qty) || 0);
    });

    // 3. For each affected product, compute difference: delta = oldQty - newQty
    const allPids = new Set([...Object.keys(oldQtyMap), ...Object.keys(newQtyMap)]);
    for (const pid of allPids) {
      const oldQ = oldQtyMap[pid] || 0;
      const newQ = newQtyMap[pid] || 0;
      const diff = oldQ - newQ; // if old 2, new 1 -> diff +1 (restore 1 to stock)
      if (diff !== 0) {
        const product = await db.getById('products', pid);
        if (product) {
          const prevStock = Number(product.stock) || 0;
          product.stock = prevStock + diff;
          product.updated_at = new Date().toISOString();
          await db.putItem('products', product);

          await db.addItem('stock_movements', {
            id: generateId('smov'),
            product_id: pid,
            product_name: product.name,
            delta: diff,
            previous_stock: prevStock,
            new_stock: product.stock,
            reason: 'order_edit',
            notes: `Receipt edit: Order ${order.order_number} adjusted quantity from ${oldQ} to ${newQ}`,
            timestamp: new Date().toISOString()
          });
        }
      }
    }
  }

  // Recalculate financial totals
  let subtotal = 0;
  let totalCost = 0;
  const newItemsSnapshot = (items || order.items || []).map(it => {
    const qty = Number(it.quantity || it.qty) || 1;
    const unitPrice = Boolean(it.isFreeGift) ? 0 : round(Number(it.unitPrice) || 0);
    const itemSubtotal = round(unitPrice * qty);
    const unitCost = Number(it.unitCost) ?? store.getComputedCost(it.productId);
    const itemCostTotal = round(unitCost * qty);

    subtotal += itemSubtotal;
    totalCost += itemCostTotal;

    return {
      productId: it.productId,
      name: it.name,
      quantity: qty,
      unitPrice,
      unitCost,
      subtotal: itemSubtotal,
      itemCostTotal,
      isFreeGift: Boolean(it.isFreeGift)
    };
  });

  subtotal = round(subtotal);
  totalCost = round(totalCost);

  const appliedDiscount = round(Math.min(subtotal, Math.max(0, Number(discount ?? order.discount) || 0)));
  const finalAmount = round(Math.max(0, subtotal - appliedDiscount));
  const grossProfit = round(finalAmount - totalCost);

  order.payment_method = paymentMethod || order.payment_method;
  order.payment_notes = (paymentNotes !== undefined) ? paymentNotes : (order.payment_notes || '');
  if (timestamp) {
    order.timestamp = timestamp;
    order.date = timestamp.split('T')[0];
  }
  order.items = newItemsSnapshot;
  order.subtotal = subtotal;
  order.discount = appliedDiscount;
  order.final_amount = finalAmount;
  order.total_cost = totalCost;
  order.gross_profit = grossProfit;
  order.updated_at = new Date().toISOString();

  await db.putItem('orders', order);
  await store.refreshAll();
  return order;
}
